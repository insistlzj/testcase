  <style>
    :root{--g1:#333333;--g2:#555555;--g3:#7F7F7F;--g4:#AAAAAA;--g5:#D7D7D7;--g6:#F2F2F2;--g7:#FFFFFF;--success:#2E8B57}
    *{box-sizing:border-box}
    body{margin:0;background:var(--g6);color:var(--g1);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;overflow:hidden}
    .bar{height:52px;padding:0 16px;background:var(--g7);border-bottom:1px solid var(--g5);display:flex;align-items:center;gap:12px}
    .bar button,.bar select,.bar-link{height:32px;border:1px solid var(--g5);border-radius:6px;background:var(--g7);color:var(--g2);font:13px inherit;padding:0 10px}
    .bar-link{width:32px;display:grid;place-items:center;padding:0;text-decoration:none;font-size:17px}
    .app-entry{display:flex;align-items:center;border:1px solid var(--g5);border-radius:6px;overflow:hidden;flex:none}
    .bar .app-entry button{height:30px;border:0;border-right:1px solid var(--g5);border-radius:0;padding:0 11px}
    .bar .app-entry button:last-child{border-right:0}
    .bar .app-entry button.active{background:var(--g1);color:var(--g7);font-weight:600}
    .state-controls{display:flex;align-items:center;gap:8px}.state-controls label{white-space:nowrap}
    .title{font-weight:600;flex:1}
    .layout{display:grid;grid-template-columns:220px minmax(0,1fr) 280px;height:calc(100vh - 52px)}
    .layout.tree-hidden{grid-template-columns:minmax(0,1fr) 280px}
    .layout.notes-hidden{grid-template-columns:220px minmax(0,1fr)}
    .layout.tree-hidden.notes-hidden{grid-template-columns:minmax(0,1fr)}
    aside{background:var(--g7);border-right:1px solid var(--g5);padding:14px;overflow:auto}
    .tree-label{color:var(--g4);font-size:12px;margin:10px 0 6px}
    .tree button{display:block;width:100%;border:0;background:none;text-align:left;padding:10px;border-radius:6px;color:var(--g2);font:14px inherit;cursor:pointer}
    .tree button.active{background:var(--g6);color:var(--g1);font-weight:600}
    .tree button.tree-primary{font-weight:600;color:var(--g1)}
    .tree button.tree-primary:disabled{color:var(--g3);cursor:default}
    .tree .review-group{padding-left:14px;margin-left:10px;border-left:1px solid var(--g6)}
    .tree button.review-view{padding:7px 10px;color:var(--g3);font-size:12px}
    .tree button.review-view.active{background:var(--g6);color:var(--g1);font-weight:600}
    .stage{min-width:0;overflow:auto;display:grid;place-items:center;padding:20px}
    .frame-wrap{position:relative;flex:none}
    iframe{position:absolute;left:0;top:0;border:1px solid var(--g5);background:var(--g6);transform-origin:top left}
    .notes{border-left:1px solid var(--g5);border-right:0;padding:14px}
    .notes-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .notes h2{font-size:15px;margin:0}
    .notes button{min-height:28px;border:1px solid var(--g5);border-radius:5px;background:var(--g7);color:var(--g2);font:12px inherit;padding:0 8px}
    .notes button.primary{border-color:var(--g1);background:var(--g1);color:var(--g7)}
    .note{border-bottom:1px solid var(--g6);padding:0 0 12px;margin:0 0 12px}
    .note b{font-size:13px}
    .note p{margin:6px 0 0;color:var(--g3);font-size:13px;line-height:1.5}
    .note-metrics{margin:6px 0 0}
    .note-metrics div{margin-top:7px}
    .note-metrics dt{color:var(--success);font-size:13px;font-weight:600}
    .note-metrics dd{margin:2px 0 0;color:var(--g3);font-size:13px;line-height:1.5}
    .note-metrics.inline div{line-height:1.5}
    .note-metrics.inline dt,.note-metrics.inline dd{display:inline;margin:0}
    .note-target{display:block!important;max-width:100%;margin-bottom:7px;border:0!important;background:var(--g6)!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
    .note-actions{display:flex;gap:6px;margin-top:8px}
    .note-form{padding:12px 0;border-top:1px solid var(--g5)}
    .note-form label{display:block;margin-bottom:10px;color:var(--g3);font-size:12px}
    .note-form input,.note-form textarea{display:block;width:100%;margin-top:5px;padding:8px;border:1px solid var(--g5);border-radius:5px;background:var(--g7);color:var(--g1);font:13px inherit;outline:none}
    .note-form textarea{min-height:88px;resize:vertical}
    .note-form-actions{display:flex;justify-content:flex-end;gap:7px}
    .note-form-error{min-height:18px;margin-bottom:6px;color:var(--g2);font-size:12px}
    .note-pick.active{border-color:var(--g1);background:var(--g6)}
    .state-hide{display:none!important}
    @media(max-width:900px){
      .layout,.layout.notes-hidden{grid-template-columns:180px minmax(0,1fr)}
      .layout.tree-hidden,.layout.tree-hidden.notes-hidden{grid-template-columns:minmax(0,1fr)}
      .notes{position:fixed;top:52px;right:0;bottom:0;z-index:20;width:min(320px,calc(100vw - 24px));display:block;border-left:1px solid var(--g5);background:var(--g7);box-shadow:-8px 0 24px rgba(0,0,0,.12)}
      .notes.state-hide{display:none!important}
    }
    @media(max-width:640px){.layout,.layout.tree-hidden,.layout.notes-hidden,.layout.tree-hidden.notes-hidden{grid-template-columns:1fr}.tree{display:none}.stage{padding:0;place-items:start center}.bar{overflow:auto}.title{min-width:100px}.layout aside:first-child{display:none}.notes{width:min(320px,100vw)}}
  </style>
</head>

        stateControls.classList.add('state-hide');
        return;
      }
      stateControls.classList.remove('state-hide');
      Object.entries(groups).forEach(([group, names]) => {
        if (!Array.isArray(names) || !names.length) return;
        const label = document.createElement('label');
        const select = document.createElement('select');
        select.dataset.stateGroup = group;
        select.dataset.reloadDefault = String(!grouped);
        const options = grouped ? names : ['默认', ...names];
        options.forEach((name) => select.append(new Option(name, name)));
        const saved = viewerPreferences.url === currentUrl ? viewerPreferences.pageStates[group] : '';
        select.value = options.includes(saved) ? saved : options[0];
        viewerPreferences.pageStates[group] = select.value;
        label.append(`${group} `, select);
        stateControls.append(label);
        if (select.value !== '默认' || grouped) setTimeout(() => applyFrameState(group, select.value), 0);
      });
      if (!stateControls.children.length) resetStateControls();
      saveViewerPreferences();
    }

    function applyPanelPreferences() {
      treePanel.classList.toggle('state-hide', viewerPreferences.treeHidden);
      notesPanel.classList.toggle('state-hide', viewerPreferences.notesHidden);
      layout.classList.toggle('tree-hidden', viewerPreferences.treeHidden);
      layout.classList.toggle('notes-hidden', viewerPreferences.notesHidden);
      treeToggle.setAttribute('aria-expanded', String(!viewerPreferences.treeHidden));
      notesToggle.setAttribute('aria-expanded', String(!viewerPreferences.notesHidden));
    }

    function folderExpanded(key, fallback) {
      const value = viewerPreferences.folders[key];
      return typeof value === 'boolean' ? value : fallback;
    }

    function rememberFolder(key, expanded) {
      viewerPreferences.folders[key] = expanded;
      saveViewerPreferences();
    }

    function noteForm() {
      if (!editingNoteId) return '';
      const note = editingNoteId === 'new' ? null : customNotes.find((item) => item.id === editingNoteId);
      const target = selectedTarget || (note ? { selector: note.selector, label: note.target } : null);
      return `<form class="note-form" id="noteForm">
        <label>关联功能<button class="note-pick${selectionMode ? ' active' : ''}" id="pickTarget" type="button">${target ? escapeHtml(target.label) : (selectionMode ? '选择中' : '选择功能')}</button></label>
        <label>标题<input id="noteTitle" maxlength="40" required value="${escapeHtml(note ? note.title : '')}"></label>
        <label>内容<textarea id="noteContent" maxlength="300" required>${escapeHtml(note ? note.content : '')}</textarea></label>
        <div class="note-form-error" id="noteFormError"></div>
        <div class="note-form-actions"><button type="button" data-note-cancel>取消</button><button class="primary" type="submit">保存</button></div>
      </form>`;
    }

    function renderNotes(file) {
      const builtIn = [...(window.LUMA_ANNOTATIONS['*'] || []), ...(window.LUMA_ANNOTATIONS[file] || [])];
      const added = customNotes.filter((item) => item.file === file);
      const builtInHtml = builtIn.map((item) => {
        const isDataMetrics = item[0].startsWith('数据指标');
        const content = Array.isArray(item[1])
          ? `<dl class="note-metrics${isDataMetrics ? ' inline' : ''}">${item[1].map(metric => `<div><dt>${escapeHtml(metric[0])}${isDataMetrics ? '：' : ''}</dt><dd>${escapeHtml(metric[1])}</dd></div>`).join('')}</dl>`
          : `<p>${escapeHtml(item[1])}</p>`;
        return `<div class="note"><b>${escapeHtml(item[0])}</b>${content}</div>`;
      }).join('');
      const addedHtml = added.map((item) => `<div class="note"><button class="note-target" data-note-locate="${escapeHtml(item.id)}" title="定位到 ${escapeHtml(item.target)}">${escapeHtml(item.target)}</button><b>${escapeHtml(item.title)}</b><p>${escapeHtml(item.content)}</p><div class="note-actions"><button data-note-edit="${escapeHtml(item.id)}">编辑</button><button data-note-delete="${escapeHtml(item.id)}">删除</button></div></div>`).join('');
      notesPanel.innerHTML = `<div class="notes-head"><h2>原型批注</h2><button id="addNote" type="button">添加批注</button></div>${builtInHtml}${addedHtml}${noteForm()}`;
    }

    function postFrameMessage(message) {
      try { frame.contentWindow.postMessage(message, '*'); } catch (error) {}
    }

    function clearFrameTarget() {
      postFrameMessage({ type: 'luma-note-clear' });
    }

    function highlightTarget(selector) {
      if (!selector) return false;
      postFrameMessage({ type: 'luma-note-highlight', selector });
      return true;
    }

    function bindFrameAnnotations() {
      postFrameMessage({ type: 'luma-note-mode', enabled: selectionMode });
      if (selectedTarget?.selector) highlightTarget(selectedTarget.selector);
    }

    function beginTargetSelection() {
      if (!selectionZoom) selectionZoom = zoom.value;
      if (zoom.value !== '1') {
        zoom.value = '1';
        resizeFrame();
      }
    }

    function endTargetSelection() {
      if (!selectionZoom) return;
      zoom.value = selectionZoom;
      selectionZoom = '';
      resizeFrame();
    }

    function resizeFrame() {
      const desktop = current.type === 'desktop';
      const width = desktop ? 1440 : 390;
      const height = desktop ? 900 : 844;
      const scale = Number(zoom.value);
      frame.style.width = `${width}px`;
      frame.style.height = `${height}px`;
      frame.style.zoom = '';
      frame.style.transform = `scale(${scale})`;
      frameWrap.style.width = `${width * scale}px`;
      frameWrap.style.height = `${height * scale}px`;
    }

    function load(page, url = pageUrl(page), restoreControls = false) {
      current = page;
      if (!pendingReviewView) activeReviewId = '';
      editingNoteId = null;
      selectedTarget = null;
      selectionMode = false;
      clearFrameTarget();
      document.querySelector('#title').textContent = displayTitle(page);
      updateAppEntry(page);
      tree.querySelectorAll('[data-file]').forEach((button) => button.classList.toggle('active', button.dataset.file === treeFile(page.file)));
      resetStateControls();
      const canRestore = restoreControls && viewerPreferences.url === url;
      const savedZoom = [...zoom.options].some((option) => option.value === viewerPreferences.zoom) ? viewerPreferences.zoom : '';
      zoom.value = savedZoom || (page.type === 'desktop' ? '.6' : '1');
      resizeFrame();
      currentUrl = url;
      viewerPreferences.url = currentUrl;
      viewerPreferences.zoom = zoom.value;
      if (!canRestore) viewerPreferences.pageStates = {};
      saveViewerPreferences();
      frame.src = currentUrl;
      openPage.href = currentUrl;
      renderNotes(page.file);
      rememberPage(currentUrl);
    }

    function reviewGroupName(group) {
      return /角色|身份|权限/.test(group) ? '角色视角' : '页面状态';
    }

    function runReviewView(view) {
      if (!view || current.file !== view.file) return;
      const reviewId = view.id || `view:${view.title}`;
      const openReviewPanel = () => {
        if (view.selectors?.length || view.hideSelectors?.length) postFrameMessage({ type: 'luma-review-actions', selectors: view.selectors, hideSelectors: view.hideSelectors });
      };
      if (view.state) {
        const select = stateControls.querySelector(`select[data-state-group="${CSS.escape(view.state.group)}"]`);
        if (select) select.value = view.state.name;
        viewerPreferences.pageStates[view.state.group] = view.state.name;
        saveViewerPreferences();
        applyFrameState(view.state.group, view.state.name);
        setTimeout(openReviewPanel, 60);
      } else setTimeout(openReviewPanel, 120);
      activeReviewId = `${view.file}:${reviewId}`;
      tree.querySelectorAll('[data-review-id]').forEach((button) => button.classList.toggle('active', button.dataset.reviewId === activeReviewId));
      pendingReviewView = null;
    }

    function schedulePendingReviewView() {
      if (!pendingReviewView || pendingReviewView.file !== current.file) return;
      clearTimeout(pendingReviewTimer);
      pendingReviewTimer = setTimeout(() => runReviewView(pendingReviewView), 120);
    }

    function openReviewView(page, view) {
      pendingReviewView = { ...view, file: page.file };
      load(page);
    }

    function addReviewButton(box, page, view) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'review-view';
      button.dataset.reviewId = `${page.file}:${view.id || `view:${view.title}`}`;
      button.textContent = view.title;
      button.onclick = () => openReviewView(page, view);
      box.append(button);
    }

    function addReviewBranch(box, page, view) {
      addReviewButton(box, page, view);
      if (!view.children?.length) return;
      const children = document.createElement('div');
      children.className = 'review-group';
      view.children.forEach((child) => addReviewBranch(children, page, child));
      box.append(children);
    }

    function renderReviewTree(file) {
      const target = reviewTreeTargets.get(file);
      const page = pages.find((item) => item.file === file);
      if (!target || !page) return;
      target.replaceChildren();
      const catalog = liveStateCatalog[file] || {};
      const staticViews = staticPageViews[file];
      if (staticViews) {
        staticViews.forEach((view) => addReviewButton(target, page, view));
        target.querySelectorAll('[data-review-id]').forEach((button) => button.classList.toggle('active', button.dataset.reviewId === activeReviewId));
        return;
      }
      const dimensions = { '页面状态': [], '角色视角': [] };
      if (!panelScopedStateFiles.has(file)) Object.entries(catalog).forEach(([group, names]) => {
        const bucket = reviewGroupName(group);
        names.forEach((name) => dimensions[bucket].push({ group, name }));
      });
      Object.entries(dimensions).forEach(([label, states]) => {
        if (!states.length) return;
        const group = document.createElement('div');
        group.className = 'review-group';
        const title = document.createElement('button');
        title.type = 'button';
        title.className = 'tree-primary';
        title.disabled = true;
        title.textContent = label;
        group.append(title);
        states.forEach(({ group: stateGroup, name }) => addReviewButton(group, page, {
          id: `state:${stateGroup}:${name}`,
          title: `${stateGroup}：${name}`,
          state: { group: stateGroup, name }
        }));
        target.append(group);
      });
      const views = liveReviewViews[file] || guildReviewViews[file] || [];
      if (panelScopedStateFiles.has(file)) {
        views.forEach((view) => addReviewBranch(target, page, view));
        target.querySelectorAll('[data-review-id]').forEach((button) => button.classList.toggle('active', button.dataset.reviewId === activeReviewId));
        return;
      }
      if (guildReviewFiles.has(file)) {
        views.forEach((view) => addReviewBranch(target, page, view));
        target.querySelectorAll('[data-review-id]').forEach((button) => button.classList.toggle('active', button.dataset.reviewId === activeReviewId));
        return;
      }
      if (views.length) {
        const group = document.createElement('div');
        group.className = 'review-group';
        const title = document.createElement('button');
        title.type = 'button';
        title.className = 'tree-primary';
        title.disabled = true;
        title.textContent = '弹层校对';
        group.append(title);
        views.forEach((view) => {
          if (Array.isArray(view)) {
            const [titleText, selectors] = view;
            addReviewButton(group, page, { id: `view:${titleText}`, title: titleText, selectors });
            return;
          }
          if (!view.children) {
            addReviewButton(group, page, { ...view, id: view.id || `view:${view.title}` });
            return;
          }
          const subGroup = document.createElement('div');
          subGroup.className = 'review-group';
          const subTitle = document.createElement('button');
          subTitle.type = 'button';
          subTitle.className = 'tree-primary';
          subTitle.disabled = true;
          subTitle.textContent = view.title;
          subGroup.append(subTitle);
          view.children.forEach((child) => addReviewButton(subGroup, page, child));
          group.append(subGroup);
        });
        target.append(group);
      }
    }

    function addFolder(label, folderPages, expanded) {
      const folder = document.createElement('button');
      const children = document.createElement('div');
      children.style.paddingLeft = '14px';
      children.style.display = folderExpanded(label, expanded) ? 'block' : 'none';
      folder.style.cssText = 'font-weight:600;color:var(--g1);padding-left:10px';
      const updateLabel = () => { folder.textContent = `${children.style.display === 'none' ? '▸' : '▾'}  ${label}`; };
      folder.onclick = () => { children.style.display = children.style.display === 'none' ? 'block' : 'none'; rememberFolder(label, children.style.display !== 'none'); updateLabel(); };
      folderPages.forEach((page) => {
        const button = document.createElement('button');
        button.dataset.file = page.file;
        button.textContent = page.title;
        button.onclick = () => load(page);
        children.appendChild(button);
      });
      updateLabel();
      tree.append(folder, children);
    }

    function addUserTree(expanded) {
      const folder = document.createElement('button');
      const children = document.createElement('div');
      children.style.paddingLeft = '14px';
      children.style.display = folderExpanded('用户 APP', expanded) ? 'block' : 'none';
      folder.className = 'tree-primary';
      const updateFolder = () => { folder.textContent = (children.style.display === 'none' ? '▸' : '▾') + '  用户 APP'; };
      folder.onclick = () => { children.style.display = children.style.display === 'none' ? 'block' : 'none'; rememberFolder('用户 APP', children.style.display !== 'none'); updateFolder(); };
      const groups = [
        ['系统入口', ['auth-login-register.html', 'auth-profile-completion.html', 'auth-phone-login.html']],
        ['首页与福利', ['live-plaza.html', 'host-ranking.html', 'contribution-ranking.html', 'search.html', 'search-results.html', 'welfare-center.html', 'invite-friends.html']],
        ['直播', ['live-room.html', 'live-room-report.html', 'live-room-user-report.html', 'live-room-host.html', 'live-room-host-password.html', 'live-room-cohost-active.html', 'live-end-viewer.html', 'live-end-host.html']],
        ['消息与社交', ['message-center.html', 'system-notifications.html', 'direct-message.html', 'fan-group-chat.html', 'group-manage-member.html', 'group-manage-owner.html', 'chat-settings.html', 'friend-list.html', 'interaction-notifications.html', 'user-home.html', 'host-home.html', 'host-gift-gallery.html']],
        ['我的', ['profile.html', 'profile-edit.html', 'my-following.html', 'my-decoration.html', 'my-decoration-avatar-frame.html', 'my-decoration-chat-bubble.html', 'my-decoration-medal.html', 'settings.html', 'blacklist-management.html', 'my-fan-clubs.html', 'fan-contribution-ranking.html']],
        ['公会关系', ['guild-management.html', 'guild-application-form.html', 'guild-application-records.html', 'guild-detail.html', 'guild-leave-application.html']],
        ['主播中心', ['host-center.html', 'moderator-management.html', 'host-guild-notifications.html', 'host-center-pending.html', 'start-live-settings.html', 'fan-list.html', 'fan-club.html', 'fan-club-settings.html', 'live-data.html', 'live-records.html', 'income-withdrawal.html', 'my-bank-cards.html', 'add-bank-card.html', 'withdrawal-application.html']],
        ['钱包与账单', ['recharge.html', 'balance-detail.html', 'order-income-detail.html', 'order-expense-detail.html']]
      ];
      const appendPage = (box, file) => {
        const page = userPages.find((item) => item.file === file);
        if (!page) return;
        const button = document.createElement('button');
        button.dataset.file = page.file;
        const index = baseUserPageOrder.filter((file) => file !== 'live-room-report.html').indexOf(page.file);
        const code = userPageCodes[page.file] || ('P' + String(index + 1 - (index > 10 ? 1 : 0)).padStart(3, '0'));
        button.textContent = page.title + ' · ' + code;
        button.onclick = () => load(page);
        box.appendChild(button);
        if (reviewFiles.has(file)) {
          const review = document.createElement('div');
          review.className = 'review-group';
          reviewTreeTargets.set(file, review);
          renderReviewTree(file);
          box.appendChild(review);
        }
      };
      groups.forEach(([label, files]) => {
        const groupButton = document.createElement('button');
        const groupChildren = document.createElement('div');
        const groupKey = '用户 APP/' + label;
        groupChildren.style.paddingLeft = '14px';
        groupChildren.style.borderLeft = '1px solid var(--g6)';
        groupChildren.style.marginLeft = '10px';
        groupChildren.style.display = folderExpanded(groupKey, label === '首页与福利') ? 'block' : 'none';
        const updateGroup = () => { groupButton.textContent = (groupChildren.style.display === 'none' ? '▸' : '▾') + '  ' + label; };
        groupButton.className = 'tree-primary';
        groupButton.onclick = () => { groupChildren.style.display = groupChildren.style.display === 'none' ? 'block' : 'none'; rememberFolder(groupKey, groupChildren.style.display !== 'none'); updateGroup(); };
        files.forEach((file) => appendPage(groupChildren, file));
        updateGroup();
        children.append(groupButton, groupChildren);
      });
      updateFolder();
      tree.append(folder, children);
    }

    function addAdminTree(expanded) {
      const folder = document.createElement('button');
      const children = document.createElement('div');
      children.style.paddingLeft = '14px';
      children.style.display = (expanded || folderExpanded('管理后台', false)) ? 'block' : 'none';
      folder.className = 'tree-primary';
      const updateFolder = () => { folder.textContent = `${children.style.display === 'none' ? '▸' : '▾'}  管理后台`; };
      folder.onclick = () => { children.style.display = children.style.display === 'none' ? 'block' : 'none'; rememberFolder('管理后台', children.style.display !== 'none'); updateFolder(); };
      adminPageGroups.forEach((group) => {
        const groupButton = document.createElement('button');
        const groupChildren = document.createElement('div');
        const groupExpanded = group.allFiles.includes(current.file);
        groupButton.className = 'tree-primary';
        groupChildren.style.paddingLeft = '14px';
        const groupKey = `管理后台/${group.title}`;
        groupChildren.style.display = (groupExpanded || folderExpanded(groupKey, false)) ? 'block' : 'none';
        if (group.pageFiles.length) {
          const updateGroup = () => { groupButton.textContent = `${groupChildren.style.display === 'none' ? '▸' : '▾'}  ${group.title}`; };
          groupButton.onclick = () => { groupChildren.style.display = groupChildren.style.display === 'none' ? 'block' : 'none'; rememberFolder(groupKey, groupChildren.style.display !== 'none'); updateGroup(); };
          group.pageFiles.forEach((file) => {
            const page = adminPages.find((item) => item.file === file);
            const button = document.createElement('button');
            button.dataset.file = page.file;
            button.textContent = page.title;
            button.onclick = () => load(page);
            groupChildren.appendChild(button);
          });
          updateGroup();
        } else {
          groupButton.textContent = group.title;
          groupButton.disabled = true;
        }
        children.append(groupButton, groupChildren);
      });
      updateFolder();
      tree.append(folder, children);
    }

    function addGuildTree(expanded) {
      const folder = document.createElement('button');
      const children = document.createElement('div');
      children.style.paddingLeft = '14px';
      children.style.display = (expanded || folderExpanded('公会 APP', false)) ? 'block' : 'none';
      folder.className = 'tree-primary';
      const updateFolder = () => { folder.textContent = `${children.style.display === 'none' ? '▸' : '▾'}  公会 APP`; };
      folder.onclick = () => { children.style.display = children.style.display === 'none' ? 'block' : 'none'; rememberFolder('公会 APP', children.style.display !== 'none'); updateFolder(); };
      const guildTreeFiles = guildPageGroups.flatMap((group) => group.pageFiles);
      const appendPage = (box, page) => {
        if (!page) return;
        const button = document.createElement('button');
        button.dataset.file = page.file;
        button.textContent = `${page.title}-${String(guildTreeFiles.indexOf(page.file) + 1).padStart(2, '0')}`;
        button.onclick = () => load(page);
        box.appendChild(button);
        if (guildReviewFiles.has(page.file)) {
          const review = document.createElement('div');
          review.className = 'review-group';
          reviewTreeTargets.set(page.file, review);
          renderReviewTree(page.file);
          box.appendChild(review);
        }
      };
      guildPageGroups.forEach((group) => {
        const groupButton = document.createElement('button');
        const groupChildren = document.createElement('div');
        const groupKey = `公会 APP/${group.title}`;
        const groupExpanded = group.pageFiles.includes(current.file);
        groupButton.className = 'tree-primary';
        groupChildren.style.paddingLeft = '14px';
        groupChildren.style.display = (groupExpanded || folderExpanded(groupKey, false)) ? 'block' : 'none';
        const updateGroup = () => { groupButton.textContent = `${groupChildren.style.display === 'none' ? '▸' : '▾'}  ${group.title}`; };
        groupButton.onclick = () => { groupChildren.style.display = groupChildren.style.display === 'none' ? 'block' : 'none'; rememberFolder(groupKey, groupChildren.style.display !== 'none'); updateGroup(); };
        group.pageFiles.forEach((file) => appendPage(groupChildren, guildPages.find((page) => page.file === file)));
        updateGroup();
        children.append(groupButton, groupChildren);
      });
      updateFolder();
      tree.append(folder, children);
    }

    addGuildTree(guildPages.some((page) => page.file === current.file));
    addUserTree(userPages.some((page) => page.file === current.file));
    addAdminTree(adminPages.some((page) => page.file === current.file));
    applyPanelPreferences();
    document.querySelectorAll('[data-app-entry]').forEach((button) => {
      button.onclick = () => load(appEntries[button.dataset.appEntry]);
    });
    frame.addEventListener('load', () => {
      bindFrameAnnotations();
      schedulePendingReviewView();
    });
    load(current, currentUrl, true);

    notesPanel.addEventListener('click', (event) => {
      if (event.target.id === 'addNote') {
        editingNoteId = 'new';
        selectedTarget = null;
        selectionMode = false;
        renderNotes(current.file);
        return;
      }
      if (event.target.id === 'pickTarget') {
        selectionMode = !selectionMode;
        if (selectionMode) beginTargetSelection();
        else endTargetSelection();
        event.target.textContent = selectionMode ? '选择中' : (selectedTarget ? selectedTarget.label : '选择功能');
        event.target.classList.toggle('active', selectionMode);
        if (selectionMode) clearFrameTarget();
        postFrameMessage({ type: 'luma-note-mode', enabled: selectionMode });
        return;
      }
      const cancel = event.target.closest('[data-note-cancel]');
      if (cancel) {
        editingNoteId = null;
        selectedTarget = null;
        selectionMode = false;
        endTargetSelection();
        postFrameMessage({ type: 'luma-note-mode', enabled: false });
        clearFrameTarget();
        renderNotes(current.file);
        return;
      }
      const edit = event.target.closest('[data-note-edit]');
      if (edit) {
        const note = customNotes.find((item) => item.id === edit.dataset.noteEdit);
        if (!note) return;
        editingNoteId = note.id;
        selectedTarget = { selector: note.selector, label: note.target };
        selectionMode = false;
        renderNotes(current.file);
        highlightTarget(note.selector);
        return;
      }
      const remove = event.target.closest('[data-note-delete]');
      if (remove) {
        customNotes = customNotes.filter((item) => item.id !== remove.dataset.noteDelete);
        saveCustomNotes();
        clearFrameTarget();
        renderNotes(current.file);
        return;
      }
      const locate = event.target.closest('[data-note-locate]');
      if (locate) {
        const note = customNotes.find((item) => item.id === locate.dataset.noteLocate);
        if (note) highlightTarget(note.selector);
      }
    });

    notesPanel.addEventListener('submit', (event) => {
      if (event.target.id !== 'noteForm') return;
      event.preventDefault();
      const existing = editingNoteId === 'new' ? null : customNotes.find((item) => item.id === editingNoteId);
      const target = selectedTarget || (existing ? { selector: existing.selector, label: existing.target } : null);
      const error = document.querySelector('#noteFormError');
      if (!target) {
        error.textContent = '请选择关联功能';
        return;
      }
      const item = {
        id: existing ? existing.id : `${Date.now()}`,
        file: current.file,
        selector: target.selector,
        target: target.label,
        title: document.querySelector('#noteTitle').value.trim(),
        content: document.querySelector('#noteContent').value.trim()
      };
      if (existing) customNotes = customNotes.map((note) => note.id === existing.id ? item : note);
      else customNotes.push(item);
      saveCustomNotes();
      editingNoteId = null;
      selectedTarget = null;
      selectionMode = false;
      endTargetSelection();
      postFrameMessage({ type: 'luma-note-mode', enabled: false });
      clearFrameTarget();
      renderNotes(current.file);
    });

    window.addEventListener('message', (event) => {
      if (event.source !== frame.contentWindow) return;
      if (event.data && event.data.type === 'luma-note-ready') {
        bindFrameAnnotations();
      }
      if (event.data && event.data.type === 'luma-note-target') {
        if (!editingNoteId || !event.data.selector) return;
        selectedTarget = {
          selector: String(event.data.selector),
          label: String(event.data.label || '已选元素').slice(0, 36)
        };
        selectionMode = false;
        endTargetSelection();
        const picker = document.querySelector('#pickTarget');
        if (picker) {
          picker.textContent = selectedTarget.label;
          picker.classList.remove('active');
        }
        const error = document.querySelector('#noteFormError');
        if (error) error.textContent = '';
      }
      if (event.data && event.data.type === 'luma-note-cancel') {
        selectionMode = false;
        endTargetSelection();
        const picker = document.querySelector('#pickTarget');
        if (picker) {
          picker.textContent = selectedTarget ? selectedTarget.label : '选择功能';
          picker.classList.remove('active');
        }
      }
      if (event.data && event.data.type === 'luma-states') {
        const groups = event.data.groups || { '页面状态': event.data.states || [] };
        const grouped = typeof event.data.grouped === 'boolean' ? event.data.grouped : !Object.prototype.hasOwnProperty.call(groups, '页面状态');
        renderStateControls(groups, grouped);
        if (reviewFiles.has(current.file)) {
          liveStateCatalog[current.file] = groups;
          renderReviewTree(current.file);
        }
        schedulePendingReviewView();
      }
      if (event.data && event.data.type === 'luma-page') {
        const page = pages.find((item) => item.file === event.data.file);
        if (!page) return;
        const nextUrl = pageUrl(page, event.data.query || '');
        const pageChanged = nextUrl !== currentUrl;
        current = page;
        currentUrl = nextUrl;
        openPage.href = currentUrl;
        if (pageChanged) {
          editingNoteId = null;
          selectedTarget = null;
          selectionMode = false;
          postFrameMessage({ type: 'luma-note-mode', enabled: false });
          clearFrameTarget();
          resetStateControls();
          resizeFrame();
          viewerPreferences.url = currentUrl;
          viewerPreferences.pageStates = {};
          saveViewerPreferences();
        }
        rememberPage(currentUrl);
        document.querySelector('#title').textContent = displayTitle(page);
        updateAppEntry(page);
        tree.querySelectorAll('[data-file]').forEach((button) => button.classList.toggle('active', button.dataset.file === treeFile(page.file)));
        renderNotes(page.file);
      }
    });
    stateControls.onchange = (event) => {
      const select = event.target.closest('select[data-state-group]');
      if (!select) return;
      viewerPreferences.url = currentUrl;
      viewerPreferences.pageStates[select.dataset.stateGroup] = select.value;
      saveViewerPreferences();
      if (select.dataset.reloadDefault === 'true' && select.value === '默认') frame.src = currentUrl;
      else applyFrameState(select.dataset.stateGroup, select.value);
    };
    zoom.onchange = () => {
      resizeFrame();
      viewerPreferences.url = currentUrl;
      viewerPreferences.zoom = zoom.value;
      saveViewerPreferences();
    };
    treeToggle.onclick = () => {
      const hidden = treePanel.classList.toggle('state-hide');
      layout.classList.toggle('tree-hidden', hidden);
      treeToggle.setAttribute('aria-expanded', String(!hidden));
      viewerPreferences.treeHidden = hidden;
      saveViewerPreferences();
    };
    notesToggle.onclick = () => {
      const hidden = notesPanel.classList.toggle('state-hide');
      layout.classList.toggle('notes-hidden', hidden);
      notesToggle.setAttribute('aria-expanded', String(!hidden));
      if (hidden && selectionMode) {
        selectionMode = false;
        endTargetSelection();
        postFrameMessage({ type: 'luma-note-mode', enabled: false });
        clearFrameTarget();
      }
      viewerPreferences.notesHidden = hidden;
      saveViewerPreferences();
    };
  </script>
</body>
</html>
