            <h2 id="statisticEntries">基础数据</h2>
            <div class="report-statistic-grid">
              <a
                class="report-entry"
                href="admin-daily-statistics.html"

                ><span class="report-entry-mark" aria-hidden="true">日</span

                ><span class="report-entry-arrow" aria-hidden="true">›</span></a
              >
              <a
                class="report-entry"
                href="admin-user-active-statistics.html"
                data-report="用户活跃汇总（每日）"
                ><span class="report-entry-mark" aria-hidden="true">活</span
                ><span class="report-entry-label">用户活跃汇总（每日）</span
                ><span class="report-entry-arrow" aria-hidden="true">›</span></a
              >
              <a
                class="report-entry"
                href="admin-host-statistics.html"
                data-report="主播活跃汇总（每日）"

                ><span class="report-entry-arrow" aria-hidden="true">›</span></a
              >
              <a

                href="admin-live-statistics.html"
                data-report="直播间互动汇总（每日）"

                ><span class="report-entry-arrow" aria-hidden="true">›</span></a

                data-report="充值消费汇总（每日）"
                ><span class="report-entry-mark" aria-hidden="true">充</span
                ><span class="report-entry-label">充值消费汇总（每日）</span
                ><span class="report-entry-arrow" aria-hidden="true">›</span></a
              >
              <a
                class="report-entry"
                href="admin-user-activity-statistics.html"
                data-report="充值用户分层汇总（每日）"
                ><span class="report-entry-mark" aria-hidden="true">统</span
                ><span class="report-entry-label">充值用户分层汇总（每日）</span
                ><span class="report-entry-arrow" aria-hidden="true">›</span></a
              >
            </div>
          </section>

          <section
            class="report-center-section"
            aria-labelledby="financeEntries"
          >
            <h2 id="financeEntries">财务对账</h2>
            <div class="report-statistic-grid">
              <a

                href="admin-monthly-income-expense.html"

                ><span class="report-entry-mark" aria-hidden="true">汇</span

                ><span class="report-entry-arrow" aria-hidden="true">›</span></a
              >
              <a

                data-report="直播记录明细报表"

                ><span class="report-entry-label">直播记录明细报表</span
                ><span class="report-entry-arrow" aria-hidden="true">›</span></a
              >
              <a
                class="report-entry"
                href="admin-monthly-host-share.html"
                data-report="主播业绩分成报表"
                ><span class="report-entry-mark" aria-hidden="true">绩</span
                ><span class="report-entry-label">主播业绩分成报表</span
                ><span class="report-entry-arrow" aria-hidden="true">›</span></a
              >
              <a
                class="report-entry"
                href="admin-monthly-host-earnings.html"
                data-report="主播礼物打赏明细报表"
                ><span class="report-entry-mark" aria-hidden="true">赏</span
                ><span class="report-entry-label">主播礼物打赏明细报表</span
                ><span class="report-entry-arrow" aria-hidden="true">›</span></a
              >
              <a
                class="report-entry"
                href="admin-monthly-viewer-consumption.html"
                data-report="用户消费汇总报表"

                ><span class="report-entry-arrow" aria-hidden="true">›</span></a

                class="report-entry"
                href="admin-recharge-order-detail-report.html"

    <script>
      document.querySelectorAll("[data-report]").forEach((entry) => {
        entry.addEventListener("click", () => {
          document
            .querySelectorAll("[data-report]")
            .forEach((item) => item.classList.remove("is-selected"));
          entry.classList.add("is-selected");
          Luma.toast(`已选择：${entry.dataset.report}`);
        });
      });
      window.parent.postMessage(
        { type: "luma-page", file: "admin-report-center.html" },
        "*",
      );
    </script>
  </body>
</html>
