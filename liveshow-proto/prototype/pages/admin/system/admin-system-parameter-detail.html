<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>参数编辑 · 系统配置 · Luma Live 管理后台</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <script src="../../../assets/admin-tokens.js"></script>
    <link
      rel="stylesheet"
      href="../../../assets/admin.css?v=20260821-filter-layout-v4"
    />
    <script src="../../../assets/common.js?v=20260821-date-placeholder-v3"></script>
    <script src="../../../assets/mock.js?v=20260811-guild-currency-v1"></script>
    <script src="../../../assets/admin-mock.js?v=20260813-id-format-v4"></script>
  </head>
  <body class="admin-monochrome">
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="admin-brand">
          <span class="admin-brand-mark">L</span><span>Luma 管理后台</span>
        </div>
        <nav class="admin-nav">
          <a class="admin-nav-item" href="../user/admin-user-list.html"
            ><span>用户管理</span><span>›</span></a
          ><a class="admin-nav-item" href="../host/admin-host-list.html"
            ><span>主播管理</span><span>›</span></a
          ><a class="admin-nav-item" href="../guild/admin-guild-list.html"
            ><span>公会管理</span><span>›</span></a
          ><a class="admin-nav-item" href="../gifts/admin-gift-list.html"
            ><span>礼物道具</span><span>›</span></a
          ><a
            class="admin-nav-item"
            href="../operations/admin-placement-config.html"
            ><span>运营配置</span><span>›</span></a
          ><a
            class="admin-nav-item"
            href="../finance/admin-settlement-record.html"
            ><span>财务分成</span><span>›</span></a
          ><a
            class="admin-nav-item"
            href="../analytics/admin-report-center.html"
            ><span>数据分析</span><span>›</span></a
          ><button class="admin-nav-item" data-menu="系统配置">
            <span>系统配置</span><span>›</span>
          </button>
        </nav>
        <div class="admin-sidebar-foot">Luma Live 管理后台</div>
      </aside>
      <div class="admin-main">
        <header class="admin-topbar">
          <div class="admin-breadcrumb">
            系统配置&nbsp;&nbsp;/&nbsp;&nbsp;系统参数&nbsp;&nbsp;/&nbsp;&nbsp;<strong
              >参数编辑</strong
            >
          </div>
          <div class="admin-account">
            <span class="admin-account-avatar">管</span><span>后台管理员</span
            ><span>⌄</span>
          </div>
        </header>
        <main class="admin-content">
          <a class="admin-back-link" href="admin-system-parameter.html"
            >‹ 返回系统参数</a
          >
          <section class="admin-panel admin-profile-panel">
            <div class="admin-section-head">
              <div>
                <h2 id="pageTitle">参数编辑</h2>
                <span class="admin-tag" id="categoryTag"></span>
              </div>
              <div class="admin-page-actions">
                <a
                  class="admin-btn secondary"
                  href="admin-system-parameter.html"
                  >取消</a
                ><button class="admin-btn" type="submit" form="parameterForm">
                  保存
                </button>
              </div>
            </div>
            <form id="parameterForm">
              <div class="admin-form-grid">
                <div class="admin-form-row">
                  <label>参数 ID</label>
                  <div class="admin-readonly-value" id="parameterId"></div>
                </div>
                <div class="admin-form-row">
                  <label>参数编码</label>
                  <div class="admin-readonly-value" id="parameterCode"></div>
                </div>
                <div class="admin-form-row">
                  <label>参数名称</label>
                  <div class="admin-readonly-value" id="parameterName"></div>
                </div>
                <div class="admin-form-row">
                  <label>当前参数值</label>
                  <div class="admin-readonly-value" id="currentValue"></div>
                </div>
                <div class="admin-form-row full">
                  <label>参数说明</label>
                  <div class="admin-note" id="description"></div>
                </div>
                <div class="admin-form-row full">
                  <label>参数值</label>
                  <div id="valueEditor"></div>
                </div>
                <div class="admin-form-row">
                  <label for="effectiveAt">生效时间</label
                  ><input
                    class="admin-input"
                    id="effectiveAt"
                    type="datetime-local"
                    required
                  />
                </div>
                <div class="admin-form-row">
                  <label>启用状态</label>
                  <div class="admin-switch-control">
                    <label class="admin-switch"
                      ><input id="enabled" type="checkbox" /><span
                        class="admin-switch-track"
                      ></span></label
                    ><span id="enabledText"></span>
                  </div>
                </div>
              </div>
            </form>
          </section>
          <section class="admin-panel admin-profile-panel">
            <div class="admin-section-head"><h2>最近变更</h2></div>
            <table class="system-change-table">
              <thead>
                <tr>
                  <th>变更时间</th>
                  <th>变更前</th>
                  <th>变更后</th>
                  <th>操作人</th>
                </tr>
              </thead>
              <tbody id="historyRows"></tbody>
            </table>
          </section>
        </main>
      </div>
    </div>
    <script>
      const data = LUMA_ADMIN_MOCK.system.parameters,
        params = new URLSearchParams(location.search),
        item = data.find((x) => x.id === params.get("id")) || data[0];
      function editorHtml() {
        if (item.valueType === "channels")
          return `<div class="admin-checkboxes">${["银行转账", "DANA", "GoPay"].map((x) => `<label><input type="checkbox" name="channel" value="${x}" ${item.rawValue.includes(x) ? "checked" : ""}>${x}</label>`).join("")}</div>`;
        if (item.valueType === "tags")
          return `<input class="admin-input" id="parameterTags" value="${item.rawValue.join("、")}" placeholder="使用顿号分隔，最多 8 个标签" required>`;
        const decimal = item.valueType === "percent";
        return `<div class="admin-setting-control"><input class="admin-input admin-number-input" id="parameterValue" type="${decimal ? "text" : "number"}" ${decimal ? 'inputmode="decimal" data-luma-decimal ' : ""}min="0.01" step="${decimal ? "0.1" : "1"}" value="${decimal ? LUMA_FORMAT.decimalInput(item.rawValue) : item.rawValue}" required><span>${item.unit || ""}</span></div>`;
      }
      function getTags() {
        return item.valueType === "tags"
          ? parameterTags.value
              .split(/[、,，]/)
              .map((x) => x.trim())
              .filter(Boolean)
          : [];
      }
      function formatValue() {
        if (item.valueType === "channels")
          return [...document.querySelectorAll('[name="channel"]:checked')]
            .map((x) => x.value)
            .join("、");
        if (item.valueType === "tags") return getTags().join("、");
        const value =
          item.valueType === "percent"
            ? LUMA_FORMAT.parseDecimal(parameterValue.value)
            : Number(parameterValue.value);
        if (item.valueType === "money") return LUMA_FORMAT.money(value);
        if (item.valueType === "rate")
          return `${LUMA_FORMAT.money(1)} = ${LUMA_FORMAT.coins(value)} 金币`;
        if (item.valueType === "earningRate")
          return `${LUMA_FORMAT.coins(value)} 金币 = ${LUMA_FORMAT.money(1)}`;
        return `${LUMA_FORMAT.number(value, 2)}%`;
      }
      function render() {
        pageTitle.textContent = item.name;
        categoryTag.textContent = item.category;
        parameterId.textContent = item.id;
        parameterCode.textContent = item.code;
        parameterName.textContent = item.name;
        currentValue.textContent = item.value;
        description.textContent = item.description;
        valueEditor.innerHTML = editorHtml();
        effectiveAt.value = item.effectiveAt.replace(" ", "T").slice(0, 16);
        enabled.checked = item.status === "enabled";
        enabledText.textContent = enabled.checked ? "启用" : "停用";
        historyRows.innerHTML = `<tr><td>${item.updatedAt}</td><td>-</td><td>${item.value}</td><td>${item.operator}</td></tr>`;
      }
      enabled.onchange = () =>
        (enabledText.textContent = enabled.checked ? "启用" : "停用");
      parameterForm.onsubmit = (e) => {
        e.preventDefault();
        const next = formatValue(),
          tags = getTags();
        if (!next)
          return Luma.toast(
            item.valueType === "tags"
              ? "请至少填写一个直播间类型标签"
              : "请至少选择一个到账通道",
          );
        if (tags.length > 8) return Luma.toast("直播间类型标签最多 8 个");
        const before = item.value;
        item.value = next;
        item.rawValue =
          item.valueType === "channels"
            ? [...document.querySelectorAll('[name="channel"]:checked')].map(
                (x) => x.value,
              )
            : item.valueType === "tags"
              ? tags
              : item.valueType === "percent"
                ? LUMA_FORMAT.parseDecimal(parameterValue.value)
                : Number(parameterValue.value);
        item.status = enabled.checked ? "enabled" : "disabled";
        item.effectiveAt = effectiveAt.value.replace("T", " ");
        item.updatedAt = "2026-08-11 10:30";
        item.operator = "系统管理员";
        currentValue.textContent = item.value;
        historyRows.insertAdjacentHTML(
          "afterbegin",
          `<tr><td>${item.updatedAt}</td><td>${before}</td><td>${item.value}</td><td>${item.operator}</td></tr>`,
        );
        Luma.toast("系统参数已保存");
      };
      render();
      window.parent.postMessage(
        {
          type: "luma-page",
          file: "admin-system-parameter-detail.html",
          query: location.search,
        },
        "*",
      );
      Luma.registerStates({
        最低提现金额: () =>
          (location.href = "admin-system-parameter-detail.html?id=PARAM001"),
        到账通道: () =>
          (location.href = "admin-system-parameter-detail.html?id=PARAM002"),
        金币汇率: () =>
          (location.href = "admin-system-parameter-detail.html?id=PARAM003"),
        直播间类型标签: () =>
          (location.href = "admin-system-parameter-detail.html?id=PARAM007"),
      });
    </script>
  </body>
</html>
