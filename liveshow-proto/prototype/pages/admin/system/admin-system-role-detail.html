<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>角色编辑 · 系统配置 · Luma Live 管理后台</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <script src="../../../assets/admin-tokens.js"></script>
    <link
      rel="stylesheet"
      href="../../../assets/admin.css?v=20260901-menu-permissions-v2"
    />
    <script src="../../../assets/common.js?v=20260901-system-nav-order-v3"></script>
    <script src="../../../assets/mock.js?v=20260811-guild-currency-v1"></script>
    <script src="../../../assets/admin-mock.js?v=20260901-menu-permissions-v2"></script>
  </head>
  <body class="admin-monochrome">
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="admin-brand">
          <span class="admin-brand-mark">L</span><span>Luma 管理后台</span>
        </div>
        <nav class="admin-nav">
          <a class="admin-nav-item" href="../user/admin-user-list.html"
            ><span>用户管理</span><span>›</span></a
          ><a class="admin-nav-item" href="../host/admin-host-list.html"
            ><span>主播管理</span><span>›</span></a
          ><a class="admin-nav-item" href="../guild/admin-guild-list.html"
            ><span>公会管理</span><span>›</span></a
          ><a class="admin-nav-item" href="../gifts/admin-gift-list.html"
            ><span>礼物道具</span><span>›</span></a
          ><a
            class="admin-nav-item"
            href="../operations/admin-placement-config.html"
            ><span>运营配置</span><span>›</span></a
          ><a
            class="admin-nav-item"
            href="../finance/admin-settlement-record.html"
            ><span>财务分成</span><span>›</span></a
          ><a
            class="admin-nav-item"
            href="../analytics/admin-report-center.html"
            ><span>数据分析</span><span>›</span></a
          ><button class="admin-nav-item" data-menu="系统配置">
            <span>系统配置</span><span>›</span>
          </button>
        </nav>
        <div class="admin-sidebar-foot">Luma Live 管理后台</div>
      </aside>
      <div class="admin-main">
        <header class="admin-topbar">
          <div class="admin-breadcrumb">
            系统配置&nbsp;&nbsp;/&nbsp;&nbsp;角色管理&nbsp;&nbsp;/&nbsp;&nbsp;<strong
              id="crumb"
              >角色编辑</strong
            >
          </div>
          <div class="admin-account">
            <span class="admin-account-avatar">管</span><span>后台管理员</span
            ><span>⌄</span>
          </div>
        </header>
        <main class="admin-content">
          <a class="admin-back-link" href="admin-system-role.html"
            >‹ 返回角色管理</a
          >
          <section class="admin-panel admin-profile-panel admin-create-page">
            <div class="admin-section-head">
              <h2 id="pageTitle">角色编辑</h2>
              <div class="admin-page-actions">
                <a class="admin-btn secondary" href="admin-system-role.html"
                  >取消</a
                ><button class="admin-btn" type="submit" form="roleForm">
                  保存
                </button>
              </div>
            </div>
            <form id="roleForm">
              <div class="admin-form-grid">
                <div class="admin-form-row">
                  <label>角色 ID</label>
                  <div class="admin-readonly-value" id="roleCode"></div>
                </div>
                <div class="admin-form-row">
                  <label for="roleName">角色名称</label
                  ><input
                    class="admin-input"
                    id="roleName"
                    maxlength="30"
                    required
                  />
                </div>
                <div class="admin-form-row">
                  <label>角色状态</label>
                  <div class="admin-switch-control">
                    <label class="admin-switch"
                      ><input id="enabled" type="checkbox" /><span
                        class="admin-switch-track"
                      ></span></label
                    ><span id="enabledText"></span>
                  </div>
                </div>
              </div>
              <section class="role-permission-section">
                <div class="role-permission-heading">
                  <div>
                    <h3>菜单权限</h3>
                    <span class="system-permission-count" id="permissionCount"></span>
                  </div>
                  <div class="role-permission-toolbar">
                    <button type="button" data-tree-action="expand">全部展开</button>
                    <button type="button" data-tree-action="collapse">全部收起</button>
                    <button type="button" data-tree-action="select">全选</button>
                    <button type="button" data-tree-action="clear">全不选</button>
                  </div>
                </div>
                <div class="role-permission-tree" id="permissionTree"></div>
              </section>
              <div class="admin-note state-hide" id="lockedNote">
                超级管理员为系统内置角色，默认拥有全部权限，不允许修改。
              </div>
            </form>
          </section>
        </main>
      </div>
    </div>
    <script>
      const S = LUMA_ADMIN_MOCK.system,
        params = new URLSearchParams(location.search);
      let isNew = params.get("new") === "1",
        item = isNew
          ? {
              id: "系统生成",
              name: "",
              permissionCount: 0,
              dataScope: "指定业务范围",
              status: "enabled",
            }
          : S.roles.find((x) => x.id === params.get("id")) || S.roles[1];
      const permissionItems = (group) =>
        group.items.length ? group.items : [group.group];
      const allPermissions = S.permissions.flatMap(permissionItems);
      let selectedPermissions = new Set(
          item.locked
            ? allPermissions
            : Array.isArray(item.selected)
              ? item.selected
              : allPermissions.slice(0, item.permissionCount),
        ),
        expandedGroups = new Set(S.permissions.map((_, index) => index));

      function renderPermissions() {
        permissionCount.textContent = `已选择 ${selectedPermissions.size} / ${allPermissions.length} 项`;
        permissionTree.innerHTML = S.permissions
          .map((group, groupIndex) => {
            const groupItems = permissionItems(group),
              hasChildren = group.items.length > 0,
              selectedCount = groupItems.filter((name) =>
                selectedPermissions.has(name),
              ).length,
              expanded = expandedGroups.has(groupIndex),
              disabled = item.locked ? "disabled" : "";
            return /* HTML */ `<section class="role-permission-node">
              <div class="role-permission-parent">
                ${hasChildren
                  ? /* HTML */ `<button
                      class="role-permission-disclosure"
                      type="button"
                      data-expand-group="${groupIndex}"
                      aria-label="${expanded ? "收起" : "展开"}${group.group}"
                      aria-expanded="${expanded}"
                    >${expanded ? "⌄" : "›"}</button>`
                  : '<span class="role-permission-disclosure-spacer"></span>'}
                <label>
                  <input
                    type="checkbox"
                    data-permission-group="${groupIndex}"
                    ${selectedCount === groupItems.length ? "checked" : ""}
                    ${disabled}
                  />
                  <strong>${group.group}</strong>
                </label>
                <span>${selectedCount} / ${groupItems.length}</span>
              </div>
              ${hasChildren
                ? /* HTML */ `<div class="role-permission-children ${expanded ? "" : "state-hide"}">
                    ${group.items
                      .map(
                        (name) => /* HTML */ `<label>
                          <input
                            type="checkbox"
                            data-permission="${name}"
                            ${selectedPermissions.has(name) ? "checked" : ""}
                            ${disabled}
                          />
                          <span>${name}</span>
                        </label>`,
                      )
                      .join("")}
                  </div>`
                : ""}
            </section>`;
          })
          .join("");
        permissionTree
          .querySelectorAll("[data-permission-group]")
          .forEach((input) => {
            const group = S.permissions[Number(input.dataset.permissionGroup)],
              groupItems = permissionItems(group),
              selectedCount = groupItems.filter((name) =>
                selectedPermissions.has(name),
              ).length;
            input.indeterminate =
              selectedCount > 0 && selectedCount < groupItems.length;
          });
        document.querySelectorAll("[data-tree-action='select'], [data-tree-action='clear']")
          .forEach((button) => (button.disabled = Boolean(item.locked)));
      }

      function render() {
        crumb.textContent = pageTitle.textContent = isNew
          ? "新建角色"
          : "角色编辑";
        roleCode.textContent = item.id;
        roleName.value = item.name;
        enabled.checked = item.status === "enabled";
        enabledText.textContent = enabled.checked ? "启用" : "停用";
        lockedNote.classList.toggle("state-hide", !item.locked);
        [roleName, enabled].forEach(
          (x) => (x.disabled = Boolean(item.locked)),
        );
        renderPermissions();
      }
      enabled.onchange = () =>
        (enabledText.textContent = enabled.checked ? "启用" : "停用");
      permissionTree.onclick = (event) => {
        const button = event.target.closest("[data-expand-group]");
        if (!button) return;
        const groupIndex = Number(button.dataset.expandGroup);
        if (expandedGroups.has(groupIndex)) expandedGroups.delete(groupIndex);
        else expandedGroups.add(groupIndex);
        renderPermissions();
      };
      permissionTree.onchange = (event) => {
        const groupInput = event.target.closest("[data-permission-group]"),
          permissionInput = event.target.closest("[data-permission]");
        if (groupInput) {
          permissionItems(
            S.permissions[Number(groupInput.dataset.permissionGroup)],
          ).forEach(
            (name) =>
              groupInput.checked
                ? selectedPermissions.add(name)
                : selectedPermissions.delete(name),
          );
        } else if (permissionInput) {
          if (permissionInput.checked)
            selectedPermissions.add(permissionInput.dataset.permission);
          else selectedPermissions.delete(permissionInput.dataset.permission);
        }
        renderPermissions();
      };
      document.querySelectorAll("[data-tree-action]").forEach((button) => {
        button.onclick = () => {
          const action = button.dataset.treeAction;
          if (action === "expand")
            expandedGroups = new Set(S.permissions.map((_, index) => index));
          if (action === "collapse") expandedGroups.clear();
          if (action === "select") selectedPermissions = new Set(allPermissions);
          if (action === "clear") selectedPermissions.clear();
          renderPermissions();
        };
      });
      roleForm.onsubmit = (e) => {
        e.preventDefault();
        if (item.locked) return Luma.toast("系统内置角色不可修改");
        if (S.roles.some((x) => x !== item && x.name === roleName.value.trim()))
          return Luma.toast("角色名称已存在");
        Object.assign(item, {
          name: roleName.value.trim(),
          status: enabled.checked ? "enabled" : "disabled",
          selected: [...selectedPermissions],
          permissionCount: selectedPermissions.size,
          updatedAt: "2026-08-07 10:30",
        });
        if (isNew) {
          item.id = `ROLE${String(S.roles.length + 1).padStart(3, "0")}`;
          item.accountCount = 0;
          item.createdAt = "2026-08-07 10:30";
          S.roles.push(item);
          isNew = false;
          history.replaceState(
            null,
            "",
            `admin-system-role-detail.html?id=${item.id}`,
          );
        }
        render();
        Luma.toast("角色已保存");
      };
      render();
      window.parent.postMessage(
        {
          type: "luma-page",
          file: "admin-system-role-detail.html",
          query: location.search,
        },
        "*",
      );
      Luma.registerStates({
        编辑角色: () => {},
        新建角色: () => (location.href = "admin-system-role-detail.html?new=1"),
        系统内置角色: () =>
          (location.href = "admin-system-role-detail.html?id=ROLE001"),
      });
    </script>
  </body>
</html>
