          ><a class="admin-nav-item" href="../host/admin-host-list.html"

            ><a class="admin-nav-sub" href="admin-task-config.html">任务配置</a
            ><a class="admin-nav-sub" href="admin-guild-recommendation.html"
              >公会推荐</a
            ><a class="admin-nav-sub" href="admin-live-type.html">直播类型</a
            ><a class="admin-nav-sub" href="admin-feature-switch.html"

            ><a class="admin-nav-sub" href="admin-sensitive-words.html"

          <a
            class="admin-nav-item"
            href="../finance/admin-settlement-record.html"
            ><span>财务分成</span><span>›</span></a
          ><button class="admin-nav-item" data-menu="数据分析">
            <span>数据分析</span><span>›</span></button
          ><button class="admin-nav-item" data-menu="系统配置">
            <span>系统配置</span><span>›</span>
          </button>
        </nav>
        <div class="admin-sidebar-foot">Luma Live 管理后台</div>
      </aside>
      <div class="admin-main">
        <header class="admin-topbar">
          <div class="admin-breadcrumb">
            运营配置&nbsp;&nbsp;/&nbsp;&nbsp;<strong>展位配置</strong>
          </div>
          <div class="admin-account">
            <span class="admin-account-avatar">管</span><span>后台管理员</span
            ><span>⌄</span>
          </div>
        </header>
        <main class="admin-content">
          <div class="admin-page-head">
            <h1>展位配置</h1>
            <a class="admin-btn" href="admin-placement-detail.html?new=1&edit=1"
              >新建展示素材</a
            >
          </div>
          <section class="admin-panel admin-filter" aria-label="展示素材筛选">
            <div class="admin-filter-grid">
              <div class="admin-field">
                <label for="placementPosition">展示位置</label
                ><select class="admin-select" id="placementPosition">
                  <option value="">全部位置</option>
                  <option value="home_banner">首页轮播</option>
                  <option value="live_top">直播广场顶部</option>
                  <option value="welfare_focus">福利中心焦点位</option>
                  <option value="profile_operation">个人中心运营位</option>
                </select>
              </div>
              <div class="admin-field">
                <label>展示周期</label>
                <div class="admin-range admin-date-range">
                  <input
                    class="admin-input"
                    id="placementStart"
                    type="date"
                  /><span>至</span
                  ><input class="admin-input" id="placementEnd" type="date" />
                </div>
              </div>
            </div>
            <div class="admin-filter-actions">
              <button class="admin-btn secondary" id="resetBtn">重置</button
              ><button class="admin-btn" id="searchBtn">查询</button>
            </div>
          </section>
          <section class="admin-panel admin-table-panel">
            <div class="admin-table-toolbar">
              <div
                class="admin-list-tabs"
                id="statusTabs"
                aria-label="展示状态"
              >
                <button class="admin-list-tab active" data-status="">
                  全部</button
                ><button class="admin-list-tab" data-status="shown">展示</button
                ><button class="admin-list-tab" data-status="hidden">
                  隐藏
                </button>
              </div>
              <span id="resultCount"></span>
            </div>
            <div class="admin-table-wrap">
              <table class="admin-table has-actions" style="min-width: 1080px">
                <thead>
                  <tr>
                    <th>展示位置</th>
                    <th>展示素材</th>
                    <th>点击跳转</th>
                    <th>展示时间</th>
                    <th>展示周期</th>
                    <th>状态</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="placementRows"></tbody>
              </table>
            </div>
            <div class="admin-pagination" id="pagination">
              <span>20 条 / 页</span
              ><button class="admin-page-btn" disabled>‹</button
              ><button class="admin-page-btn active" disabled>1</button
              ><button class="admin-page-btn" disabled>›</button>
            </div>
          </section>
        </main>
      </div>
    </div>
    <div class="admin-overlay" id="deleteOverlay">
      <section class="admin-modal">
        <div class="admin-modal-head">
          <h2>删除展示素材</h2>
          <button class="admin-icon-btn" data-close="deleteOverlay">×</button>
        </div>
        <form id="deleteForm">
          <div class="admin-modal-body"><p id="deleteText"></p></div>
          <div class="admin-modal-foot">
            <button
              class="admin-btn secondary"
              type="button"
              data-close="deleteOverlay"
            >
              取消</button
            ><button class="admin-btn danger" type="submit">确认删除</button>
          </div>
        </form>
      </section>
    </div>
    <script>
      const placements = window.LUMA_ADMIN_MOCK.placementItems,
        positionText = {
          home_banner: "首页轮播",
          live_top: "直播广场顶部",
          welfare_focus: "福利中心焦点位",
          profile_operation: "个人中心运营位",
        },
        appPageText = {
          recharge: "充值页面",
          welfare: "福利中心",
          task: "任务中心",
          live_plaza: "直播广场",
          guild: "公会页面",
          profile: "个人中心",
        };
      let deleting = null,
        activeStatus = "";
      function dateOf(value) {
        return value.slice(0, 10);
      }
      function timeOf(value) {
        return value.slice(11, 16);
      }
      function filtered() {
        const position = placementPosition.value,
          start = placementStart.value,
          end = placementEnd.value;
        if (start && end && start > end) {
          Luma.toast("结束日期不能早于开始日期");
          return null;
        }
        return placements.filter(
          (item) =>
            (!position || item.position === position) &&
            (!activeStatus || (activeStatus === "shown") === item.enabled) &&
            (!start || dateOf(item.endAt) >= start) &&
            (!end || dateOf(item.startAt) <= end),
        );
      }
      function jumpText(item) {
        return item.jumpType === "activity_image"
          ? `活动长图<br><span class="admin-muted">${item.detailImage}</span>`
          : `APP 页面<br><span class="admin-muted">${appPageText[item.targetPage] || "未配置"}</span>`;
      }
      function render(items) {
        if (!items) return;
        resultCount.textContent = `共 ${items.length} 条`;
        pagination.classList.toggle("state-hide", !items.length);
        if (!items.length) {
          placementRows.innerHTML =
            '<tr><td colspan="7"><div class="admin-empty"><strong>未找到展示素材</strong><span>请调整筛选条件</span></div></td></tr>';
          return;
        }
        placementRows.innerHTML = items
          .map(
            (item) =>
              /* HTML */ `<tr>
                <td><b>${positionText[item.position]}</b></td>
                <td>
                  <div class="admin-media">
                    <span class="admin-media-placeholder">素材 占位</span>
                  </div>
                </td>
                <td>${jumpText(item)}</td>
                <td>${timeOf(item.startAt)} - ${timeOf(item.endAt)}</td>
                <td>
                  ${dateOf(item.startAt)}<br /><span class="admin-muted"
                    >至 ${dateOf(item.endAt)}</span
                  >
                </td>
                <td>
                  <div class="admin-switch-control">
                    <label class="admin-switch"
                      ><input
                        type="checkbox"
                        data-toggle="${item.id}"
                        ${item.enabled ? "checked" : ""} /><span
                        class="admin-switch-track"
                      ></span></label
                    ><span>${item.enabled ? "展示" : "隐藏"}</span>
                  </div>
                </td>
                <td>
                  <a
                    class="admin-action"
                    href="admin-placement-detail.html?id=${item.id}&edit=1"
                    >编辑</a
                  ><button class="admin-action" data-delete="${item.id}">
                    删除
                  </button>
                </td>
              </tr>`,
          )
          .join("");
      }
      function runFilter() {
        const items = filtered();
        if (items) {
          render(items);
          Luma.toast(`已查询到 ${items.length} 条展示素材`);
        }
      }
      searchBtn.onclick = runFilter;
      resetBtn.onclick = () => {
        placementPosition.value = "";
        placementStart.value = "";
        placementEnd.value = "";
        activeStatus = "";
        statusTabs
          .querySelectorAll("[data-status]")
          .forEach((tab, index) => tab.classList.toggle("active", index === 0));
        render(placements);
      };
      statusTabs.onclick = (event) => {
        const tab = event.target.closest("[data-status]");
        if (!tab) return;
        activeStatus = tab.dataset.status;
        statusTabs
          .querySelectorAll("[data-status]")
          .forEach((item) => item.classList.toggle("active", item === tab));
        render(filtered());
      };
      placementRows.onchange = (event) => {
        const input = event.target.closest("[data-toggle]");
        if (!input) return;
        const item = placements.find(
          (entry) => entry.id === input.dataset.toggle,
        );
        item.enabled = input.checked;
        render(filtered());
        Luma.toast(item.enabled ? "素材已设为展示" : "素材已设为隐藏");
      };
      document.addEventListener("click", (event) => {
        const remove = event.target.closest("[data-delete]");
        if (remove) {
          deleting = placements.find(
            (item) => item.id === remove.dataset.delete,
          );
          deleteText.textContent = `确认删除“${positionText[deleting.position]}”中的该展示素材？`;
          deleteOverlay.classList.add("show");
        }
        const close = event.target.closest("[data-close]");
        if (close)
          document
            .querySelector(`#${close.dataset.close}`)
            .classList.remove("show");
        if (event.target.classList.contains("admin-overlay"))
          event.target.classList.remove("show");
      });
      deleteForm.onsubmit = (event) => {
        event.preventDefault();
        const index = placements.indexOf(deleting);
        if (index >= 0) placements.splice(index, 1);
        deleteOverlay.classList.remove("show");
        render(filtered());
        Luma.toast("展示素材已删除");
      };
      render(placements);
      window.parent.postMessage(
        { type: "luma-page", file: "admin-placement-config.html" },
        "*",
      );
      Luma.registerStates({
        全部素材: () => render(placements),
        展示中: () => render(placements.filter((item) => item.enabled)),
        隐藏: () => render(placements.filter((item) => !item.enabled)),
        无查询结果: () => render([]),
      });
    </script>
  </body>
</html>
