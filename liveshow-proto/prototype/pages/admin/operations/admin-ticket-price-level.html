          <section class="admin-panel admin-table-panel">
            <div class="admin-table-toolbar">
              <strong>价格档位配置</strong><span id="resultCount"></span>
            </div>
            <div class="admin-table-wrap">
              <table class="admin-table has-actions" style="min-width: 960px">
                <thead>
                  <tr>
                    <th>档位 ID</th>
                    <th>门票价格（金币）</th>
                    <th>启用状态</th>
                    <th>排序</th>
                    <th>最后操作人</th>
                    <th>更新时间</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="levelRows"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script>
      const storageKey = "luma-admin-ticket-price-levels-v1";
      function sharedStorage() {
        try {
          return window.parent && window.parent !== window
            ? window.parent.localStorage
            : localStorage;
        } catch (error) {
          return localStorage;
        }
      }
      function readLevels() {
        try {
          const saved = JSON.parse(
            sharedStorage().getItem(storageKey) || "null",
          );
          if (Array.isArray(saved)) return saved;
        } catch (error) {}
        return LUMA_ADMIN_MOCK.ticketPriceLevels.map((item) => ({ ...item }));
      }
      function saveLevels() {
        try {
          sharedStorage().setItem(storageKey, JSON.stringify(levels));
        } catch (error) {}
      }
      let levels = readLevels();
      function sortedLevels() {
        return [...levels].sort(
          (left, right) => left.sort - right.sort || left.price - right.price,
        );
      }
      function render() {
        const items = sortedLevels();
        resultCount.textContent = `共 ${items.length} 个档位`;
        levelRows.innerHTML = items.length
          ? items
              .map(
                (item) => /* HTML */ `<tr>
                  <td>${item.id}</td>
                  <td><b>${LUMA_FORMAT.coins(item.price)} 金币</b></td>
                  <td>
                    <div class="admin-switch-control">
                      <label class="admin-switch"
                        ><input
                          type="checkbox"
                          data-toggle="${item.id}"
                          ${item.enabled ? "checked" : ""} /><span
                          class="admin-switch-track"
                        ></span></label
                      ><span>${item.enabled ? "启用" : "停用"}</span>
                    </div>
                  </td>
                  <td>${item.sort}</td>
                  <td>${item.operator}</td>
                  <td>${item.updatedAt}</td>
                  <td>
                    <a
                      class="admin-action"
                      href="admin-ticket-price-level-detail.html?id=${item.id}"
                      >编辑</a
                    >
                  </td>
                </tr>`,
              )
              .join("")
          : '<tr><td colspan="7"><div class="admin-empty"><strong>暂无价格档位</strong></div></td></tr>';
      }
      levelRows.onchange = (event) => {
        const input = event.target.closest("[data-toggle]");
        if (!input) return;
        const item = levels.find((entry) => entry.id === input.dataset.toggle);
        if (
          !input.checked &&
          levels.filter((entry) => entry.id !== item.id && entry.enabled)
            .length === 0
        ) {
          input.checked = true;
          return Luma.toast("门票房至少保留一个启用档位");
        }
        item.enabled = input.checked;
        item.operator = "后台管理员";
        item.updatedAt = "27/8/2026 11.30";
        saveLevels();
        render();
        Luma.toast(item.enabled ? "价格档位已启用" : "价格档位已停用");
      };
      render();
      window.parent.postMessage(
        { type: "luma-page", file: "admin-ticket-price-level.html" },
        "*",
      );
    </script>
