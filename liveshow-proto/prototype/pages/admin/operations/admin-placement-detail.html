<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>展示素材编辑 · 运营配置 · Luma Live 管理后台</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <script src="../../../assets/admin-tokens.js"></script>
    <link
      rel="stylesheet"
      href="../../../assets/admin.css?v=20260821-filter-layout-v4"
    />
    <script src="../../../assets/common.js?v=20260821-date-placeholder-v3"></script>
    <script src="../../../assets/mock.js?v=20260811-guild-currency-v1"></script>
    <script src="../../../assets/admin-mock.js?v=20260813-id-format-v4"></script>
    <style>
      .carousel-section{max-width:1120px;margin-bottom:20px}
      .carousel-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
      .carousel-section-head h3{margin:0;font-size:var(--admin-font-md)}
      .carousel-list{display:grid;gap:12px}
      .carousel-row{display:grid;grid-template-columns:42px minmax(0,1fr) 38px;gap:12px;padding:14px;border:1px solid var(--admin-border);border-radius:var(--admin-radius-sm);background:var(--admin-canvas)}
      .carousel-row.is-dragging{opacity:.45}
      .carousel-row.is-error{border-color:var(--admin-danger);box-shadow:0 0 0 2px var(--admin-danger-soft)}
      .carousel-handle{align-self:start;width:36px;height:36px;border:1px solid var(--admin-border);border-radius:var(--admin-radius-sm);background:var(--admin-surface);color:var(--admin-muted);font-size:12px;cursor:grab;display:flex;align-items:center;justify-content:center;gap:2px;user-select:none;touch-action:none}
      .carousel-handle span:last-child{font-size:16px}
      .carousel-handle:active{cursor:grabbing}
      .carousel-main{min-width:0}
      .carousel-fields{display:grid;grid-template-columns:minmax(220px,1fr) minmax(190px,.8fr) minmax(250px,1.15fr);gap:14px}
      .carousel-field{min-width:0}
      .carousel-field>label{display:block;margin-bottom:7px;color:var(--admin-muted);font-size:var(--admin-font-xs)}
      .carousel-field>label:after{content:' *';color:var(--admin-danger);font-weight:600}
      .carousel-upload{position:relative}
      .carousel-upload .admin-media-upload-preview{min-width:0;height:36px;padding-right:44px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .carousel-upload .admin-media-delete{top:4px;right:6px}
      .carousel-remove{align-self:start;margin-top:2px;color:var(--admin-danger)}
      .carousel-remove:disabled{color:var(--admin-muted)}
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="admin-brand">
          <span class="admin-brand-mark">L</span><span>Luma 管理后台</span>
        </div>
        <nav class="admin-nav">
          <a class="admin-nav-item" href="../user/admin-user-list.html"
            ><span>用户管理</span><span>›</span></a
          ><a class="admin-nav-item" href="../host/admin-host-list.html"
            ><span>主播管理</span><span>›</span></a
          ><a class="admin-nav-item" href="../guild/admin-guild-list.html"
            ><span>公会管理</span><span>›</span></a
          ><a class="admin-nav-item" href="../gifts/admin-gift-list.html"
            ><span>礼物道具</span><span>›</span></a
          ><button class="admin-nav-item active">
            <span>运营配置</span><span>⌄</span>
          </button>
          <div class="admin-nav-submenu">
            <a class="admin-nav-sub active" href="admin-placement-config.html"
              >展位配置</a
            ><a class="admin-nav-sub" href="admin-push-management.html"
              >推送管理</a
            ><a class="admin-nav-sub" href="admin-recharge-package.html"
              >充值套餐</a
            ><a class="admin-nav-sub" href="admin-task-config.html">任务配置</a
            ><a class="admin-nav-sub" href="admin-guild-recommendation.html"
              >公会推荐</a
            ><a class="admin-nav-sub" href="admin-live-type.html">直播类型</a
            ><a class="admin-nav-sub" href="admin-feature-switch.html"
              >直播房型</a
            ><a class="admin-nav-sub" href="admin-sensitive-words.html"
              >敏感词库</a
            >
          </div>
          <a
            class="admin-nav-item"
            href="../finance/admin-settlement-record.html"
            ><span>财务分成</span><span>›</span></a
          ><button class="admin-nav-item" data-menu="数据分析">
            <span>数据分析</span><span>›</span></button
          ><button class="admin-nav-item" data-menu="系统配置">
            <span>系统配置</span><span>›</span>
          </button>
        </nav>
      </aside>
      <div class="admin-main">
        <header class="admin-topbar">
          <div class="admin-breadcrumb">
            运营配置&nbsp;&nbsp;/&nbsp;&nbsp;展位配置&nbsp;&nbsp;/&nbsp;&nbsp;<strong
              id="pageName"
            ></strong>
          </div>
          <div class="admin-account">
            <span class="admin-account-avatar">管</span><span>后台管理员</span
            ><span>⌄</span>
          </div>
        </header>
        <main class="admin-content">
          <a class="admin-back-link" href="admin-placement-config.html"
            >‹ 返回展位配置</a
          >
          <section class="admin-panel admin-profile-panel">
            <div class="admin-section-head"><h2 id="formTitle"></h2></div>
            <form class="admin-resource-form" id="placementForm">
              <div class="admin-form-grid admin-basic-form-grid">
                <div class="admin-form-row">
                  <label for="position">展示位置</label
                  ><select class="admin-select" id="position" required>
                    <option value="live_top">直播广场运营位</option>
                    <option value="welfare_focus">福利中心轮播位</option>
                  </select>
                </div>
                <div class="admin-form-row">
                  <label>状态</label>
                  <div class="admin-switch-control">
                    <label class="admin-switch"
                      ><input id="enabled" type="checkbox" /><span
                        class="admin-switch-track"
                      ></span></label
                    ><span id="enabledText"></span>
                  </div>
                </div>
              </div>
              <section class="carousel-section state-hide" id="carouselSection">
                <div class="carousel-section-head">
                  <h3>轮播内容</h3>
                  <button class="admin-btn secondary" id="addCarouselItem" type="button">添加轮播内容</button>
                </div>
                <div class="carousel-list" id="carouselList"></div>
              </section>
              <div id="singleContent">
              <div class="admin-media-upload-grid">
                <div class="admin-media-upload">
                  <h4>展示素材</h4>
                  <div class="admin-media-upload-preview-wrap">
                    <button
                      class="admin-media-upload-preview"
                      type="button"
                      id="materialPreview"
                    >
                      点击上传</button
                    ><button
                      class="admin-media-delete state-hide"
                      type="button"
                      id="deleteMaterial"
                      aria-label="删除展示素材"
                      title="删除展示素材"
                    >
                      ×
                    </button>
                  </div>
                  <input
                    class="admin-file-input"
                    id="materialFile"
                    type="file"
                    accept="image/*,.webp,.gif"
                  />
                </div>
              </div>
              <div class="admin-form-grid admin-basic-form-grid">
                <div class="admin-form-row">
                  <label for="jumpType">点击后跳转</label
                  ><select class="admin-select" id="jumpType" required>
                    <option value="app_page">APP 已有页面</option>
                    <option value="activity_image">活动长图页面</option>
                  </select>
                </div>
                <div class="admin-form-row" id="targetPageRow">
                  <label for="targetPage">目标页面</label
                  ><select class="admin-select" id="targetPage">
                    <option value="recharge">充值页面</option>
                    <option value="welfare">福利中心</option>
                    <option value="task">任务中心</option>
                    <option value="live_plaza">直播广场</option>
                    <option value="guild">公会页面</option>
                    <option value="profile">个人中心</option>
                  </select>
                </div>
              </div>
              <div
                class="admin-media-upload-grid state-hide"
                id="detailImageWrap"
              >
                <div class="admin-media-upload">
                  <h4>活动详情长图</h4>
                  <div class="admin-media-upload-preview-wrap">
                    <button
                      class="admin-media-upload-preview"
                      type="button"
                      id="detailImagePreview"
                    >
                      点击上传</button
                    ><button
                      class="admin-media-delete state-hide"
                      type="button"
                      id="deleteDetailImage"
                      aria-label="删除活动详情长图"
                      title="删除活动详情长图"
                    >
                      ×
                    </button>
                  </div>
                  <input
                    class="admin-file-input"
                    id="detailImageFile"
                    type="file"
                    accept="image/*,.webp,.gif"
                  />
                </div>
              </div>
              </div>
              <div class="admin-form-grid">
                <div class="admin-form-row full">
                  <label>展示周期</label>
                  <div class="admin-range">
                    <input
                      class="admin-input"
                      id="periodStart"
                      type="date"
                      required
                    /><span>至</span
                    ><input
                      class="admin-input"
                      id="periodEnd"
                      type="date"
                      required
                    />
                  </div>
                </div>
              </div>
              <div class="admin-modal-foot">
                <a
                  class="admin-btn secondary"
                  href="admin-placement-config.html"
                  >取消</a
                ><button class="admin-btn" type="submit">保存</button>
              </div>
            </form>
          </section>
        </main>
      </div>
    </div>
    <div class="admin-overlay" id="mediaPreviewOverlay">
      <section class="admin-modal admin-media-preview-modal">
        <div class="admin-modal-head">
          <h2 id="mediaPreviewTitle">展示素材预览</h2>
          <button class="admin-icon-btn" data-close="mediaPreviewOverlay">
            ×
          </button>
        </div>
        <div class="admin-modal-body">
          <div class="admin-media-full-preview" id="mediaPreviewContent"></div>
        </div>
      </section>
    </div>
    <script>
      const placements = window.LUMA_ADMIN_MOCK.placementItems,
        params = new URLSearchParams(location.search),
        appPageOptions = [
          ["recharge", "充值页面"],
          ["welfare", "福利中心"],
          ["task", "任务中心"],
          ["live_plaza", "直播广场"],
          ["guild", "公会页面"],
          ["profile", "个人中心"],
        ],
        maxCarouselItems = 5;
      let isNew = params.get("new") === "1",
        item = isNew
          ? blankItem()
          : placements.find((entry) => entry.id === params.get("id")) ||
            placements[0],
        editorMaterial,
        editorDetailImage,
        draggedCarouselId = "",
        carouselItems;
      if (!isNew) restorePlacement(item);
      editorMaterial = item.material;
      editorDetailImage = item.detailImage || "未上传";
      carouselItems = normalizeCarouselItems(item);
      function nextId() {
        return `DSP${String(Math.max(...placements.map((entry) => Number(entry.id.replace(/\D/g, "")))) + 1).padStart(4, "0")}`;
      }
      function blankItem() {
        return {
          id: nextId(),
          position: "live_top",
          material: "未上传",
          jumpType: "app_page",
          targetPage: "recharge",
          detailImage: "未上传",
          startAt: "2026-08-06 00:00",
          endAt: "2026-08-31 23:59",
          enabled: true,
        };
      }
      function blankCarouselItem(saved = false) {
        return {
          id: `CAR${Date.now()}${Math.random().toString(16).slice(2, 6)}`,
          material: "未上传",
          materialUrl: "",
          jumpType: "app_page",
          targetPage: "recharge",
          detailImage: "未上传",
          detailImageUrl: "",
          saved,
        };
      }
      function restorePlacement(source) {
        try {
          const saved = sessionStorage.getItem(`luma-placement-${source.id}`);
          if (saved) Object.assign(source, JSON.parse(saved));
        } catch (_) {}
      }
      function persistPlacement(source) {
        try {
          sessionStorage.setItem(`luma-placement-${source.id}`, JSON.stringify(source));
        } catch (_) {}
      }
      function normalizeCarouselItems(source) {
        const rows = source.carouselItems?.length
          ? source.carouselItems
          : [{
              material: source.material,
              jumpType: source.jumpType,
              targetPage: source.targetPage,
              detailImage: source.detailImage,
            }];
        return rows.map((row, index) => ({
          ...blankCarouselItem(true),
          ...row,
          id: row.id || `CAR${source.id}${index + 1}`,
          materialUrl: row.materialUrl || "",
          detailImageUrl: row.detailImageUrl || "",
          saved: !isNew,
        }));
      }
      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (character) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[character]);
      }
      function dateOf(value) {
        return value.slice(0, 10);
      }
      function renderMaterial() {
        const empty = editorMaterial === "未上传";
        materialPreview.textContent = empty ? "点击上传" : editorMaterial;
        materialPreview.classList.toggle("is-empty", empty);
        deleteMaterial.classList.toggle("state-hide", empty);
      }
      function renderDetailImage() {
        const empty = editorDetailImage === "未上传";
        detailImagePreview.textContent = empty ? "点击上传" : editorDetailImage;
        detailImagePreview.classList.toggle("is-empty", empty);
        deleteDetailImage.classList.toggle("state-hide", empty);
      }
      function syncEnabled() {
        enabledText.textContent = enabled.checked ? "展示" : "隐藏";
      }
      function syncJumpType() {
        const isAppPage = jumpType.value === "app_page";
        targetPageRow.classList.toggle("state-hide", !isAppPage);
        detailImageWrap.classList.toggle("state-hide", isAppPage);
        targetPage.required = isAppPage;
      }
      function carouselUpload(row, kind) {
        const isMaterial = kind === "material";
        const name = isMaterial ? row.material : row.detailImage;
        return `<div class="carousel-upload">
          <button class="admin-media-upload-preview ${name === "未上传" ? "is-empty" : ""}" type="button" data-preview-file="${kind}" title="${escapeHtml(name)}">${escapeHtml(name === "未上传" ? "点击上传" : name)}</button>
          ${name === "未上传" ? "" : `<button class="admin-media-delete" type="button" data-clear-file="${kind}" aria-label="删除${isMaterial ? "展示素材" : "活动详情长图"}" title="删除">×</button>`}
          <input class="admin-file-input" type="file" accept="image/*,.webp,.gif" data-file-input="${kind}" />
        </div>`;
      }
      function renderCarouselItems() {
        carouselList.innerHTML = carouselItems.map((row, index) => `
          <article class="carousel-row" data-carousel-id="${row.id}">
            <div class="carousel-handle" role="button" tabindex="0" aria-label="拖动第 ${index + 1} 项" title="拖动调整顺序"><span>${index + 1}</span><span>⠿</span></div>
            <div class="carousel-main">
              <div class="carousel-fields">
                <div class="carousel-field"><label>展示素材</label>${carouselUpload(row, "material")}</div>
                <div class="carousel-field"><label>点击后跳转</label><select class="admin-select" data-jump-type>
                  <option value="app_page" ${row.jumpType === "app_page" ? "selected" : ""}>APP 已有页面</option>
                  <option value="activity_image" ${row.jumpType === "activity_image" ? "selected" : ""}>活动长图页面</option>
                </select></div>
                <div class="carousel-field"><label>${row.jumpType === "app_page" ? "目标页面" : "活动详情长图"}</label>
                  ${row.jumpType === "app_page"
                    ? `<select class="admin-select" data-target-page>${appPageOptions.map(([value, label]) => `<option value="${value}" ${row.targetPage === value ? "selected" : ""}>${label}</option>`).join("")}</select>`
                    : carouselUpload(row, "detailImage")}
                </div>
              </div>
            </div>
            <button class="admin-icon-btn carousel-remove" type="button" data-remove-carousel aria-label="删除轮播内容 ${index + 1}" title="删除" ${carouselItems.length === 1 ? "disabled" : ""}>×</button>
          </article>`).join("");
        addCarouselItem.disabled = carouselItems.length >= maxCarouselItems;
        addCarouselItem.title = addCarouselItem.disabled ? "轮播图最多添加 5 个" : "";
      }
      function syncPositionType() {
        carouselSection.classList.remove("state-hide");
        singleContent.classList.add("state-hide");
        renderCarouselItems();
      }
      function showPreview(title, file) {
        mediaPreviewTitle.textContent = title;
        mediaPreviewContent.textContent = file;
        mediaPreviewOverlay.classList.add("show");
      }
      function renderForm() {
        const title = isNew ? "新建展示素材" : "编辑展示素材";
        pageName.textContent = title;
        formTitle.textContent = title;
        position.value = item.position;
        jumpType.value = item.jumpType || "app_page";
        targetPage.value = item.targetPage || "recharge";
        periodStart.value = dateOf(item.startAt);
        periodEnd.value = dateOf(item.endAt);
        enabled.checked = item.enabled;
        renderMaterial();
        renderDetailImage();
        syncJumpType();
        syncPositionType();
        syncEnabled();
      }
      function hasConflict() {
        return placements.some(
          (existing) =>
            existing.id !== item.id &&
            existing.position === position.value &&
            periodStart.value <= dateOf(existing.endAt) &&
            periodEnd.value >= dateOf(existing.startAt),
        );
      }
      enabled.onchange = syncEnabled;
      position.onchange = syncPositionType;
      jumpType.onchange = syncJumpType;
      materialPreview.onclick = () => {
        if (editorMaterial === "未上传") materialFile.click();
        else showPreview("展示素材预览", editorMaterial);
      };
      deleteMaterial.onclick = () => {
        editorMaterial = "未上传";
        renderMaterial();
      };
      materialFile.onchange = () => {
        if (materialFile.files[0]) {
          editorMaterial = materialFile.files[0].name;
          renderMaterial();
        }
      };
      detailImagePreview.onclick = () => {
        if (editorDetailImage === "未上传") detailImageFile.click();
        else showPreview("活动详情长图预览", editorDetailImage);
      };
      deleteDetailImage.onclick = () => {
        editorDetailImage = "未上传";
        renderDetailImage();
      };
      detailImageFile.onchange = () => {
        if (detailImageFile.files[0]) {
          editorDetailImage = detailImageFile.files[0].name;
          renderDetailImage();
        }
      };
      addCarouselItem.onclick = () => {
        if (carouselItems.length >= maxCarouselItems)
          return Luma.toast("轮播图最多添加 5 个");
        carouselItems.push(blankCarouselItem());
        renderCarouselItems();
      };
      carouselList.onclick = (event) => {
        const rowElement = event.target.closest("[data-carousel-id]");
        if (!rowElement) return;
        const row = carouselItems.find((entry) => entry.id === rowElement.dataset.carouselId);
        const preview = event.target.closest("[data-preview-file]");
        const clear = event.target.closest("[data-clear-file]");
        const remove = event.target.closest("[data-remove-carousel]");
        if (clear) {
          const kind = clear.dataset.clearFile;
          if (kind === "material") row.material = "未上传";
          else row.detailImage = "未上传";
          renderCarouselItems();
          return;
        }
        if (preview) {
          const kind = preview.dataset.previewFile;
          const name = kind === "material" ? row.material : row.detailImage;
          if (name === "未上传") rowElement.querySelector(`[data-file-input="${kind}"]`).click();
          else showPreview(kind === "material" ? "展示素材预览" : "活动详情长图预览", name);
        }
        if (remove && carouselItems.length > 1) {
          if (row.saved && !confirm(`确认删除轮播内容 ${carouselItems.indexOf(row) + 1}？`)) return;
          carouselItems = carouselItems.filter((entry) => entry !== row);
          renderCarouselItems();
        }
      };
      carouselList.onchange = (event) => {
        const rowElement = event.target.closest("[data-carousel-id]");
        if (!rowElement) return;
        const row = carouselItems.find((entry) => entry.id === rowElement.dataset.carouselId);
        rowElement.classList.remove("is-error");
        if (event.target.matches("[data-jump-type]")) {
          row.jumpType = event.target.value;
          renderCarouselItems();
        } else if (event.target.matches("[data-target-page]")) {
          row.targetPage = event.target.value;
        } else if (event.target.matches("[data-file-input]")) {
          const file = event.target.files[0];
          if (!file) return;
          const kind = event.target.dataset.fileInput;
          if (kind === "material") row.material = file.name;
          else row.detailImage = file.name;
          renderCarouselItems();
        }
      };
      carouselList.onpointerdown = (event) => {
        const handle = event.target.closest(".carousel-handle");
        if (!handle) return;
        const row = handle.closest("[data-carousel-id]");
        draggedCarouselId = row.dataset.carouselId;
        row.classList.add("is-dragging");
        event.preventDefault();
      };
      document.addEventListener("pointerup", (event) => {
        if (!draggedCarouselId) return;
        const target = event.target.closest("[data-carousel-id]");
        if (target && target.dataset.carouselId !== draggedCarouselId) {
          const from = carouselItems.findIndex((row) => row.id === draggedCarouselId);
          const to = carouselItems.findIndex((row) => row.id === target.dataset.carouselId);
          carouselItems.splice(to, 0, carouselItems.splice(from, 1)[0]);
        }
        draggedCarouselId = "";
        renderCarouselItems();
      });
      function validateCarouselItems() {
        if (!carouselItems.length) return Luma.toast("轮播位至少配置一项");
        if (carouselItems.length > maxCarouselItems) return Luma.toast("轮播图最多添加 5 个");
        const invalidIndex = carouselItems.findIndex((row) =>
          row.material === "未上传" ||
          !row.jumpType ||
          (row.jumpType === "app_page" ? !row.targetPage : row.detailImage === "未上传"));
        if (invalidIndex < 0) return true;
        const row = carouselList.children[invalidIndex];
        row.classList.add("is-error");
        row.scrollIntoView({ behavior: "smooth", block: "center" });
        const current = carouselItems[invalidIndex];
        const message = current.material === "未上传"
          ? "请上传展示素材"
          : current.jumpType === "activity_image" && current.detailImage === "未上传"
            ? "请上传活动详情长图"
            : "请选择目标页面";
        Luma.toast(`轮播内容 ${invalidIndex + 1}：${message}`);
        return false;
      }
      placementForm.onsubmit = (event) => {
        event.preventDefault();
        if (!validateCarouselItems()) return;
        if (periodStart.value > periodEnd.value)
          return Luma.toast("展示周期结束日期不能早于开始日期");
        if (hasConflict())
          return Luma.toast("该展示位置的展示周期与已有素材冲突");
        const created = isNew;
        const firstCarousel = carouselItems[0];
        Object.assign(item, {
          position: position.value,
          material: firstCarousel.material,
          jumpType: firstCarousel.jumpType,
          targetPage: firstCarousel.targetPage,
          detailImage: firstCarousel.detailImage,
          carouselItems: carouselItems.map((row) => ({ ...row, saved: true })),
          startAt: `${periodStart.value} 00:00`,
          endAt: `${periodEnd.value} 23:59`,
          enabled: enabled.checked,
        });
        carouselItems.forEach((row) => row.saved = true);
        persistPlacement(item);
        if (created) {
          placements.unshift(item);
          isNew = false;
          history.replaceState(
            null,
            "",
            `admin-placement-detail.html?id=${item.id}&edit=1`,
          );
        }
        renderForm();
        Luma.toast(created ? "展示素材已新建" : "展示素材已保存");
      };
      document.addEventListener("click", (event) => {
        const close = event.target.closest("[data-close]");
        if (close)
          document
            .querySelector(`#${close.dataset.close}`)
            .classList.remove("show");
        if (event.target.classList.contains("admin-overlay"))
          event.target.classList.remove("show");
      });
      renderForm();
      window.parent.postMessage(
        {
          type: "luma-page",
          file: "admin-placement-detail.html",
          query: location.search,
        },
        "*",
      );
      Luma.registerStates({
        编辑素材: renderForm,
        周期冲突: () => {
          position.value = "live_top";
          periodStart.value = "2026-08-06";
          periodEnd.value = "2026-08-10";
        },
        隐藏状态: () => {
          enabled.checked = false;
          syncEnabled();
        },
      });
    </script>
  </body>
</html>
