<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>账号列表 · 运营账号 · Luma Live 管理后台</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <script src="../../../assets/admin-tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/admin.css?v=20260829-operation-accounts-v3" />
    <script src="../../../assets/common.js?v=20260829-operation-accounts-v3"></script>
    <script src="../../../assets/operation-accounts.js?v=20260829-v4"></script>
  </head>
  <body>
    <div class="admin-shell">
      <aside class="admin-sidebar"><div class="admin-brand"><span class="admin-brand-mark">L</span><span>Luma 管理后台</span></div><nav class="admin-nav"></nav><div class="admin-sidebar-foot">Luma Live 管理后台</div></aside>
      <div class="admin-main">
        <header class="admin-topbar"><div class="admin-breadcrumb">运营账号&nbsp;&nbsp;/&nbsp;&nbsp;<strong>账号列表</strong></div><div class="admin-account"><span class="admin-account-avatar">管</span><span>后台管理员</span><span>⌄</span></div></header>
        <main class="admin-content">
          <div class="admin-page-head"><h1>账号列表</h1><div class="admin-page-actions"><a class="admin-btn" href="admin-operation-account-create.html">创建运营账号</a></div></div>
          <section class="admin-panel admin-filter">
            <div class="admin-filter-grid">
              <div class="admin-field"><label for="keyword">账号</label><input class="admin-input" id="keyword" placeholder="名称或账号" /></div>
              <div class="admin-field"><label for="guildFilter">所属公会</label><select class="admin-select" id="guildFilter"><option value="">全部公会</option></select></div>
              <div class="admin-field"><label for="statusFilter">状态</label><select class="admin-select" id="statusFilter"><option value="">全部状态</option><option value="enabled">启用</option><option value="disabled">禁用</option></select></div>
            </div>
            <div class="admin-filter-actions"><button class="admin-btn secondary" id="resetBtn" type="button">重置</button><button class="admin-btn" id="searchBtn" type="button">查询</button></div>
          </section>
          <section class="admin-panel admin-table-panel">
            <div class="admin-table-toolbar"><strong>运营账号列表</strong><span id="resultCount"></span></div>
            <div class="admin-table-wrap">
              <table class="admin-table has-actions" style="min-width:1120px">
                <colgroup><col style="width:210px" /><col style="width:170px" /><col style="width:110px" /><col style="width:110px" /><col style="width:110px" /><col style="width:110px" /><col style="width:90px" /><col style="width:80px" /></colgroup>
                <thead><tr><th>运营账号</th><th>所属公会</th><th>累计消费</th><th>账户余额</th><th>本月发放</th><th>本月消费</th><th>账号状态</th><th>操作</th></tr></thead>
                <tbody id="rows"></tbody>
              </table>
            </div>
            <div class="admin-pagination" id="pagination"><span>20 条 / 页</span><button class="admin-page-btn" disabled>‹</button><button class="admin-page-btn active" disabled>1</button><button class="admin-page-btn" disabled>›</button></div>
          </section>
        </main>
      </div>
    </div>

    <script>
      const store = LUMA_OPERATION_ACCOUNTS;
      const fmt = store.formatCoins;
      const accounts = store.accounts;
      const params = new URLSearchParams(location.search);
      const keyword = document.getElementById("keyword");
      const guildFilter = document.getElementById("guildFilter");
      const statusFilter = document.getElementById("statusFilter");
      const resetBtn = document.getElementById("resetBtn");
      const searchBtn = document.getElementById("searchBtn");
      const rows = document.getElementById("rows");
      const resultCount = document.getElementById("resultCount");
      const pagination = document.getElementById("pagination");
      const displayAccount = (account) => account.id.replace(/\D/g, "");
      let visible = accounts;

      if (params.get("created") === "1") {
        const guild = store.guilds.find((item) => item.id === params.get("guild")) || store.guilds[0];
        const amount = Number(params.get("coins") || 0);
        const name = params.get("name") || "新运营账号";
        accounts.unshift({ id: "OP260011", account: params.get("account") || "new_ops", name, avatar: name.slice(0, 1).toUpperCase(), guildId: guild.id, guildName: guild.name, level: 1, balance: amount, issued: amount, spentMonth: 0, spentTotal: 0, status: params.get("status") || "enabled", managementLocked: false, lastLogin: "-" });
        guild.issued += amount;
      }

      guildFilter.innerHTML += store.guilds.map((guild) => `<option value="${guild.id}">${guild.name}</option>`).join("");

      function render(items) {
        visible = items;
        resultCount.textContent = `共 ${items.length} 个账号`;
        pagination.classList.toggle("state-hide", !items.length);
        rows.innerHTML = items.length ? items.map((account) => `<tr>
          <td><div class="admin-user-cell"><span class="admin-avatar">${account.avatar}</span><span class="admin-user-name"><b>${account.name}</b><span class="admin-muted">${displayAccount(account)}</span></span></div></td>
          <td>${account.guildName}<br><span class="admin-muted">${account.guildId}</span></td>
          <td class="admin-money">${fmt(account.spentTotal)}</td>
          <td class="admin-money">${fmt(account.balance)}</td>
          <td class="admin-money">${fmt(account.issued)}</td>
          <td class="admin-money">${fmt(account.spentMonth)}</td>
          <td><span class="admin-status ${account.status}">${account.status === "enabled" ? "启用" : "禁用"}</span></td>
          <td><a class="admin-action" href="admin-operation-account-detail.html?id=${account.id}">详情</a></td>
        </tr>`).join("") : '<tr><td colspan="8"><div class="admin-empty"><strong>未找到运营账号</strong></div></td></tr>';
      }

      function filter() {
        const key = keyword.value.trim().toLowerCase();
        render(accounts.filter((account) => (!key || account.name.toLowerCase().includes(key) || displayAccount(account).includes(key)) && (!guildFilter.value || account.guildId === guildFilter.value) && (!statusFilter.value || account.status === statusFilter.value)));
        Luma.toast(`已查询到 ${visible.length} 个账号`);
      }

      searchBtn.onclick = filter;
      resetBtn.onclick = () => { keyword.value = ""; guildFilter.value = ""; statusFilter.value = ""; render(accounts); };
      render(accounts);
      if (params.get("created") === "1") Luma.toast("运营账号已创建");
      window.parent.postMessage({ type: "luma-page", file: "admin-operation-accounts.html", query: location.search }, "*");
      Luma.registerStates({ "列表状态": { "默认": () => render(accounts), "空状态": () => render([]) } });
    </script>
  </body>
</html>
