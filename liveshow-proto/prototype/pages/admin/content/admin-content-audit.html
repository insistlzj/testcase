<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>内容审核 · Luma Live 管理后台</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <script src="../../../assets/admin-tokens.js"></script>
    <link
      rel="stylesheet"
      href="../../../assets/admin.css?v=20260821-filter-actions-v8"
    />
    <script src="../../../assets/common.js?v=20260821-date-placeholder-v3"></script>
    <script src="../../../assets/mock.js?v=20260811-guild-currency-v1"></script>
    <script src="../../../assets/admin-mock.js?v=20260813-id-format-v4"></script>
  </head>
  <body>
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="admin-brand">
          <span class="admin-brand-mark">L</span><span>Luma 管理后台</span>
        </div>
        <nav class="admin-nav">
          <a class="admin-nav-item" href="../user/admin-user-list.html"
            ><span>用户管理</span><span>›</span></a
          ><button class="admin-nav-item active">
            <span>主播管理</span><span>⌄</span>
          </button>
          <div class="admin-nav-submenu">
            <a class="admin-nav-sub" href="../host/admin-host-review.html"
              >主播审核</a
            ><a class="admin-nav-sub" href="../host/admin-host-list.html"
              >主播列表</a
            ><a class="admin-nav-sub" href="../host/admin-live-management.html"
              >直播场次</a
            ><a
              class="admin-nav-sub"
              href="../host/admin-inspection-schedule.html"
              >巡房排班</a
            ><a class="admin-nav-sub active" href="admin-content-audit.html"
              >内容审核</a
            ><a class="admin-nav-sub" href="admin-report-handling.html"
              >举报处理</a
            >
          </div>
          <a class="admin-nav-item" href="../guild/admin-guild-list.html"
            ><span>公会管理</span><span>›</span></a
          ><a class="admin-nav-item" href="../gifts/admin-gift-list.html"
            ><span>礼物道具</span><span>›</span></a
          ><a
            class="admin-nav-item"
            href="../operations/admin-placement-config.html"
            ><span>运营配置</span><span>›</span></a
          ><a
            class="admin-nav-item"
            href="../finance/admin-settlement-record.html"
            ><span>财务分成</span><span>›</span></a
          ><button class="admin-nav-item" data-menu="数据分析">
            <span>数据分析</span><span>›</span></button
          ><button class="admin-nav-item" data-menu="系统配置">
            <span>系统配置</span><span>›</span>
          </button>
        </nav>
        <div class="admin-sidebar-foot">Luma Live 管理后台</div>
      </aside>
      <div class="admin-main">
        <header class="admin-topbar">
          <div class="admin-breadcrumb"><strong>内容审核</strong></div>
          <div class="admin-account">
            <span class="admin-account-avatar">管</span><span>后台管理员</span
            ><span>⌄</span>
          </div>
        </header>
        <main class="admin-content">
          <div class="admin-page-head">
            <div><h1>内容审核</h1></div>
          </div>
          <section class="admin-panel admin-filter">
            <div class="admin-filter-grid">
              <div class="admin-field">
                <label for="sessionKey">直播场次 ID</label
                ><input
                  class="admin-input"
                  id="sessionKey"
                  placeholder="输入直播场次 ID"
                />
              </div>
              <div class="admin-field">
                <label for="hostKey">主播</label
                ><input
                  class="admin-input"
                  id="hostKey"
                  placeholder="输入主播 ID 或昵称"
                />
              </div>
              <div class="admin-field">
                <label for="hitType">命中类型</label
                ><select class="admin-select" id="hitType">
                  <option value="">全部类型</option>
                  <option>疑似站外引流</option>
                  <option>敏感词命中</option>
                  <option>画面疑似违规</option>
                  <option>站外联系方式</option>
                  <option>疑似低俗内容</option>
                </select>
              </div>
              <div class="admin-field">
                <label for="riskLevel">风险等级</label
                ><select class="admin-select" id="riskLevel">
                  <option value="">全部等级</option>
                  <option value="high">高风险</option>
                  <option value="medium">中风险</option>
                  <option value="low">低风险</option>
                </select>
              </div>
              <div class="admin-field">
                <label>告警时间段</label>
                <div class="admin-range admin-date-range">
                  <input class="admin-input" id="startDate" type="date" /><span
                    >至</span
                  ><input class="admin-input" id="endDate" type="date" />
                </div>
              </div>
            </div>
            <div class="admin-filter-actions">
              <button class="admin-btn secondary" id="resetBtn">重置</button
              ><button class="admin-btn" id="searchBtn">查询</button>
            </div>
          </section>
          <section class="admin-panel admin-table-panel">
            <div class="admin-table-toolbar">
              <div class="admin-list-tabs" aria-label="审核状态">
                <button class="admin-list-tab active" data-status-tab="">
                  全部</button
                ><button class="admin-list-tab" data-status-tab="pending">
                  待处理</button
                ><button class="admin-list-tab" data-status-tab="reviewing">
                  人工复审中</button
                ><button class="admin-list-tab" data-status-tab="ignored">
                  已忽略</button
                ><button class="admin-list-tab" data-status-tab="resolved">
                  已处置
                </button>
              </div>
              <span id="resultCount"></span>
            </div>
            <div class="admin-table-wrap">
              <table class="admin-table has-actions" style="min-width: 1300px">
                <colgroup>
                  <col style="width: 140px" />
                  <col style="width: 150px" />
                  <col style="width: 150px" />
                  <col style="width: 90px" />
                  <col style="width: 110px" />
                  <col style="width: 145px" />
                  <col style="width: 110px" />
                  <col style="width: 120px" />
                  <col style="width: 190px" />
                </colgroup>
                <thead>
                  <tr>
                    <th>审核单号</th>
                    <th>主播信息</th>
                    <th>命中类型</th>
                    <th>风险等级</th>
                    <th>告警截图</th>
                    <th>告警时间</th>
                    <th>审核状态</th>
                    <th>处置结果</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="auditRows"></tbody>
              </table>
            </div>
            <div class="admin-pagination" id="pagination">
              <span>20 条 / 页</span
              ><button class="admin-page-btn" disabled>‹</button
              ><button class="admin-page-btn active" disabled>1</button
              ><button class="admin-page-btn" disabled>›</button>
            </div>
          </section>
        </main>
      </div>
    </div>
    <div class="admin-overlay" id="reviewOverlay">
      <section class="admin-modal">
        <div class="admin-modal-head">
          <h2>复审与处置</h2>
          <button class="admin-icon-btn" data-close="reviewOverlay">×</button>
        </div>
        <form id="reviewForm">
          <div class="admin-modal-body">
            <p id="reviewTarget"></p>
            <div class="admin-form-row">
              <label for="reviewResult">复审结果</label
              ><select class="admin-select" id="reviewResult" required>
                <option value="误报">误报</option>
                <option value="违规成立">违规成立</option>
                <option value="轻微违规">轻微违规</option>
              </select>
            </div>
            <div class="admin-form-row">
              <label for="reviewAction">处置类型</label
              ><select class="admin-select" id="reviewAction" required>
                <option value="忽略">忽略</option>
                <option value="转人工复审">转人工复审</option>
                <option value="警告">警告</option>
                <option value="强制关播">强制关播</option>
                <option value="封禁">封禁</option>
                <option value="内容下架">内容下架</option>
              </select>
            </div>
            <div class="admin-form-row">
              <label for="reviewReason">处置原因</label
              ><textarea
                class="admin-textarea"
                id="reviewReason"
                required
              ></textarea>
            </div>
          </div>
          <div class="admin-modal-foot">
            <button
              class="admin-btn secondary"
              type="button"
              data-close="reviewOverlay"
            >
              取消</button
            ><button class="admin-btn" type="submit">确认</button>
          </div>
        </form>
      </section>
    </div>
    <script>
      const data = window.LUMA_ADMIN_MOCK.contentAudits,
        riskText = { high: "高风险", medium: "中风险", low: "低风险" },
        statusText = {
          pending: "待处理",
          reviewing: "人工复审中",
          ignored: "已忽略",
          resolved: "已处置",
        },
        statusClass = {
          pending: "pending",
          reviewing: "muted",
          ignored: "offline",
          resolved: "success",
        };
      let visible = data,
        current = null,
        activeStatus = "";
      const rows = document.querySelector("#auditRows"),
        count = document.querySelector("#resultCount"),
        pagination = document.querySelector("#pagination");
      function render(items) {
        visible = items;
        count.textContent = `共 ${items.length} 条`;
        pagination.classList.toggle("state-hide", !items.length);
        if (!items.length) {
          rows.innerHTML =
            '<tr><td colspan="9"><div class="admin-empty"><strong>未找到告警记录</strong><span>请调整筛选条件后重新查询</span></div></td></tr>';
          return;
        }
        rows.innerHTML = items
          .map(
            (item) =>
              /* HTML */ `<tr>
                <td>${item.auditNo}</td>
                <td>
                  <div class="admin-user-cell">
                    <span class="admin-avatar">${item.initials}</span
                    ><span class="admin-user-name"
                      ><b>${item.name}</b>${Luma.id(
                        item.hostId,
                        "主播ID",
                      )}</span
                    >
                  </div>
                </td>
                <td>${item.hitType}</td>
                <td>
                  <span
                    class="admin-status ${item.risk === "high"
                      ? "banned"
                      : item.risk === "medium"
                        ? "muted"
                        : "offline"}"
                    >${riskText[item.risk]}</span
                  >
                </td>
                <td>
                  <div class="admin-media">
                    <span class="admin-media-placeholder">截图 占位</span>
                  </div>
                </td>
                <td>${item.alertAt}</td>
                <td>
                  <span class="admin-status ${statusClass[item.status]}"
                    >${statusText[item.status]}</span
                  >
                </td>
                <td>${item.result}</td>
                <td>
                  <a
                    class="admin-action"
                    href="admin-content-audit-detail.html?id=${item.auditNo}"
                    >详情</a
                  ><button
                    class="admin-action"
                    data-quick="忽略"
                    data-id="${item.auditNo}"
                  >
                    忽略</button
                  ><button class="admin-action" data-review="${item.auditNo}">
                    ${item.status === "reviewing" ? "继续复审" : "处理"}
                  </button>
                </td>
              </tr>`,
          )
          .join("");
      }
      function syncStatusTabs() {
        document
          .querySelectorAll("[data-status-tab]")
          .forEach((button) =>
            button.classList.toggle(
              "active",
              button.dataset.statusTab === activeStatus,
            ),
          );
      }
      function filter() {
        const session = sessionKey.value.trim().toLowerCase(),
          host = hostKey.value.trim().toLowerCase(),
          hit = hitType.value,
          risk = riskLevel.value,
          start = startDate.value,
          end = endDate.value;
        const items = data.filter(
          (item) =>
            item.sessionId.toLowerCase().includes(session) &&
            `${item.hostId} ${item.name}`.toLowerCase().includes(host) &&
            (!hit || item.hitType === hit) &&
            (!risk || item.risk === risk) &&
            (!activeStatus || item.status === activeStatus) &&
            (!start || item.alertAt.slice(0, 10) >= start) &&
            (!end || item.alertAt.slice(0, 10) <= end),
        );
        render(items);
      }
      function openReview(item) {
        current = item;
        reviewTarget.textContent = `告警 ${item.auditNo} · 直播场次 ${item.sessionId} · ${item.name}`;
        reviewForm.reset();
        reviewOverlay.classList.add("show");
      }
      searchBtn.onclick = () => {
        filter();
        Luma.toast(`已查询到 ${visible.length} 条告警记录`);
      };
      resetBtn.onclick = () => {
        document
          .querySelectorAll(".admin-filter input")
          .forEach((x) => (x.value = ""));
        document
          .querySelectorAll(".admin-filter select")
          .forEach((x) => (x.selectedIndex = 0));
        activeStatus = "";
        syncStatusTabs();
        render(data);
        Luma.toast("筛选条件已重置");
      };
      document.addEventListener("click", (event) => {
        const statusTab = event.target.closest("[data-status-tab]");
        if (statusTab) {
          activeStatus = statusTab.dataset.statusTab;
          syncStatusTabs();
          filter();
        }
        const review = event.target.closest("[data-review]");
        if (review)
          openReview(data.find((x) => x.auditNo === review.dataset.review));
        const quick = event.target.closest("[data-quick]");
        if (quick) {
          const item = data.find((x) => x.auditNo === quick.dataset.id);
          item.status = "ignored";
          item.result = "已忽略";
          item.review = {
            result: "误报",
            action: "忽略",
            reason: "人工判断为误报",
            operator: "后台管理员",
            time: "2026-08-04 12:40",
          };
          filter();
          Luma.toast("告警已忽略");
        }
        const close = event.target.closest("[data-close]");
        if (close)
          document
            .querySelector(`#${close.dataset.close}`)
            .classList.remove("show");
        if (event.target.classList.contains("admin-overlay"))
          event.target.classList.remove("show");
        const menu = event.target.closest("[data-menu]");
        if (menu) Luma.toast(menu.dataset.menu);
      });
      reviewForm.onsubmit = (event) => {
        event.preventDefault();
        const action = reviewAction.value;
        current.status =
          action === "转人工复审"
            ? "reviewing"
            : action === "忽略"
              ? "ignored"
              : "resolved";
        current.result =
          action === "转人工复审"
            ? "人工复审中"
            : action === "忽略"
              ? "已忽略"
              : action;
        current.review = {
          result: reviewResult.value,
          action,
          reason: reviewReason.value.trim(),
          operator: "后台管理员",
          time: "2026-08-04 12:40",
        };
        reviewOverlay.classList.remove("show");
        filter();
        Luma.toast("审核处理已提交");
      };
      render(data);
      window.parent.postMessage(
        { type: "luma-page", file: "admin-content-audit.html" },
        "*",
      );
      Luma.registerStates({
        正常列表: () => render(data),
        待处理告警: () => render(data.filter((x) => x.status === "pending")),
        复审与处置: () => openReview(data[0]),
        无查询结果: () => render([]),
      });
    </script>
  </body>
</html>
