  </head>
  <body>
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="admin-brand">
          <span class="admin-brand-mark">L</span><span>Luma 管理后台</span>
        </div>
        <nav class="admin-nav">
          <a class="admin-nav-item" href="../user/admin-user-list.html"
            ><span>用户管理</span><span>›</span></a
          ><button class="admin-nav-item active">
            <span>主播管理</span><span>⌄</span>
          </button>
          <div class="admin-nav-submenu">
            <a class="admin-nav-sub" href="../host/admin-host-review.html"
              >主播审核</a
            ><a class="admin-nav-sub" href="../host/admin-host-list.html"
              >主播列表</a
            ><a class="admin-nav-sub" href="../host/admin-live-management.html"
              >直播场次</a
            ><a
              class="admin-nav-sub"
              href="../host/admin-inspection-schedule.html"
              >巡房排班</a
            ><a class="admin-nav-sub" href="admin-content-audit.html"
              >内容审核</a
            ><a class="admin-nav-sub active" href="admin-report-handling.html"
              >举报处理</a
            >
          </div>
          <a class="admin-nav-item" href="../guild/admin-guild-list.html"
            ><span>公会管理</span><span>›</span></a
          ><a class="admin-nav-item" href="../gifts/admin-gift-list.html"

          ><a
            class="admin-nav-item"
            href="../operations/admin-placement-config.html"
            ><span>运营配置</span><span>›</span></a
          ><a
            class="admin-nav-item"
            href="../finance/admin-settlement-record.html"
            ><span>财务分成</span><span>›</span></a
          ><button class="admin-nav-item" data-menu="数据分析">
            <span>数据分析</span><span>›</span></button
          ><button class="admin-nav-item" data-menu="系统配置">
            <span>系统配置</span><span>›</span>
          </button>
        </nav>
        <div class="admin-sidebar-foot">Luma Live 管理后台</div>
      </aside>
      <div class="admin-main">
        <header class="admin-topbar">
          <div class="admin-breadcrumb">
            举报处理&nbsp;&nbsp;/&nbsp;&nbsp;<strong>直播间违规</strong>
          </div>
          <div class="admin-account">
            <span class="admin-account-avatar">管</span><span>后台管理员</span
            ><span>⌄</span>
          </div>
        </header>
        <main class="admin-content">
          <div class="admin-page-head">
            <div><h1>直播间违规</h1></div>
          </div>
          <section class="admin-panel admin-filter">
            <div class="admin-filter-grid">
              <div class="admin-field">
                <label for="reporterKey">举报人昵称/ID</label
                ><input
                  class="admin-input"
                  id="reporterKey"
                  placeholder="输入举报人昵称或 ID"
                />
              </div>
              <div class="admin-field">
                <label for="targetKey">直播场次 ID</label
                ><input
                  class="admin-input"
                  id="targetKey"
                  placeholder="输入直播场次 ID"
                />
              </div>
              <div class="admin-field">
                <label for="hostKey">主播昵称/ID</label
                ><input
                  class="admin-input"
                  id="hostKey"
                  placeholder="输入主播昵称或 ID"
                />
              </div>
              <div class="admin-field">
                <label for="reportType">举报类型</label
                ><select class="admin-select" id="reportType">
                  <option value="">全部类型</option>
                  <option>色情低俗</option>
                  <option>涉及宗教政治</option>
                  <option>暴恐血腥</option>
                  <option>未成年有害</option>
                  <option>其他</option>
                </select>
              </div>
              <div class="admin-field">
                <label>提交时间段</label>
                <div class="admin-range admin-date-range">
                  <input class="admin-input" id="startDate" type="date" /><span
                    >至</span
                  ><input class="admin-input" id="endDate" type="date" />
                </div>
              </div>
            </div>
            <div class="admin-filter-actions">
              <button class="admin-btn secondary" id="resetBtn">重置</button
              ><button class="admin-btn" id="searchBtn">查询</button>
            </div>
          </section>
          <section class="admin-panel admin-table-panel">
            <div class="admin-table-toolbar">
              <div class="admin-list-tabs" aria-label="处理状态">
                <button class="admin-list-tab active" data-status-tab="">
                  全部</button
                ><button class="admin-list-tab" data-status-tab="pending">
                  待处理</button
                ><button class="admin-list-tab" data-status-tab="processing">
                  处理中</button
                ><button class="admin-list-tab" data-status-tab="resolved">
                  已处理
                </button>
              </div>
              <span id="resultCount"></span>
            </div>
            <div class="admin-table-wrap">
              <table class="admin-table has-actions" style="min-width: 1300px">
                <colgroup>
                  <col style="width: 170px" />
                  <col style="width: 190px" />
                  <col style="width: 190px" />
                  <col style="width: 120px" />
                  <col style="width: 145px" />
                  <col style="width: 100px" />
                  <col style="width: 115px" />
                  <col style="width: 130px" />
                </colgroup>
                <thead>
                  <tr>
                    <th>举报人信息</th>
                    <th>直播场次 ID</th>
                    <th>主播信息</th>
                    <th>举报类型</th>
                    <th>提交时间</th>
                    <th>处理状态</th>
                    <th>处置结果</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="reportRows"></tbody>
              </table>
            </div>
            <div class="admin-pagination" id="pagination">
              <span>20 条 / 页</span
              ><button class="admin-page-btn" disabled>‹</button
              ><button class="admin-page-btn active" disabled>1</button
              ><button class="admin-page-btn" disabled>›</button>
            </div>
          </section>
        </main>
      </div>
    </div>
    <div class="admin-overlay" id="processOverlay">
      <section class="admin-modal">
        <div class="admin-modal-head">
          <h2>处理举报</h2>
          <button class="admin-icon-btn" data-close="processOverlay">×</button>
        </div>
        <form id="processForm">
          <div class="admin-modal-body">
            <p id="processTarget"></p>
            <div class="admin-form-row">
              <label for="processAction">处置类型</label
              ><select class="admin-select" id="processAction" required>
                <option value="无处置">无处置</option>
                <option value="警告">警告</option>
                <option value="强制关播">强制关播</option>
                <option value="封禁">封禁</option>
                <option value="内容下架">内容下架</option>
              </select>
            </div>
            <div class="admin-form-row">
              <label for="processReason">处置原因</label
              ><textarea
                class="admin-textarea"
                id="processReason"
                required
              ></textarea>
            </div>
            <div class="admin-form-row">
              <label for="processResult">处理结果</label
              ><select class="admin-select" id="processResult" required>
                <option>举报成立</option>
                <option>部分成立</option>
                <option>举报不成立</option>
              </select>
            </div>
          </div>
          <div class="admin-modal-foot">
            <button
              class="admin-btn secondary"
              type="button"
              data-close="processOverlay"
            >
              取消</button
            ><button class="admin-btn" type="submit">确认</button>
          </div>
        </form>
      </section>
    </div>
    <script>
      const data = window.LUMA_ADMIN_MOCK.reports.filter(
          (item) => item.violationScope === "live",
        ),
        statusText = {
          pending: "待处理",
          processing: "处理中",
          resolved: "已处理",
        },
        statusClass = {
          pending: "pending",
          processing: "muted",
          resolved: "success",
        };
      let visible = data,
        current = null,
        activeStatus = "";
      const rows = document.querySelector("#reportRows"),
        count = document.querySelector("#resultCount"),
        pagination = document.querySelector("#pagination");
      function render(items) {
        visible = items;
        count.textContent = `共 ${items.length} 条`;
        pagination.classList.toggle("state-hide", !items.length);
        if (!items.length) {
          rows.innerHTML =
            '<tr><td colspan="8"><div class="admin-empty"><strong>未找到直播间违规记录</strong><span>请调整筛选条件后重新查询</span></div></td></tr>';
          return;
        }
        rows.innerHTML = items
          .map(
            (item) =>
              /* HTML */ `<tr>
                <td>
                  <div class="admin-user-name">
                    <b>${item.reporterName}</b>${Luma.id(
                      item.reporterId,
                      "举报人ID",
                    )}
                  </div>
                </td>
                <td>${Luma.id(item.targetId, "直播场次ID")}</td>
                <td>
                  <div class="admin-user-cell">
                    <span class="admin-avatar">${item.hostInitials}</span
                    ><span class="admin-user-name"
                      ><b>${item.hostName}</b>${Luma.id(
                        item.hostId,
                        "主播ID",
                      )}</span
                    >
                  </div>
                </td>
                <td>${item.reportType}</td>
                <td>${item.submittedAt}</td>
                <td>
                  <span class="admin-status ${statusClass[item.status]}"
                    >${statusText[item.status]}</span
                  >
                </td>
                <td>${item.result}</td>
                <td>
                  <a
                    class="admin-action"
                    href="admin-report-detail.html?id=${item.reportNo}&scope=live"
                    >详情</a
                  >${item.status === "resolved"
                    ? ""
                    : /* HTML */ `<button
                        class="admin-action"
                        data-process="${item.reportNo}"
                      >
                        处理
                      </button>`}
                </td>
              </tr>`,
          )
          .join("");
      }
      function syncStatusTabs() {
        document
          .querySelectorAll("[data-status-tab]")
          .forEach((button) =>
            button.classList.toggle(
              "active",
              button.dataset.statusTab === activeStatus,
            ),
          );
      }
      function filter() {
        const reporter = reporterKey.value.trim().toLowerCase(),
          target = targetKey.value.trim().toLowerCase(),
          host = hostKey.value.trim().toLowerCase(),
          kind = reportType.value,
          start = startDate.value,
          end = endDate.value;
        const items = data.filter(
          (item) =>
            `${item.reporterId} ${item.reporterName}`
              .toLowerCase()
              .includes(reporter) &&
            item.targetId.toLowerCase().includes(target) &&
            `${item.hostId} ${item.hostName}`.toLowerCase().includes(host) &&
            (!kind || item.reportType === kind) &&
            (!activeStatus || item.status === activeStatus) &&
            (!start || item.submittedAt.slice(0, 10) >= start) &&
            (!end || item.submittedAt.slice(0, 10) <= end),
        );
        render(items);
      }
      function openProcess(item) {
        current = item;
        processTarget.textContent = `${item.reportNo} · ${item.targetType} ${item.targetName}`;
        processForm.reset();
        processOverlay.classList.add("show");
      }
      searchBtn.onclick = () => {
        filter();
        Luma.toast(`已查询到 ${visible.length} 条举报记录`);
      };
      resetBtn.onclick = () => {
        document
          .querySelectorAll(".admin-filter input")
          .forEach((x) => (x.value = ""));
        document
          .querySelectorAll(".admin-filter select")
          .forEach((x) => (x.selectedIndex = 0));
        activeStatus = "";
        syncStatusTabs();
        render(data);
        Luma.toast("筛选条件已重置");
      };
      document.addEventListener("click", (event) => {
        const statusTab = event.target.closest("[data-status-tab]");
        if (statusTab) {
          activeStatus = statusTab.dataset.statusTab;
          syncStatusTabs();
          filter();
        }
        const process = event.target.closest("[data-process]");
        if (process)
          openProcess(data.find((x) => x.reportNo === process.dataset.process));
        const close = event.target.closest("[data-close]");
        if (close)
          document
            .querySelector(`#${close.dataset.close}`)
            .classList.remove("show");
        if (event.target.classList.contains("admin-overlay"))
          event.target.classList.remove("show");
        const menu = event.target.closest("[data-menu]");
        if (menu) Luma.toast(menu.dataset.menu);
      });
      processForm.onsubmit = (event) => {
        event.preventDefault();
        current.status = "resolved";
        current.result =
          processAction.value === "无处置"
            ? processResult.value
            : processAction.value;
        current.record = {
          action: processAction.value,
          reason: processReason.value.trim(),
          result: processResult.value,
          operator: "后台管理员",
          time: "2026-08-04 12:45",
        };
        processOverlay.classList.remove("show");
        filter();
        Luma.toast("举报处理已提交");
      };
      render(data);
      window.parent.postMessage(
        { type: "luma-page", file: "admin-report-handling.html" },
        "*",
      );
      Luma.registerStates({
        正常列表: () => render(data),
        待处理举报: () => render(data.filter((x) => x.status === "pending")),
        处理举报: () => openProcess(data[0]),
        无查询结果: () => render([]),
      });
    </script>
  </body>
</html>
