<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>举报详情 · Luma Live 管理后台</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <script src="../../../assets/admin-tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/admin.css?v=20260827-report-v2" />
    <style>
      .admin-report-inline-id{white-space:nowrap;overflow-wrap:normal!important}
      .admin-detail-item .admin-report-inline-id .admin-hover-tip{display:inline;margin:0;color:inherit;font-size:inherit}
      .report-description-list{margin-top:18px}
      .report-description-value-wide{grid-column:2/-1;align-items:flex-start}
      .report-notice{padding:14px;border:1px solid var(--admin-border);border-radius:var(--admin-radius-sm);background:var(--admin-bg)}
      .report-notice b{display:block;font-size:var(--admin-font-sm);line-height:1.6}
      .report-process-modal .admin-modal-body{max-height:70vh;overflow:auto}
      .report-process-form .admin-form-row{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;gap:12px}
      .report-process-form .admin-form-row>label:first-child{margin:0}
      .report-process-form .admin-form-row:has(textarea){align-items:start}
      .report-process-form .admin-form-row:has(textarea)>label:first-child{margin-top:9px}
    </style>
    <script src="../../../assets/common.js?v=20260821-report-menu-v1"></script>
    <script src="../../../assets/mock.js?v=20260811-guild-currency-v1"></script>
    <script src="../../../assets/admin-mock.js?v=20260827-report-v2"></script>
  </head>
  <body>
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="admin-brand"><span class="admin-brand-mark">L</span><span>Luma 管理后台</span></div>
        <nav class="admin-nav">
          <a class="admin-nav-item" href="../user/admin-user-list.html"><span>用户管理</span><span>›</span></a>
          <button class="admin-nav-item active"><span>主播管理</span><span>⌄</span></button>
          <div class="admin-nav-submenu">
            <a class="admin-nav-sub" href="../host/admin-host-review.html">主播审核</a>
            <a class="admin-nav-sub" href="../host/admin-host-list.html">主播列表</a>
            <a class="admin-nav-sub" href="../host/admin-live-management.html">直播场次</a>
            <a class="admin-nav-sub" href="../host/admin-inspection-schedule.html">巡房排班</a>
            <a class="admin-nav-sub" href="admin-content-audit.html">内容审核</a>
            <a class="admin-nav-sub active" href="admin-report-handling.html">举报处理</a>
          </div>
          <a class="admin-nav-item" href="../guild/admin-guild-list.html"><span>公会管理</span><span>›</span></a>
          <a class="admin-nav-item" href="../gifts/admin-gift-list.html"><span>礼物道具</span><span>›</span></a>
          <a class="admin-nav-item" href="../operations/admin-placement-config.html"><span>运营配置</span><span>›</span></a>
          <a class="admin-nav-item" href="../finance/admin-settlement-record.html"><span>财务分成</span><span>›</span></a>
          <button class="admin-nav-item" data-menu="数据分析"><span>数据分析</span><span>›</span></button>
          <button class="admin-nav-item" data-menu="系统配置"><span>系统配置</span><span>›</span></button>
        </nav>
        <div class="admin-sidebar-foot">Luma Live 管理后台</div>
      </aside>
      <div class="admin-main">
        <header class="admin-topbar">
          <div class="admin-breadcrumb"><strong>举报详情</strong></div>
          <div class="admin-account"><span class="admin-account-avatar">管</span><span>后台管理员</span><span>⌄</span></div>
        </header>
        <main class="admin-content">
          <a class="admin-back-link" id="backLink"></a>
          <section class="admin-panel admin-profile-panel">
            <div class="admin-profile-summary">
              <span class="admin-avatar" id="avatar"></span>
              <div><h2 id="name"></h2><div class="admin-profile-meta"><span id="subjectId"></span><span id="targetStatus"></span><span id="workStatus"></span></div></div>
              <div class="admin-profile-summary-actions" id="actions"></div>
            </div>
            <div class="admin-description-list report-description-list" id="detailPanel"></div>
          </section>
        </main>
      </div>
    </div>

    <div class="admin-overlay" id="processOverlay">
      <section class="admin-modal wide report-process-modal">
        <div class="admin-modal-head"><h2>处理举报</h2><button class="admin-icon-btn" type="button" data-close="processOverlay">×</button></div>
        <form class="report-process-form" id="processForm">
          <div class="admin-modal-body">
            <div class="admin-form-row"><label for="processAction">处置类型</label><select class="admin-select" id="processAction" required><option value="">请选择</option></select></div>
            <div class="admin-form-row admin-optional"><label for="processReason">处置原因</label><textarea class="admin-textarea" id="processReason"></textarea></div>
            <div class="admin-form-row"><label>通知举报人</label><div class="report-notice"><b id="reporterNoticePreview">-</b></div></div>
            <div class="admin-form-row"><label id="targetNoticeLabel">通知主播</label><div class="report-notice"><b id="targetNoticePreview">-</b></div></div>
          </div>
          <div class="admin-modal-foot"><button class="admin-btn secondary" type="button" data-close="processOverlay">取消</button><button class="admin-btn" type="submit">确认</button></div>
        </form>
      </section>
    </div>

    <script>
      const mock = window.LUMA_ADMIN_MOCK;
      const params = new URLSearchParams(location.search);
      const scope = params.get("scope") || "live";
      const item = mock.reports.find((report) => report.reportNo === params.get("id")) || mock.reports.find((report) => report.violationScope === scope) || mock.reports[0];
      const isAccount = item.violationScope === "account";
      const session = isAccount ? null : mock.liveSessions.find((entry) => entry.sessionId === item.targetId);
      const liveSession = isAccount && item.accountRole === "主播" ? mock.liveSessions.find((entry) => entry.hostId === item.targetId && entry.status === "live") : null;
      const permission = mock.livePermissions.find((entry) => entry.hostId === (isAccount ? item.targetId : item.hostId));
      const statusText = { pending: "待处理", resolved: "已处理", invalid: "已作废" };
      const statusClass = { pending: "pending", resolved: "success", invalid: "offline" };
      const backLink = document.querySelector("#backLink");
      const avatarEl = document.querySelector("#avatar");
      const nameEl = document.querySelector("#name");
      const subjectIdEl = document.querySelector("#subjectId");
      const targetStatusEl = document.querySelector("#targetStatus");
      const workStatusEl = document.querySelector("#workStatus");
      const actionsEl = document.querySelector("#actions");
      const detailPanelEl = document.querySelector("#detailPanel");
      const processOverlay = document.querySelector("#processOverlay");
      const processForm = document.querySelector("#processForm");
      const processAction = document.querySelector("#processAction");
      const processReason = document.querySelector("#processReason");
      const reporterNoticePreview = document.querySelector("#reporterNoticePreview");
      const targetNoticeLabel = document.querySelector("#targetNoticeLabel");
      const targetNoticePreview = document.querySelector("#targetNoticePreview");

      function isSessionLive() { return Boolean(session && session.status === "live"); }
      function targetStatus() { return isAccount ? item.accountStatus : isSessionLive() ? "直播中" : "已结束"; }
      function syncInvalidStatus() {
        if (isAccount || item.status !== "pending" || isSessionLive()) return false;
        item.status = "invalid";
        item.result = "--";
        item.invalidReason = "直播场次已结束，工单自动作废";
        item.invalidatedAt = session && session.endedAt !== "-" ? session.endedAt : "--";
        item.record = null;
        return true;
      }
      function displayValue(value) { return value === null || value === undefined || value === "" ? "--" : value; }
      function descriptionItem(label, value) { return `<div class="admin-description-label">${label}</div><div class="admin-description-value">${displayValue(value)}</div>`; }
      function descriptionWide(label, value) { return `<div class="admin-description-label">${label}</div><div class="admin-description-value report-description-value-wide">${displayValue(value)}</div>`; }

      function renderRecordRows() {
        if (!item.record) return `${item.status === "invalid" ? descriptionItem("作废原因", item.invalidReason) + descriptionItem("作废时间", item.invalidatedAt) : ""}${descriptionWide("处理结果", "--")}`;
        const record = item.record;
        const action = isAccount && record.action.includes("封禁") ? "封禁" : record.action;
        return `${descriptionItem("处置类型", action)}${descriptionItem("处理人", record.operator)}${descriptionWide("处理时间", record.time)}${descriptionWide("处置原因", record.reason)}`;
      }

      function render() {
        backLink.href = isAccount ? "admin-account-violation.html" : "admin-report-handling.html";
        backLink.textContent = `‹ 返回${isAccount ? "账号违规" : "直播间违规"}`;
        avatarEl.textContent = item.hostInitials;
        nameEl.textContent = isAccount ? item.targetName : item.hostName;
        subjectIdEl.innerHTML = Luma.id(isAccount ? item.targetId : item.hostId, isAccount ? "被举报账号ID" : "主播ID");
        const currentTargetStatus = targetStatus();
        targetStatusEl.className = `admin-status ${isAccount ? (currentTargetStatus.includes("封禁") ? "banned" : "normal") : (isSessionLive() ? "success" : "muted")}`;
        targetStatusEl.textContent = currentTargetStatus;
        workStatusEl.className = `admin-status ${statusClass[item.status]}`;
        workStatusEl.textContent = statusText[item.status];
        actionsEl.innerHTML = item.status === "pending" && (isAccount || isSessionLive()) ? '<button class="admin-btn" id="processBtn">处理工单</button>' : "";
        const processBtn = document.querySelector("#processBtn");
        if (processBtn) processBtn.onclick = openProcess;
        const reporter = `${item.reporterName}（${item.reporterId}）`;
        const workRows = `${descriptionItem("举报单号", item.reportNo)}${descriptionItem("举报类型", item.reportType)}${descriptionItem("提交时间", item.submittedAt)}${descriptionItem("举报人", reporter)}`;
        const targetRows = isAccount
          ? item.accountRole === "主播" ? `${descriptionItem("当前直播", liveSession ? `直播中（${liveSession.sessionId}）` : "未直播")}${descriptionItem("直播权限", permission && permission.platformPermission === "enabled" ? "已开通" : "已关闭")}` : ""
          : `${descriptionItem("直播场次ID", item.targetId)}${descriptionItem("开播时间", session && session.startedAt)}${descriptionWide("结束时间", session && session.endedAt)}`;
        const evidence = item.evidence.length
          ? `<div class="admin-document-gallery">${item.evidence.map((file) => `<button class="admin-document-card" type="button" data-file="${file}" title="查看 ${file}"><span class="admin-document-thumb">举报证据</span><span class="admin-document-name">${file}</span></button>`).join("")}</div>`
          : "--";
        detailPanelEl.innerHTML = `${workRows}${targetRows}${descriptionWide("举报说明", item.description)}<div class="admin-description-label">举报证据</div><div class="admin-description-value materials">${evidence}</div>${renderRecordRows()}`;
      }

      function actionOptions() {
        if (isAccount) return [["none", "不处置"], ["ban", "封禁"]];
        return [["none", "不处置"], ["warning", "警告"], ["close", "强制关播"], ["permission", "关闭直播权限"]];
      }

      function updateActions() {
        const options = actionOptions();
        processAction.innerHTML = '<option value="">请选择</option>' + options.map(([value, label]) => `<option value="${value}">${label}</option>`).join("");
        updatePreview();
      }

      function previewFor(action) {
        if (action === "none") return { execution: isAccount ? "账号状态保持不变" : "直播场次状态保持不变", reporter: isAccount ? "举报账号暂未发现可处置的违规，感谢您的反馈" : "举报内容暂未发现可处置的违规，感谢您的反馈", target: "不发送" };
        const commonReporter = "举报成立，平台已依规处理";
        const map = {
          warning: { execution: "直播继续，已向主播发送警告", reporter: commonReporter, target: "直播间存在违规，请及时调整" },
          close: { execution: "当前直播场次已强制结束", reporter: commonReporter, target: "直播间存在违规，平台已关闭直播间" },
          permission: { execution: "当前直播已结束，主播直播权限已关闭", reporter: commonReporter, target: "直播间严重违规，平台已关闭您的直播权限" },
          ban: { execution: liveSession ? "账号已封禁并强制下线，当前直播已结束" : "账号已封禁并禁止登录", reporter: commonReporter, target: "登录时提示账号已封禁" },
        };
        return map[action] || { execution: "请先选择处置类型", reporter: "-", target: "-" };
      }

      function updatePreview() {
        const action = processAction.value;
        targetNoticeLabel.textContent = isAccount ? "通知被举报人" : "通知主播";
        const preview = previewFor(action);
        reporterNoticePreview.textContent = preview.reporter;
        targetNoticePreview.textContent = preview.target;
      }

      function openProcess() {
        if (syncInvalidStatus()) {
          render();
          Luma.toast("直播已结束，工单已自动作废");
          return;
        }
        if (item.status !== "pending") return;
        processForm.reset();
        updateActions();
        processOverlay.classList.add("show");
      }

      processAction.onchange = updatePreview;
      document.addEventListener("click", (event) => {
        const file = event.target.closest("[data-file]");
        if (file) Luma.toast(`查看举报证据：${file.dataset.file}`);
        const close = event.target.closest("[data-close]");
        if (close) document.querySelector(`#${close.dataset.close}`).classList.remove("show");
        if (event.target.classList.contains("admin-overlay")) event.target.classList.remove("show");
        const menu = event.target.closest("[data-menu]");
        if (menu) Luma.toast(menu.dataset.menu);
      });

      processForm.onsubmit = (event) => {
        event.preventDefault();
        if (syncInvalidStatus()) {
          processOverlay.classList.remove("show");
          render();
          return Luma.toast("直播已结束，工单已自动作废");
        }
        if (!processAction.value) return Luma.toast("请选择处置类型");
        const actionLabels = { none: "不处置", warning: "警告", close: "强制关播", permission: "关闭直播权限", ban: "封禁" };
        const preview = previewFor(processAction.value);
        const upheld = processAction.value !== "none";
        item.status = "resolved";
        item.result = actionLabels[processAction.value];
        item.record = { action: item.result, reason: processReason.value.trim(), result: upheld ? "举报成立" : "举报不成立", execution: preview.execution, reporterNotice: "已发送", targetNotice: upheld ? (isAccount ? "登录拦截页展示" : "已发送") : "不发送", operator: "后台管理员", time: "2026-08-04 13:45" };
        if (isAccount && processAction.value === "ban") {
          item.accountStatus = "已封禁";
          if (liveSession) { liveSession.status = "stopped"; liveSession.endedAt = "2026-08-04 13:45"; }
        }
        if (!isAccount && (processAction.value === "close" || processAction.value === "permission") && session) { session.status = "stopped"; session.endedAt = "2026-08-04 13:45"; }
        if (!isAccount && processAction.value === "permission" && permission) { permission.platformPermission = "disabled"; permission.locked = true; }
        processOverlay.classList.remove("show");
        render();
        Luma.toast("举报处理已提交");
      };

      syncInvalidStatus();
      render();
      window.parent.postMessage({ type: "luma-page", file: "admin-report-detail.html", query: location.search }, "*");
      Luma.registerStates({ 处理工单: openProcess });
    </script>
  </body>
</html>
