    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <script src="../../../assets/tokens.js"></script>
    <script src="../../../assets/admin-tokens.js"></script>
    <link
      rel="stylesheet"
      href="../../../assets/admin.css?v=20260821-filter-actions-v8"
    />
    <script src="../../../assets/common.js?v=20260821-report-menu-v1"></script>
    <script src="../../../assets/mock.js?v=20260811-guild-currency-v1"></script>
    <script src="../../../assets/admin-mock.js?v=20260821-report-scope-v1"></script>
  </head>
  <body>
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="admin-brand">
          <span class="admin-brand-mark">L</span><span>Luma 管理后台</span>
        </div>
        <nav class="admin-nav">
          <a class="admin-nav-item" href="../user/admin-user-list.html"
            ><span>用户管理</span><span>›</span></a
          ><button class="admin-nav-item">
            <span>主播管理</span><span>›</span>
          </button>
          <div class="admin-nav-submenu state-hide">
            <a class="admin-nav-sub" href="../host/admin-host-review.html"
              >主播审核</a
            ><a class="admin-nav-sub" href="../host/admin-host-list.html"
              >主播列表</a
            ><a class="admin-nav-sub" href="../host/admin-live-management.html"
              >直播场次</a
            ><a
              class="admin-nav-sub"
              href="../host/admin-inspection-schedule.html"
              >巡房排班</a
            ><a class="admin-nav-sub" href="admin-content-audit.html"
              >内容审核</a
            >
          </div>
          <button class="admin-nav-item" data-menu="举报处理">
            <span>举报处理</span><span>›</span></button
          ><a class="admin-nav-item" href="../guild/admin-guild-list.html"
            ><span>公会管理</span><span>›</span></a
          ><a class="admin-nav-item" href="../gifts/admin-gift-list.html"
            ><span>礼物道具</span><span>›</span></a
          ><a
            class="admin-nav-item"
            href="../operations/admin-placement-config.html"
            ><span>运营配置</span><span>›</span></a
          ><a
            class="admin-nav-item"
            href="../finance/admin-settlement-record.html"
            ><span>财务分成</span><span>›</span></a
          ><button class="admin-nav-item" data-menu="数据分析">
            <span>数据分析</span><span>›</span></button
          ><button class="admin-nav-item" data-menu="系统配置">
            <span>系统配置</span><span>›</span>
          </button>
        </nav>
        <div class="admin-sidebar-foot">Luma Live 管理后台</div>
      </aside>
      <div class="admin-main">
        <header class="admin-topbar">
          <div class="admin-breadcrumb">
            举报处理&nbsp;&nbsp;/&nbsp;&nbsp;<strong>账号违规</strong>
          </div>
          <div class="admin-account">
            <span class="admin-account-avatar">管</span><span>后台管理员</span
            ><span>⌄</span>
          </div>
        </header>
        <main class="admin-content">
          <div class="admin-page-head">
            <div><h1>账号违规</h1></div>
          </div>
          <section class="admin-panel admin-filter">
            <div class="admin-filter-grid">
              <div class="admin-field">
                <label for="accountKey">被举报账号</label
                ><input
                  class="admin-input"
                  id="accountKey"
                  placeholder="输入账号昵称或 ID"
                />
              </div>
              <div class="admin-field">
                <label for="reportType">举报类型</label
                ><select class="admin-select" id="reportType">
                  <option value="">全部类型</option>
                  <option>色情低俗</option>
                  <option>涉及宗教政治</option>
                  <option>暴恐血腥</option>
                  <option>未成年有害</option>
                  <option>其他</option>
                </select>
              </div>
              <div class="admin-field">
                <label>提交时间段</label>
                <div class="admin-range admin-date-range">
                  <input class="admin-input" id="startDate" type="date" /><span
                    >至</span
                  ><input class="admin-input" id="endDate" type="date" />
                </div>
              </div>
            </div>
            <div class="admin-filter-actions">
              <button class="admin-btn secondary" id="resetBtn">重置</button
              ><button class="admin-btn" id="searchBtn">查询</button>
            </div>
          </section>
          <section class="admin-panel admin-table-panel">
            <div class="admin-table-toolbar">
              <div class="admin-list-tabs" aria-label="处理状态">
                <button
                  class="admin-list-tab active"
                  data-status-tab="pending"
                >
                  待处理</button
                ><button class="admin-list-tab" data-status-tab="resolved">
                  已处理
                </button>
              </div>
              <span id="resultCount"></span>
            </div>
            <div class="admin-table-wrap">
              <table class="admin-table has-actions" style="min-width: 1250px">
                <colgroup>
                  <col style="width: 220px" />
                  <col style="width: 100px" />
                  <col style="width: 125px" />
                  <col style="width: 115px" />
                  <col style="width: 100px" />
                  <col style="width: 150px" />
                  <col style="width: 130px" />
                </colgroup>
                <thead>
                  <tr>
                    <th>被举报账号</th>
                    <th>账号类型</th>
                    <th>举报类型</th>
                    <th>账号状态</th>
                    <th>处理状态</th>
                    <th>提交时间</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="reportRows"></tbody>
              </table>
            </div>
            <div class="admin-pagination" id="pagination">
              <span>20 条 / 页</span
              ><button class="admin-page-btn" disabled>‹</button
              ><button class="admin-page-btn active" disabled>1</button
              ><button class="admin-page-btn" disabled>›</button>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script>
      const data = window.LUMA_ADMIN_MOCK.reports.filter(
          (item) => item.violationScope === "account",
        ),
        statusText = {
          pending: "待处理",
          resolved: "已处理",
        },
        statusClass = {
          pending: "pending",
          resolved: "success",
        };
      let visible = data,
        activeStatus = "pending";
      const rows = document.querySelector("#reportRows"),
        count = document.querySelector("#resultCount"),
        pagination = document.querySelector("#pagination");
      function render(items) {
        visible = items;
        count.textContent = `共 ${items.length} 条`;
        pagination.classList.toggle("state-hide", !items.length);
        if (!items.length) {
          rows.innerHTML =
            '<tr><td colspan="7"><div class="admin-empty"><strong>未找到账号违规记录</strong><span>请调整筛选条件后重新查询</span></div></td></tr>';
          return;
        }
        rows.innerHTML = items
          .map(
            (item) =>
              /* HTML */ `<tr>
                <td>
                  <div class="admin-user-cell">
                    <span class="admin-avatar">${item.hostInitials}</span
                    ><span class="admin-user-name"
                      ><b>${item.targetName}</b>${Luma.id(
                        item.targetId,
                        "被举报账号ID",
                      )}</span
                    >
                  </div>
                </td>
                <td>${item.accountRole}</td>
                <td>${item.reportType}</td>
                <td>
                  <span class="admin-status ${item.accountStatus.includes("封禁") ? "banned" : "normal"}"
                    >${item.accountStatus}</span
                  >
                </td>
                <td>
                  <span class="admin-status ${statusClass[item.status]}"
                    >${statusText[item.status]}</span
                  >
                </td>
                <td>${item.submittedAt}</td>
                <td>
                  <a
                    class="admin-action"
                    href="admin-report-detail.html?id=${item.reportNo}&scope=account"
                    >查看</a
                  >
                </td>
              </tr>`,
          )
          .join("");
      }
      function syncStatusTabs() {
        document
          .querySelectorAll("[data-status-tab]")
          .forEach((button) =>
            button.classList.toggle(
              "active",
              button.dataset.statusTab === activeStatus,
            ),
          );
      }
      function filter() {
        const account = accountKey.value.trim().toLowerCase(),
          kind = reportType.value,
          start = startDate.value,
          end = endDate.value;
        render(
          data.filter(
            (item) =>
              `${item.targetId} ${item.targetName}`
                .toLowerCase()
                .includes(account) &&
              (!kind || item.reportType === kind) &&
              (!activeStatus || item.status === activeStatus) &&
              (!start || item.submittedAt.slice(0, 10) >= start) &&
              (!end || item.submittedAt.slice(0, 10) <= end),
          ),
        );
      }
      searchBtn.onclick = () => {
        filter();
        Luma.toast(`已查询到 ${visible.length} 条账号违规记录`);
      };
      resetBtn.onclick = () => {
        document
          .querySelectorAll(".admin-filter input")
          .forEach((input) => (input.value = ""));
        document
          .querySelectorAll(".admin-filter select")
          .forEach((select) => (select.selectedIndex = 0));
        activeStatus = "pending";
        syncStatusTabs();
        filter();
        Luma.toast("筛选条件已重置");
      };
      document.addEventListener("click", (event) => {
        const statusTab = event.target.closest("[data-status-tab]");
        if (statusTab) {
          activeStatus = statusTab.dataset.statusTab;
          syncStatusTabs();
          filter();
        }
      });
      filter();
      window.parent.postMessage(
        { type: "luma-page", file: "admin-account-violation.html" },
        "*",
      );
      Luma.registerStates({
        待处理举报: () => {
          activeStatus = "pending";
          syncStatusTabs();
          filter();
        },
        已处理举报: () => {
          activeStatus = "resolved";
          syncStatusTabs();
          filter();
        },
        无查询结果: () => render([]),
      });
    </script>
  </body>
</html>
