<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>申请退出公会 · 我的 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <script src="../../../assets/common.js?v=20260811-guild-currency-v1"></script>
    <script src="../../../assets/mock.js?v=20260815-guild-leave-application-v1"></script>
    <style>
      .screen {
        padding-bottom: 34px;
      }
      .guild-card,
      .reason-card {
        margin: 12px 16px 0;
        padding: 14px;
        border-radius: 12px;
        background: var(--g7);
      }
      .section-title {
        margin: 0 0 12px;
        font-size: 14px;
      }
      .guild-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .guild-logo {
        width: 42px;
        height: 42px;
        flex: none;
        border-radius: 10px;
        background: var(--g6);
        color: var(--g2);
        display: grid;
        place-items: center;
        font-size: 14px;
        font-style: normal;
      }
      .guild-row b {
        min-width: 0;
        flex: 1;
        font-size: 14px;
      }
      .guild-row span {
        padding: 3px 7px;
        border-radius: 6px;
        background: var(--g6);
        color: var(--g2);
        font-size: 11px;
        white-space: nowrap;
      }
      .reason-card label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 14px;
      }
      .required {
        color: var(--danger);
        font-style: normal;
      }
      .reason-card textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 132px;
        padding: 12px;
        border: 1px solid var(--g5);
        border-radius: 8px;
        background: var(--g7);
        color: var(--g1);
        font: 14px inherit;
        line-height: 1.55;
        outline: 0;
        resize: none;
      }
      .reason-card textarea:focus {
        border-color: var(--g2);
      }
      .reason-card textarea::placeholder {
        color: var(--g4);
      }
      .submit {
        width: calc(100% - 32px);
        height: 46px;
        margin: 14px 16px;
        border: 0;
        border-radius: 8px;
        background: var(--g1);
        color: var(--g7);
        font: 600 15px inherit;
        cursor: pointer;
      }
      .submit:disabled {
        background: var(--g5);
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="nav">
        <button class="back" id="back" type="button">‹</button>申请退出公会
      </header>
      <section class="guild-card" aria-label="公会信息">
        <h2 class="section-title">公会信息</h2>
        <div class="guild-row">
          <i class="guild-logo" id="guildLogo"></i><b id="guildName"></b
          ><span>已加入</span>
        </div>
      </section>
      <section class="reason-card">
        <label for="reason">填写原因 <i class="required">*</i></label>
        <textarea id="reason" placeholder="请填写原因"></textarea>
      </section>
      <button class="submit" id="submit" type="button" disabled>
        提交申请
      </button>
    </main>
    <div class="homebar"><i></i></div>
    <script>
      const query = new URLSearchParams(location.search);
      const relation =
        window.LUMA_MOCK.guildRelationOrders.find(
          (item) => item.guildId === query.get("guild"),
        ) ||
        window.LUMA_MOCK.guildRelationOrders.find(
          (item) => item.relationStatus === "已加入",
        );
      const guild = window.LUMA_MOCK.guilds.find(
        (item) => item.id === relation.guildId,
      );
      document.querySelector("#back").onclick = () =>
        (location.href = `guild-detail.html?guild=${encodeURIComponent(guild.id)}`);
      document.querySelector("#guildLogo").textContent = guild.logo;
      document.querySelector("#guildName").textContent = guild.name;
      const reason = document.querySelector("#reason");
      const submit = document.querySelector("#submit");
      reason.addEventListener("input", () => {
        submit.disabled = !reason.value.trim();
      });
      submit.onclick = () => {
        if (!reason.value.trim()) return;
        submit.disabled = true;
        const submittedAt = "2026-08-19 09:41";
        const pendingOrder = {
          type: "退出申请单",
          status: "申请中",
          submittedAt,
          reason: reason.value.trim(),
        };
        relation.orders.push(pendingOrder);
        Luma.toast("已提交退出公会申请");
        setTimeout(
          () =>
            (location.href = `guild-detail.html?guild=${encodeURIComponent(guild.id)}&exitPending=1&submittedAt=${encodeURIComponent(submittedAt)}&reason=${encodeURIComponent(pendingOrder.reason)}`),
          350,
        );
      };
      window.parent.postMessage(
        { type: "luma-page", file: "guild-leave-application.html" },
        "*",
      );
    </script>
  </body>
</html>
