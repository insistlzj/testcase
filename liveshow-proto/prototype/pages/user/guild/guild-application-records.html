<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>我的公会 · 我的 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <script src="../../../assets/common.js?v=20260811-guild-currency-v1"></script>
    <script src="../../../assets/mock.js?v=20260815-guild-leave-application-v1"></script>
    <style>
      .screen {
        padding-bottom: 34px;
      }
      .nav a {
        position: absolute;
        left: 16px;
        color: var(--g2);
        font-size: 24px;
        line-height: 1;
        text-decoration: none;
      }
      .cards {
        display: grid;
        gap: 12px;
        padding: 12px 16px 16px;
      }
      .guild-card {
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 12px;
        background: var(--g7);
        text-align: left;
        cursor: pointer;
      }
      .guild-head {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .guild-logo {
        width: 42px;
        height: 42px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: var(--g6);
        color: var(--g2);
        font-size: 13px;
        font-weight: 600;
        font-style: normal;
      }
      .guild-copy {
        min-width: 0;
        flex: 1;
      }
      .guild-name,
      .guild-id {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .guild-name {
        font-size: 15px;
      }
      .guild-id {
        margin-top: 4px;
        color: var(--g3);
        font-size: 12px;
      }
      .status {
        padding: 3px 7px;
        border-radius: 6px;
        background: var(--g6);
        color: var(--g2);
        font-size: 11px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="nav">
        <a href="guild-management.html" aria-label="返回">‹</a>我的公会
      </header>
      <section class="cards" id="cards" aria-label="已申请公会"></section>
    </main>
    <div class="homebar"><i></i></div>
    <script>
      const cards = document.querySelector("#cards");
      function render() {
        const relations = window.LUMA_MOCK.guildRelationOrders;
        cards.innerHTML = relations
          .map((relation) => {
            const guild = window.LUMA_MOCK.guilds.find(
              (item) => item.id === relation.guildId,
            );
            return `<button class="guild-card" type="button" data-guild="${guild.id}" aria-label="查看 ${guild.name} 公会详情"><div class="guild-head"><i class="guild-logo">${guild.logo}</i><span class="guild-copy"><b class="guild-name">${guild.name}</b><span class="guild-id">ID：${guild.id}</span></span><span class="status">${relation.relationStatus}</span></div></button>`;
          })
          .join("");
        cards.querySelectorAll("[data-guild]").forEach((card) => {
          card.onclick = () =>
            (location.href = `guild-detail.html?guild=${encodeURIComponent(card.dataset.guild)}`);
        });
      }
      render();
      window.parent.postMessage(
        { type: "luma-page", file: "guild-application-records.html" },
        "*",
      );
    </script>
  </body>
</html>
