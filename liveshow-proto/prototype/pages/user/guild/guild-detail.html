<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>公会详情 · 我的 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <script src="../../../assets/common.js?v=20260811-guild-currency-v1"></script>
    <script src="../../../assets/mock.js?v=20260909-guild-materials-collapse-v1"></script>
    <style>
      .screen {
        padding-bottom: 34px;
      }
      .nav-action {
        position: absolute;
        right: 16px;
        padding: 8px 0;
        border: 0;
        background: none;
        color: var(--g2);
        font: 14px inherit;
        cursor: pointer;
      }
      .guild-card,
      .order-card {
        margin: 12px 16px 0;
        padding: 14px;
        border-radius: 12px;
        background: var(--g7);
      }
      .guild-head {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .guild-logo {
        width: 42px;
        height: 42px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: var(--g6);
        color: var(--g2);
        font-size: 13px;
        font-weight: 600;
        font-style: normal;
      }
      .guild-copy {
        min-width: 0;
        flex: 1;
      }
      .guild-copy b,
      .guild-copy span {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .guild-copy b {
        font-size: 15px;
      }
      .guild-copy span {
        margin-top: 4px;
        color: var(--g3);
        font-size: 12px;
      }
      .status {
        padding: 3px 7px;
        border-radius: 6px;
        background: var(--g6);
        color: var(--g2);
        font-size: 11px;
        white-space: nowrap;
      }
      .status.pending {
        outline: 1px solid var(--warning);
      }
      .orders {
        display: grid;
        gap: 0;
        margin: 12px 16px 0;
      }
      .timeline-item {
        position: relative;
        padding: 0 0 14px 20px;
      }
      .timeline-item:not(:last-child):before {
        content: "";
        position: absolute;
        top: 17px;
        bottom: -3px;
        left: 5px;
        width: 1px;
        background: var(--g5);
      }
      .timeline-dot {
        position: absolute;
        top: 5px;
        left: 0;
        width: 11px;
        height: 11px;
        border: 2px solid var(--g7);
        border-radius: 50%;
        background: var(--g2);
        box-shadow: 0 0 0 1px var(--g5);
      }
      .timeline-dot.pending {
        background: var(--warning);
        box-shadow: 0 0 0 1px var(--warning);
      }
      .timeline-time {
        display: block;
        margin-bottom: 7px;
        color: var(--g4);
        font-size: 11px;
      }
      .order-card {
        margin: 0;
      }
      .order-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .order-head b {
        font-size: 14px;
      }
      .detail {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--g6);
        color: var(--g3);
        font-size: 12px;
        line-height: 1.55;
      }
      .detail span:last-child {
        color: var(--g2);
        text-align: right;
      }
      .detail.reject span:last-child {
        color: var(--danger);
      }
      .application-materials {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--g6);
      }
      .application-materials summary {
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .material-list {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }
      .material {
        margin: 0;
        min-width: 0;
      }
      .material-preview {
        display: grid;
        place-items: center;
        height: 82px;
        border: 1px solid var(--g5);
        border-radius: var(--radius-sm);
        background: var(--g6);
        color: var(--g3);
        font-size: 12px;
      }
      .document-materials {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="nav">
        <button
          class="back"
          type="button"
          onclick="location.href='guild-application-records.html'"
        >
          ‹</button
        >公会详情<button class="nav-action" id="applyLeave" type="button">
          申请退出
        </button>
      </header>
      <section class="guild-card" aria-label="所选公会">
        <div class="guild-head">
          <i class="guild-logo" id="guildLogo"></i>
          <div class="guild-copy">
            <b id="guildName"></b><span id="guildId"></span>
          </div>
          <span class="status" id="relationStatus"></span>
        </div>
      </section>
      <section
        class="orders"
        id="orders"
        aria-label="加入与退出申请记录时间轴"
      ></section>
    </main>
    <div class="homebar"><i></i></div>
    <script>
      const query = new URLSearchParams(location.search);
      const relations = window.LUMA_MOCK.guildRelationOrders;
      const selectedGuildId = query.get("guild");
      const selectedGuild = window.LUMA_MOCK.guilds.find(
        (item) => item.id === selectedGuildId,
      );
      let relation = structuredClone(relations.find((item) => item.guildId === selectedGuildId) || null);
      if (!relation && selectedGuild) {
        relation = {
          guildId: selectedGuild.id,
          relationStatus: "加入审核中",
          orders: [],
        };
      }
      relation = relation || structuredClone(relations[0]);
      const pendingOrder =
        query.get("exitPending") === "1"
          ? {
              type: "退出申请单",
              status: "申请中",
              submittedAt: query.get("submittedAt"),
              reason: query.get("reason"),
            }
          : query.get("joinPending") === "1"
            ? {
                type: "加入申请单",
                status: "加入审核中",
                submittedAt: query.get("submittedAt"),
                application: {
                  name: query.get("name") || "—",
                  phone: query.get("phone") || "—",
                  documentType: query.get("documentType") || "—",
                  portrait: query.get("portrait") || "—",
                  documentFront: query.get("documentFront") || "—",
                  documentBack: query.get("documentBack") || "—",
                },
              }
            : null;
      if (
        pendingOrder &&
        pendingOrder.submittedAt &&
        !relation.orders.some(
          (order) =>
            order.status === pendingOrder.status &&
            order.type === pendingOrder.type,
        )
      ) {
        relation.orders.push(pendingOrder);
        if (pendingOrder.type === "加入申请单")
          relation.relationStatus = "加入审核中";
      }
      const initialRelation = structuredClone(relation);
      const orderTime = (value) => Number(String(value).replace(/\D/g, ""));
      const escapeHtml = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[char],
        );
      function renderRelation(relation) {
        const guild = window.LUMA_MOCK.guilds.find(
          (item) => item.id === relation.guildId,
        );
        document.querySelector("#guildLogo").textContent = guild.logo;
        document.querySelector("#guildName").textContent = guild.name;
        document.querySelector("#guildId").textContent = `ID：${guild.id}`;
        document.querySelector("#relationStatus").textContent = relation.relationStatus;
        const orderedOrders = [...relation.orders].sort(
          (first, second) =>
            orderTime(second.submittedAt) - orderTime(first.submittedAt),
        );
        document.querySelector("#orders").innerHTML = orderedOrders
          .map((order) => {
            const isPending = ["申请中", "加入审核中"].includes(order.status);
            const application = order.type === "加入申请单" ? order.application : null;
            const details = [
              ["处理时间", order.processedAt],
              ["申请", order.reason],
              ["驳回", order.rejectionReason, "reject"],
            ].filter(([, value]) => value);
            return /* HTML */ `<article class="timeline-item">
              <i
                class="timeline-dot ${isPending ? "pending" : ""}"
                aria-hidden="true"
              ></i
              ><time class="timeline-time"
                >${escapeHtml(LUMA_FORMAT.dateTime(order.submittedAt))}</time
              >
              <section class="order-card">
                <div class="order-head">
                  <b>${escapeHtml(order.type)}</b
                  ><span class="status ${isPending ? "pending" : ""}"
                    >${escapeHtml(order.status)}</span
                  >
                </div>
                ${details
                  .map(
                    ([label, value, kind]) =>
                      `<div class="detail ${kind || ""}"><span>${label}</span><span>${escapeHtml(kind ? value : LUMA_FORMAT.dateTime(value))}</span></div>`,
                  )
                  .join("")}
                ${application ? `
                  <details class="application-materials">
                    <summary>申请资料</summary>
                    <div class="material-list">
                      <div class="detail"><span>姓名</span><span>${escapeHtml(application.name)}</span></div>
                      <div class="detail"><span>电话</span><span>${escapeHtml(application.phone)}</span></div>
                      <figure class="material">
                        <div class="material-preview">本人照片</div>
                      </figure>
                      <div class="detail"><span>证件类型</span><span>${escapeHtml(application.documentType)}</span></div>
                      <div class="document-materials">
                        <figure class="material">
                          <div class="material-preview">${escapeHtml(application.documentType)} 正面</div>
                        </figure>
                        <figure class="material">
                          <div class="material-preview">${escapeHtml(application.documentType)} 反面</div>
                        </figure>
                      </div>
                    </div>
                  </details>` : ""}
              </section>
            </article>`;
          })
          .join("");
        const applyLeave = document.querySelector("#applyLeave");
        const canLeave =
          relation.relationStatus === "已加入" &&
          !orderedOrders.some(
            (order) => order.type === "退出申请单" && order.status === "申请中",
          );
        applyLeave.hidden = !canLeave;
        applyLeave.onclick = canLeave
          ? () => (location.href = `guild-leave-application.html?guild=${encodeURIComponent(guild.id)}`)
          : null;
      }
      renderRelation(initialRelation);
      window.parent.postMessage(
        { type: "luma-page", file: "guild-detail.html", query: location.search },
        "*",
      );
      const joinedRelation = relations.find((item) => item.guildId === "G10021");
      const joinedOnly = {
        ...joinedRelation,
        orders: joinedRelation.orders.filter((order) => order.type === "加入申请单"),
      };
      Luma.registerStates({
        入会申请中: () => renderRelation(relations.find((item) => item.guildId === "G10072")),
        已加入: () => renderRelation(joinedOnly),
        入会已驳回: () => renderRelation(relations.find((item) => item.guildId === "G10058")),
        退会申请中: () => renderRelation({
          ...joinedRelation,
          orders: [...joinedRelation.orders, window.LUMA_MOCK.guildDetailPendingExit],
        }),
        退会已驳回: () => renderRelation(joinedRelation),
        已退出: () => renderRelation(relations.find((item) => item.guildId === "G10036")),
      });
    </script>
  </body>
</html>
