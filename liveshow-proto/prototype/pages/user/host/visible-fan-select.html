<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>选择可见粉丝 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <script src="../../../assets/common.js?v=20260811-guild-currency-v1"></script>
    <script src="../../../assets/mock.js?v=20260811-guild-currency-v1"></script>
    <style>
      body { background: var(--g5); }
      .screen { position: relative; width: 390px; min-height: 844px; background: var(--g7); color: var(--g1); }
      .topbar { position: relative; height: 56px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--g6); }
      .topbar h1 { margin: 0; font-size: 17px; }
      .back { position: absolute; left: 12px; width: 40px; height: 40px; padding: 0; border: 0; background: none; color: var(--g2); font: 30px/1 inherit; cursor: pointer; }
      .content { padding: 14px 16px 100px; }
      .search { display: flex; align-items: center; height: 44px; padding: 0 13px; border-radius: 8px; background: var(--g6); color: var(--g3); }
      .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--g1); font: 14px inherit; }
      .section-head { margin: 20px 0 7px; display: flex; align-items: center; justify-content: space-between; }
      .section-title { margin: 0; font-size: 14px; }
      .select-all { padding: 6px 0 6px 12px; border: 0; background: none; color: var(--g2); font: 13px inherit; cursor: pointer; }
      .fan-row { width: 100%; min-height: 64px; padding: 9px 0; border: 0; border-bottom: 1px solid var(--g6); background: none; display: flex; align-items: center; text-align: left; cursor: pointer; }
      .avatar { width: 42px; height: 42px; margin-right: 11px; border-radius: 50%; background: var(--g5); color: var(--g3); display: grid; place-items: center; font-size: 13px; font-style: normal; }
      .fan-info { flex: 1; min-width: 0; }
      .fan-info b, .fan-info small { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .fan-info b { font-size: 14px; }
      .fan-info small { margin-top: 4px; color: var(--g3); font-size: 11px; }
      .check { width: 22px; height: 22px; border: 1px solid var(--g4); border-radius: 50%; display: grid; place-items: center; color: transparent; font-size: 13px; }
      .fan-row.selected .check { border-color: var(--g1); background: var(--g1); color: var(--g7); }
      .empty { padding: 72px 0; color: var(--g3); text-align: center; font-size: 13px; }
      .footer { position: absolute; right: 0; bottom: 0; left: 0; padding: 12px 16px 22px; border-top: 1px solid var(--g6); background: var(--g7); }
      .confirm { width: 100%; height: 46px; border: 0; border-radius: 8px; background: var(--g1); color: var(--g7); font: 600 15px inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="topbar">
        <button class="back" id="back" type="button" aria-label="返回">‹</button>
        <h1>选择可见粉丝</h1>
      </header>
      <section class="content">
        <label class="search"><span aria-hidden="true">⌕&nbsp;</span><input id="search" type="search" placeholder="搜索粉丝昵称" autocomplete="off" /></label>
        <div class="section-head"><h2 class="section-title">关注我的粉丝</h2><button class="select-all" id="selectAll" type="button">全选</button></div>
        <div id="fanList"></div>
      </section>
      <footer class="footer"><button class="confirm" id="confirm" type="button">确认（0）</button></footer>
    </main>
    <script>
      const visibleFanStorageKey = "luma-visible-fans";
      const allFans = LUMA_MOCK.hostFans;
      let selected = new Set(LUMA_MOCK.startLive.authorizedFans.map((fan) => fan.name));
      try {
        const saved = JSON.parse(localStorage.getItem(visibleFanStorageKey));
        if (Array.isArray(saved)) selected = new Set(saved);
      } catch (_) {}
      const validNames = new Set(allFans.map((fan) => fan.name));
      selected = new Set([...selected].filter((name) => validNames.has(name)));
      const initialSelected = new Set(selected),
        liveSource = new URLSearchParams(location.search).get("source") === "live";
      const fanList = document.querySelector("#fanList"),
        search = document.querySelector("#search"),
        selectAll = document.querySelector("#selectAll"),
        confirm = document.querySelector("#confirm");
      function render() {
        const keyword = search.value.trim().toLowerCase();
        const result = allFans.filter((fan) => fan.name.toLowerCase().includes(keyword));
        fanList.innerHTML = result.length
          ? result.map((fan) => `<button class="fan-row ${selected.has(fan.name) ? "selected" : ""}" type="button" data-fan="${fan.name}"><i class="avatar">${fan.avatar}</i><span class="fan-info"><b>${fan.name}</b><small>${fan.wealthLevel}</small></span><i class="check">✓</i></button>`).join("")
          : '<p class="empty">未找到相关粉丝</p>';
        confirm.textContent = `确认（${selected.size}）`;
        selectAll.textContent = selected.size === allFans.length ? "取消全选" : "全选";
      }
      fanList.onclick = (event) => {
        const row = event.target.closest("[data-fan]");
        if (!row) return;
        selected.has(row.dataset.fan) ? selected.delete(row.dataset.fan) : selected.add(row.dataset.fan);
        render();
      };
      search.oninput = render;
      selectAll.onclick = () => {
        selected = selected.size === allFans.length
          ? new Set()
          : new Set(allFans.map((fan) => fan.name));
        render();
      };
      function returnToSettings() {
        const file = liveSource ? "live-room-host-password.html" : "start-live-settings.html";
        const query = liveSource ? "?view=visible-scope" : "?room=password";
        try { parent.postMessage({ type: "luma-page", file, query }, "*"); } catch (_) {}
        location.href = liveSource ? "../live/" + file + query : file + query;
      }
      document.querySelector("#back").onclick = returnToSettings;
      confirm.onclick = () => {
        localStorage.setItem(visibleFanStorageKey, JSON.stringify([...selected]));
        if (liveSource)
          sessionStorage.setItem(
            "luma-live-password-removed-fans",
            JSON.stringify([...initialSelected].filter((name) => !selected.has(name))),
          );
        returnToSettings();
      };
      render();
    </script>
  </body>
</html>
