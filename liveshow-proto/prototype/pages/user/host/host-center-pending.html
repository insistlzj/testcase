<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>申请成为主播 · 我的 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <script src="../../../assets/common.js?v=20260811-guild-currency-v1"></script>
    <script src="../../../assets/mock.js"></script>
    <style>
      .screen {
        padding-bottom: 34px;
      }
      .page {
        padding: 0 16px 16px;
      }
      .benefit-banner {
        margin: 0 -16px;
        padding: 20px 18px;
        background: var(--g1);
        color: var(--g7);
      }
      .benefit-banner b {
        display: block;
        font-size: 19px;
      }
      .benefit-banner p {
        margin: 8px 0 0;
        color: var(--g5);
        font-size: 12px;
        line-height: 1.55;
      }
      .benefits {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      .benefits span {
        flex: 1;
        padding: 8px 4px;
        border: 1px solid var(--g3);
        border-radius: 8px;
        color: var(--g5);
        font-size: 11px;
        text-align: center;
      }
      .steps {
        margin-top: 16px;
        background: var(--g7);
        border-radius: 8px;
        overflow: hidden;
      }
      .step {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        min-height: 56px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--g6);
      }
      .step:last-child {
        border: 0;
      }
      .step:not(:last-child)::after {
        content: "";
        position: absolute;
        z-index: 0;
        top: 35px;
        bottom: -13px;
        left: 25px;
        width: 1px;
        background: var(--g5);
      }
      .dot {
        position: relative;
        z-index: 1;
        width: 23px;
        height: 23px;
        flex: none;
        border-radius: 50%;
        background: var(--g6);
        color: var(--g3);
        display: grid;
        place-items: center;
        font-size: 11px;
        font-style: normal;
        margin-top: 1px;
      }
      .step.done .dot {
        background: var(--g1);
        color: var(--g7);
      }
      .step.active .dot {
        border: 2px solid var(--g1);
        background: var(--g7);
        color: var(--g1);
      }
      .step.rejected .dot {
        background: var(--danger);
        color: var(--g7);
      }
      .step-copy {
        flex: 1;
        min-width: 0;
      }
      .step-copy b,
      .step-copy span {
        display: block;
      }
      .application-time {
        display: block;
        margin-top: 10px;
        color: var(--g4);
        font-size: 11px;
      }
      .review-time {
        display: block;
        margin-top: 5px;
        color: var(--g4);
        font-size: 11px;
      }
      .application-materials {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--g6);
      }
      .application-materials summary {
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .material-list {
        margin-top: 10px;
      }
      .material-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--g6);
        color: var(--g3);
        font-size: 12px;
      }
      .material-row span:last-child {
        color: var(--g2);
        text-align: right;
      }
      .material-previews {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 12px;
      }
      .material-preview {
        height: 82px;
        border: 1px solid var(--g5);
        border-radius: 6px;
        background: var(--g6);
        color: var(--g3);
        display: grid;
        place-items: center;
        font-size: 11px;
      }
      .portrait-preview {
        margin-top: 12px;
      }
      .step-copy b {
        font-size: 14px;
      }
      .step-copy span {
        margin-top: 4px;
        color: var(--g3);
        font-size: 12px;
      }
      .step-status {
        min-width: 64px;
        color: var(--g3);
        font-size: 12px;
        text-align: right;
        white-space: nowrap;
      }
      .step-action {
        height: 32px;
        padding: 0 11px;
        border: 0;
        border-radius: 7px;
        background: var(--g1);
        color: var(--g7);
        font: 12px inherit;
        white-space: nowrap;
        cursor: pointer;
      }
      .step-action.muted {
        background: var(--g6);
        color: var(--g3);
      }
      .notice {
        margin: 14px 4px 0;
        color: var(--g4);
        font-size: 12px;
        line-height: 1.55;
        text-align: center;
      }
      .apply-mask {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        align-items: end;
        background: rgba(51, 51, 51, 0.48);
      }
      .apply-mask.state-hide {
        display: none;
      }
      .apply-sheet {
        max-height: 78vh;
        padding: 18px 16px 24px;
        border-radius: 14px 14px 0 0;
        background: var(--g7);
        overflow: auto;
      }
      .apply-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .apply-head h2 {
        margin: 0;
        font-size: 17px;
      }
      .apply-close {
        width: 30px;
        height: 30px;
        border: 0;
        background: none;
        color: var(--g2);
        font: 26px/1 inherit;
      }
      .apply-form {
        display: grid;
        gap: 12px;
      }
      .apply-field label {
        display: block;
        margin-bottom: 6px;
        color: var(--g3);
        font-size: 12px;
      }
      .apply-field input,
      .apply-field select {
        width: 100%;
        height: 42px;
        padding: 0 10px;
        border: 1px solid var(--g5);
        border-radius: 7px;
        background: var(--g7);
        color: var(--g1);
        font: 14px inherit;
      }
      .apply-field input[type="file"] {
        height: auto;
        padding: 9px;
      }
      .age-note {
        padding: 9px 10px;
        border-radius: 7px;
        background: var(--g6);
        color: var(--g3);
        font-size: 12px;
      }
      .submit {
        height: 44px;
        border: 0;
        border-radius: 8px;
        background: var(--g1);
        color: var(--g7);
        font: 600 14px inherit;
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="nav">
        <button
          class="back"
          type="button"
          onclick="location.href='../profile/profile.html'"
        >
          ‹</button
        >申请成为主播
      </header>
      <section class="page">
        <section class="benefit-banner">
          <b>成为主播，开启直播权益</b>
          <p>获得开播工具、粉丝团管理和收益管理能力。</p>
          <div class="benefits">
            <span>直播互动</span><span>粉丝经营</span><span>收益管理</span>
          </div>
        </section>
        <section class="steps" id="steps"></section>
        <p class="notice" id="notice"></p>
      </section>
    </main>
    <section class="apply-mask state-hide" id="applyMask">
      <form class="apply-sheet" id="applyForm">
        <div class="apply-head">
          <h2>提交主播认证资料</h2>
          <button class="apply-close" type="button" id="applyClose">×</button>
        </div>
        <div class="apply-form">
          <div class="apply-field">
            <label for="birthDate">出生日期</label
            ><input id="birthDate" type="date" required />
          </div>
          <div class="age-note">主播认证需年满 18 岁。</div>
          <div class="apply-field">
            <label for="documentType">证件类型</label
            ><select id="documentType" required>
              <option value="KTP">KTP 身份证件</option>
              <option value="驾驶证">驾驶证</option>
            </select>
          </div>
          <div class="apply-field">
            <label for="documentFront">证件正面</label
            ><input id="documentFront" type="file" accept="image/*" required />
          </div>
          <div class="apply-field">
            <label for="documentBack">证件反面</label
            ><input id="documentBack" type="file" accept="image/*" required />
          </div>
          <div class="apply-field">
            <label for="identityPhoto">本人手持证件</label
            ><input id="identityPhoto" type="file" accept="image/*" required />
          </div>
          <button class="submit" id="applySubmit" type="submit" disabled>提交审核</button>
        </div>
      </form>
    </section>
    <div class="homebar"><i></i></div>
    <script>
      const stateMap = {
        guild: {
          notice: "选择公会并提交申请资料，审核通过后成为主播。",
          steps: [
            ["申请加入", "", "action active", "去加入"],
            ["公会审核", "", "status", ""],
            ["平台审核", "", "status", ""],
            ["成为主播", "", "status", ""],
          ],
        },
        guildPending: {
          notice: "公会正在审核，审核通过后将自动进入平台审核。",
          steps: [
            ["申请加入", window.LUMA_MOCK.guildMemberships.pending.guild, "done", ""],
            ["公会审核", "审核中", "active", ""],
            ["平台审核", "", "status", ""],
            ["成为主播", "", "status", ""],
          ],
        },
        guildRejected: {
          notice: "公会已驳回申请，请查看驳回原因后重新申请。",
          steps: [
            ["申请加入", window.LUMA_MOCK.guildMemberships.rejected.guild, "done", ""],
            ["公会审核", "", "action rejected", "重新申请", window.LUMA_MOCK.guildMemberships.rejected.reviewedAt],
            ["平台审核", "", "status", ""],
            ["成为主播", "", "status", ""],
          ],
        },
        permissionPending: {
          notice: "公会审核已通过，平台正在审核主播认证资料。",
          steps: [
            ["申请加入", window.LUMA_MOCK.guildMemberships.joined.guild, "done", ""],
            ["公会审核", "", "done", "", window.LUMA_MOCK.guildMemberships.joined.joinedAt],
            ["平台审核", "审核中", "active", ""],
            ["成为主播", "", "status", ""],
          ],
        },
        platformRejected: {
          notice: "平台已驳回认证，请查看原因并修改资料后重新提交。",
          steps: [
            ["申请加入", window.LUMA_MOCK.guildMemberships.joined.guild, "done", ""],
            ["公会审核", "", "done", "", window.LUMA_MOCK.guildMemberships.joined.joinedAt],
            ["平台审核", "", "action rejected", "重新申请", "2026-07-15 11:20"],
            ["成为主播", "", "status", ""],
          ],
        },
        host: {
          notice: "主播认证已通过，可以开始直播。",
          steps: [
            ["申请加入", window.LUMA_MOCK.guildMemberships.joined.guild, "done", ""],
            ["公会审核", "", "done", "", window.LUMA_MOCK.guildMemberships.joined.joinedAt],
            ["平台审核", "", "done", "", "2026-07-15 11:20"],
            ["成为主播", "已完成", "done", ""],
          ],
        },
      };
      let current = "guild";
      const steps = document.querySelector("#steps"),
        applyMask = document.querySelector("#applyMask"),
        applyForm = document.querySelector("#applyForm"),
        birthDate = document.querySelector("#birthDate"),
        applySubmit = document.querySelector("#applySubmit");
      const application = {
        name: "Andi",
        phone: "+62 812 7310 6207",
        documentType: "KTP",
      };
      function applicationDetails() {
        const membership = current === "guildPending"
          ? window.LUMA_MOCK.guildMemberships.pending
          : current === "guildRejected"
            ? window.LUMA_MOCK.guildMemberships.rejected
            : window.LUMA_MOCK.guildMemberships.joined;
        return `<time class="application-time">申请时间 ${LUMA_FORMAT.dateTime(membership.appliedAt)}</time><details class="application-materials"><summary>申请资料</summary><div class="material-list"><div class="material-row"><span>姓名</span><span>${application.name}</span></div><div class="material-row"><span>电话</span><span>${application.phone}</span></div><div class="material-preview portrait-preview">本人照片</div><div class="material-row"><span>证件类型</span><span>${application.documentType}</span></div><div class="material-previews"><div class="material-preview">${application.documentType} 正面</div><div class="material-preview">${application.documentType} 反面</div></div></div></details>`;
      }
      function render(name) {
        if (name === "apply") name = "permissionPending";
        current = name;
        applyMask.classList.add("state-hide");
        const state = stateMap[name];
        document.querySelector("#notice").textContent = state.notice;
        steps.innerHTML = state.steps
          .map(
            (item, index) =>
              `<article class="step ${item[2]}"><i class="dot">${item[2].includes("done") ? "✓" : item[2].includes("rejected") ? "!" : index + 1}</i><div class="step-copy"><b>${item[0]}</b>${item[1] ? `<span>${item[1]}</span>` : ""}${item[4] ? `<time class="review-time">${item[2].includes("rejected") ? "驳回时间" : "通过时间"} ${LUMA_FORMAT.dateTime(item[4])}</time>` : ""}${index === 0 && current !== "guild" ? applicationDetails() : ""}</div>${item[2].includes("action") ? `<button class="step-action" type="button" data-action="${index}">${item[3]}</button>` : item[3] ? `<em class="step-status">${item[3]}</em>` : ""}</article>`,
          )
          .join("");
        steps.querySelectorAll("[data-action]").forEach(
          (button) =>
            (button.onclick = () => {
              if (current === "guild" || current === "guildRejected")
                location.href = "../guild/guild-management.html";
              else if (current === "platformRejected")
                Luma.toast("进入认证资料修改");
            }),
        );
      }
      function getAge(value) {
        const birth = new Date(`${value}T00:00:00`),
          today = new Date();
        let age = today.getFullYear() - birth.getFullYear();
        if (
          today.getMonth() < birth.getMonth() ||
          (today.getMonth() === birth.getMonth() &&
            today.getDate() < birth.getDate())
        )
          age -= 1;
        return age;
      }
      const adultDate = new Date();
      adultDate.setFullYear(adultDate.getFullYear() - 18);
      birthDate.max = adultDate.toISOString().slice(0, 10);
      function syncSubmit() {
        const complete = [...applyForm.querySelectorAll("[required]")].every(
          (field) => field.value,
        );
        applySubmit.disabled = !complete || getAge(birthDate.value) < 18;
      }
      applyForm.addEventListener("input", syncSubmit);
      applyForm.addEventListener("change", syncSubmit);
      document.querySelector("#applyClose").onclick = () =>
        applyMask.classList.add("state-hide");
      applyMask.onclick = (event) => {
        if (event.target === applyMask) applyMask.classList.add("state-hide");
      };
      applyForm.onsubmit = (event) => {
        event.preventDefault();
        const age = getAge(birthDate.value);
        if (age < 18) return Luma.toast("未满 18 岁，暂不能申请主播认证");
        applyMask.classList.add("state-hide");
        render("permissionPending");
        Luma.toast("已提交主播认证资料");
      };
      render(current);
      window.parent.postMessage(
        { type: "luma-page", file: "host-center-pending.html" },
        "*",
      );
      Luma.registerStates({
        开通状态: {
          未申请: () => render("guild"),
          公会审核中: () => render("guildPending"),
          公会通过: () => render("permissionPending"),
          公会驳回: () => render("guildRejected"),
          平台审核中: () => render("permissionPending"),
          平台通过: () => render("host"),
          平台驳回: () => render("platformRejected"),
          成为主播: () => render("host"),
        },
      });
    </script>
  </body>
</html>
