<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>粉丝团设置 · 主播中心 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <script src="../../../assets/common.js"></script>
    <script src="../../../assets/mock.js"></script>
    <style>
      body {
        background: var(--g6);
      }
      .setting-card {
        margin: 12px 16px 0;
        padding: 0 14px;
        background: var(--g7);
        border-radius: 12px;
      }
      .field {
        min-height: 64px;
        padding: 13px 0;
        border-bottom: 1px solid var(--g6);
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .field:last-child {
        border: 0;
      }
      .field label,
      .field-title {
        flex: 0 0 78px;
        color: var(--g1);
        font-size: 14px;
      }
      .text-input,
      .number-input {
        min-width: 0;
        flex: 1;
        height: 36px;
        padding: 0 8px;
        border: 1px solid var(--g5);
        border-radius: 7px;
        background: var(--g7);
        color: var(--g1);
        font: 14px inherit;
        text-align: right;
        outline: none;
      }
      .text-input:focus,
      .number-input:focus {
        border-color: var(--g2);
      }
      .number-wrap {
        min-width: 0;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .number-input {
        width: 0;
      }
      .number-wrap small {
        color: var(--g3);
        font-size: 12px;
        white-space: nowrap;
      }
      .switch {
        width: 42px;
        height: 24px;
        margin-left: auto;
        padding: 3px;
        border: 0;
        border-radius: 12px;
        background: var(--g5);
        cursor: pointer;
      }
      .switch i {
        display: block;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--g7);
        transition: transform 0.16s;
      }
      .switch.on {
        background: var(--g1);
      }
      .switch.on i {
        transform: translateX(18px);
      }
      .save {
        position: fixed;
        bottom: 26px;
        left: 16px;
        width: 358px;
        height: 44px;
        border: 0;
        border-radius: 8px;
        background: var(--g1);
        color: var(--g7);
        font: 14px inherit;
        cursor: pointer;
      }
      .save:disabled {
        background: var(--g5);
        color: var(--g3);
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="nav">
        <button
          class="back"
          type="button"
          aria-label="返回粉丝团"
          onclick="location.href='fan-club.html'"
        >
          ‹</button
        >粉丝团设置
      </header>
      <section class="setting-card">
        <div class="field">
          <label for="clubName">粉丝团名字</label
          ><input
            class="text-input"
            id="clubName"
            maxlength="20"
            autocomplete="off"
          />
        </div>
        <div class="field">
          <span class="field-title">需要关注</span
          ><button
            class="switch"
            id="followSwitch"
            type="button"
            role="switch"
            aria-checked="false"
          >
            <i></i>
          </button>
        </div>
        <div class="field">
          <label for="contribution">累计贡献</label
          ><span class="number-wrap"
            ><input
              class="number-input"
              id="contribution"
              type="number"
              min="0"
              step="1"
              inputmode="numeric"
              aria-describedby="contributionHint"
            /><small id="contributionHint">贡献值</small></span
          >
        </div>
      </section>
      <button class="save" id="save" type="button" disabled>保存</button>
    </main>
    <script>
      const settings = window.LUMA_MOCK.hostFanClubSettings,
        clubName = document.querySelector("#clubName"),
        followSwitch = document.querySelector("#followSwitch"),
        contribution = document.querySelector("#contribution"),
        save = document.querySelector("#save");
      let requiresFollow = settings.requiresFollow;
      clubName.value = settings.name;
      contribution.value = settings.minimumContribution;
      function renderFollow() {
        followSwitch.classList.toggle("on", requiresFollow);
        followSwitch.setAttribute("aria-checked", String(requiresFollow));
      }
      function validate() {
        const valid =
          clubName.value.trim().length > 0 &&
          contribution.value !== "" &&
          Number(contribution.value) >= 0;
        save.disabled = !valid;
        return valid;
      }
      renderFollow();
      validate();
      followSwitch.onclick = () => {
        requiresFollow = !requiresFollow;
        renderFollow();
      };
      clubName.oninput = validate;
      contribution.oninput = validate;
      save.onclick = () => {
        if (!validate()) return;
        Luma.toast("粉丝团设置已保存");
      };
    </script>
  </body>
</html>
