<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>房管管理 · 主播中心 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <script src="../../../assets/common.js"></script>
    <script src="../../../assets/mock.js?v=20260817-manager-v2"></script>
    <style>
      body {
        background: var(--g6);
      }
      .manager-nav {
        position: relative;
        text-align: center;
      }
      .manager-nav .back {
        position: absolute;
        left: 16px;
      }
      .manager-title {
        font-size: 16px;
      }
      .manager-add {
        position: absolute;
        right: 16px;
        border: 0;
        background: transparent;
        color: var(--g2);
        font: 14px inherit;
        cursor: pointer;
      }
      .manager-add.state-hide {
        display: none;
      }
      .manager-count {
        margin: 16px 16px 8px;
        color: var(--g3);
        font-size: 13px;
      }
      .manager-count b {
        margin-left: 4px;
        color: var(--g1);
        font-size: 14px;
      }
      .manager-card {
        background: var(--g7);
      }
      .manager-row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 72px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--g6);
      }
      .manager-row:last-child {
        border-bottom: 0;
      }
      .manager-row .avatar {
        width: 46px;
        height: 46px;
        font-size: 16px;
      }
      .manager-copy {
        min-width: 0;
        flex: 1;
      }
      .manager-copy b,
      .manager-copy span {
        display: block;
      }
      .manager-copy b {
        font-size: 16px;
        line-height: 1.3;
      }
      .manager-copy span {
        margin-top: 5px;
        color: var(--g3);
        font-size: 12px;
      }
      .manager-cancel {
        height: 32px;
        padding: 0 10px;
        border: 1px solid var(--g5);
        border-radius: 7px;
        background: var(--g7);
        color: var(--g2);
        font: 12px inherit;
        white-space: nowrap;
        cursor: pointer;
      }
      .manager-empty {
        margin: 0;
        padding: 24px 16px;
        color: var(--g3);
        font-size: 13px;
        text-align: center;
      }
      .manager-confirm {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(0, 0, 0, 0.36);
      }
      .manager-confirm.state-hide {
        display: none !important;
      }
      .manager-confirm-card {
        width: 276px;
        padding: 20px 16px 16px;
        border-radius: 8px;
        background: var(--g7);
        text-align: center;
      }
      .manager-confirm-card h2 {
        margin: 0;
        font-size: 17px;
      }
      .manager-confirm-card p {
        margin: 8px 0 18px;
        color: var(--g3);
        font-size: 13px;
        line-height: 1.5;
      }
      .manager-confirm-card footer {
        display: flex;
        gap: 10px;
      }
      .manager-confirm-card button {
        flex: 1;
        height: 38px;
        border: 0;
        border-radius: 8px;
        font: 14px inherit;
        cursor: pointer;
      }
      .manager-confirm-card [data-cancel-confirm] {
        background: var(--g6);
        color: var(--g2);
      }
      .manager-confirm-card [data-confirm-cancel] {
        background: var(--g1);
        color: var(--g7);
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="nav manager-nav">
        <button
          class="back"
          type="button"
          aria-label="返回主播中心"
          onclick="location.href='host-center.html'"
        >
          ‹</button
        ><span class="manager-title">房管</span
        ><button class="manager-add" id="addManager" type="button">添加</button>
      </header>
      <p class="manager-count">房管人数 <b id="managerCount">2/3</b></p>
      <section
        class="manager-card"
        id="managerList"
        aria-label="房管列表"
      ></section>
    </main>
    <section
      class="manager-confirm state-hide"
      id="managerConfirm"
      role="dialog"
      aria-modal="true"
      aria-labelledby="managerConfirmTitle"
    >
      <div class="manager-confirm-card">
        <h2 id="managerConfirmTitle"></h2>
        <p id="managerConfirmCopy"></p>
        <footer>
          <button type="button" data-cancel-confirm>取消</button
          ><button type="button" data-confirm-cancel>确认</button>
        </footer>
      </div>
    </section>
    <div class="homebar"><i></i></div>
    <script>
      const managerList = document.querySelector("#managerList");
      const addManager = document.querySelector("#addManager");
      const managerConfirm = document.querySelector("#managerConfirm");
      const managerConfirmTitle = document.querySelector(
        "#managerConfirmTitle",
      );
      const managerConfirmCopy = document.querySelector("#managerConfirmCopy");
      let managers = LUMA_MOCK.hostCenter.managers.map((manager) => ({
        ...manager,
      }));
      const managerCandidates = LUMA_MOCK.hostCenter.managerCandidates;
      function nextManagerCandidate() {
        return managerCandidates.find(
          (candidate) =>
            !managers.some((manager) => manager.id === candidate.id),
        );
      }
      const addId = new URLSearchParams(location.search).get("add");
      if (addId && managers.length < 3) {
        const candidate = managerCandidates.find((item) => item.id === addId);
        if (candidate && !managers.some((item) => item.id === candidate.id))
          managers.push({ ...candidate });
      }
      function renderManagers() {
        managerList.innerHTML = managers.length
          ? managers
              .map(
                (manager) =>
                  `<article class="manager-row"><i class="avatar">${manager.avatar}</i><div class="manager-copy"><b>${manager.name}</b><span>ID：${manager.id}</span></div><button class="manager-cancel" type="button" data-manager-id="${manager.id}">取消房管</button></article>`,
              )
              .join("")
          : '<p class="manager-empty">暂无房管</p>';
        addManager.classList.toggle(
          "state-hide",
          managers.length >= 3 || !nextManagerCandidate(),
        );
        document.querySelector("#managerCount").textContent =
          `${managers.length}/3`;
        managerList
          .querySelectorAll("[data-manager-id]")
          .forEach(
            (button) =>
              (button.onclick = () =>
                openManagerConfirm(
                  managers.find((item) => item.id === button.dataset.managerId),
                )),
          );
      }
      let pendingManager = null;
      let confirmRound = 0;
      function openManagerConfirm(manager) {
        pendingManager = manager;
        confirmRound = 1;
        renderManagerConfirm();
      }
      function renderManagerConfirm() {
        managerConfirmTitle.textContent =
          confirmRound === 1 ? "取消房管？" : "再次确认取消房管？";
        managerConfirmCopy.textContent =
          confirmRound === 1
            ? `取消 ${pendingManager.name} 后将失去房管权限。`
            : `确认取消 ${pendingManager.name} 的房管权限？`;
        managerConfirm.classList.remove("state-hide");
      }
      document.querySelector("[data-cancel-confirm]").onclick = () => {
        managerConfirm.classList.add("state-hide");
        pendingManager = null;
        confirmRound = 0;
      };
      document.querySelector("[data-confirm-cancel]").onclick = () => {
        if (!pendingManager) return;
        if (confirmRound === 1) {
          confirmRound = 2;
          renderManagerConfirm();
          return;
        }
        const manager = pendingManager;
        managers = managers.filter((item) => item.id !== manager.id);
        managerConfirm.classList.add("state-hide");
        pendingManager = null;
        confirmRound = 0;
        renderManagers();
        Luma.toast(`已取消 ${manager.name} 的房管`);
      };
      addManager.onclick = () => {
        location.href =
          "../home/search.html?mode=manager&return=../host/moderator-management.html";
      };
      renderManagers();
      if (addId) {
        const added = managers.find((item) => item.id === addId);
        if (added) Luma.toast(`已添加 ${added.name} 为房管`);
      }
    </script>
  </body>
</html>
