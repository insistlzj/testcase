<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>粉丝列表 · 主播中心 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <script src="../../../assets/common.js"></script>
    <script src="../../../assets/mock.js"></script>
    <style>
      .screen {
        padding-bottom: 34px;
      }
      .fan-list {
        margin-top: 12px;
        background: var(--g7);
      }
      .fan {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 72px;
        padding: 12px 16px;
        border: 0;
        border-bottom: 1px solid var(--g6);
        background: var(--g7);
        color: var(--g1);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .fan:last-child {
        border-bottom: 0;
      }
      .fan .avatar {
        width: 46px;
        height: 46px;
        font-size: 16px;
      }
      .fan-copy {
        min-width: 0;
        flex: 1;
      }
      .fan-name {
        display: block;
        font-size: 16px;
        line-height: 1.3;
      }
      .fan-tags {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 5px;
      }
      .wealth-level {
        padding: 2px 5px;
        border-radius: 5px;
        background: var(--g6);
        color: var(--g3);
        font-size: 10px;
        line-height: 1.2;
        white-space: nowrap;
      }
      .outfit {
        width: 21px;
        height: 21px;
        display: inline-grid;
        place-items: center;
        border-radius: 6px;
        background: var(--g6);
        color: var(--g2);
        font-size: 12px;
        font-style: normal;
      }
      .arrow {
        color: var(--g4);
        font-size: 22px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="nav">
        <button
          class="back"
          type="button"
          onclick="location.href='host-center.html'"
        >
          ‹</button
        >粉丝列表
      </header>
      <section class="fan-list" id="fanList" aria-label="粉丝列表"></section>
    </main>
    <div class="homebar"><i></i></div>
    <script>
      const fanList = document.querySelector("#fanList");
      const fans = window.LUMA_MOCK.hostFans;
      fanList.innerHTML = fans
        .map(
          (fan) =>
            `<button class="fan" type="button" data-name="${fan.name}" aria-label="查看 ${fan.name} 的主页"><i class="avatar">${fan.avatar}</i><span class="fan-copy"><b class="fan-name">${fan.name}</b><span class="fan-tags"><i class="wealth-level">${fan.wealthLevel}</i><i class="outfit" title="${fan.outfitName}" aria-label="${fan.outfitName}">${fan.outfitIcon}</i></span></span><i class="arrow" aria-hidden="true">›</i></button>`,
        )
        .join("");
      fanList.addEventListener("click", (event) => {
        if (!event.target.closest("[data-name]")) return;
        location.href = "../social/user-home.html";
      });
    </script>
  </body>
</html>
