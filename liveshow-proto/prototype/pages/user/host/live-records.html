<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>直播记录 · 主播中心 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <script src="../../../assets/common.js?v=20260811-guild-currency-v1"></script>
    <script src="../../../assets/mock.js?v=20260811-guild-currency-v1"></script>
    <style>
      .filter-row {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 12px 16px 8px;
      }
      .date-trigger,
      .quick-trigger {
        height: 32px;
        padding: 0 10px;
        border: 1px solid var(--g5);
        border-radius: 7px;
        background: var(--g7);
        color: var(--g2);
        font: 13px inherit;
        cursor: pointer;
      }
      .date-trigger i,
      .quick-trigger i {
        margin-left: 5px;
        color: var(--g4);
        font-style: normal;
      }
      .quick-menu {
        position: absolute;
        top: 38px;
        right: 0;
        z-index: 7;
        min-width: 92px;
        padding: 4px;
        background: var(--g7);
        border: 1px solid var(--g6);
        border-radius: 8px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      }
      .quick-menu button {
        display: block;
        width: 100%;
        height: 34px;
        padding: 0 10px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--g2);
        font: 13px inherit;
        text-align: left;
        cursor: pointer;
      }
      .quick-menu button:hover,
      .quick-menu button.selected {
        background: var(--g6);
        color: var(--g1);
      }
      .summary-metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        margin: 0 16px 12px;
        padding: 12px 0;
        border-radius: 12px;
        background: var(--g7);
      }
      .summary-metric {
        min-width: 0;
        padding: 0 12px;
        border-right: 1px solid var(--g6);
      }
      .summary-metric:last-child {
        border-right: 0;
      }
      .summary-metric span,
      .summary-metric b {
        display: block;
      }
      .summary-metric span {
        color: var(--g4);
        font-size: 11px;
        white-space: nowrap;
      }
      .summary-metric b {
        margin-top: 5px;
        color: var(--g2);
        font-size: 15px;
        line-height: 1.2;
      }
      .summary-metric:first-child b {
        color: var(--success);
      }
      .summary-metric:first-child b:before {
        content: "◆";
        margin-right: 3px;
        color: var(--g2);
      }
      .record {
        margin: 0 16px 12px;
        padding: 12px 14px;
        background: var(--g7);
        border-radius: 12px;
        cursor: pointer;
      }
      .record-summary {
        display: flex;
        gap: 10px;
        min-width: 0;
      }
      .record-cover {
        width: 84px;
        height: 84px;
        flex: none;
        border-radius: 8px;
        object-fit: cover;
        background: var(--g6);
      }
      .record-content {
        display: flex;
        min-width: 0;
        flex: 1;
        flex-direction: column;
      }
      .record-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .record-title {
        overflow: hidden;
        flex: 1;
        margin: 0;
        color: var(--g1);
        font-size: 15px;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .record-meta {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 7px;
        color: var(--g3);
        font-size: 12px;
        line-height: 16px;
      }
      .record-meta + .record-meta {
        margin-top: 5px;
        color: var(--g2);
      }
      .record-meta svg {
        width: 13px;
        height: 13px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .room-icon {
        width: 28px;
        height: 28px;
        margin-left: auto;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: var(--g6);
        color: var(--g2);
      }
      .room-icon svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .data {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--g6);
      }
      .data span,
      .data b {
        display: block;
      }
      .data span {
        color: var(--g4);
        font-size: 11px;
        white-space: nowrap;
      }
      .data b {
        margin-top: 5px;
        color: var(--g2);
        font-size: 14px;
      }
      .data .income-value {
        color: var(--success);
      }
      .data .income-value:before {
        content: "◆";
        margin-right: 3px;
        color: var(--g2);
      }
      .picker-mask {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.28);
        z-index: 8;
      }
      .picker-sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--g7);
        border-radius: 12px 12px 0 0;
      }
      .picker-head {
        height: 52px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--g6);
      }
      .picker-head button {
        border: 0;
        background: none;
        color: var(--g3);
        font: 14px inherit;
        cursor: pointer;
      }
      .picker-head button:last-child {
        color: var(--success);
        font-weight: 600;
      }
      .picker-head b {
        font-size: 16px;
      }
      .calendar {
        padding: 8px 16px 16px;
      }
      .calendar-nav {
        display: grid;
        grid-template-columns: 36px 1fr 36px;
        align-items: center;
        height: 42px;
      }
      .calendar-nav b {
        text-align: center;
        font-size: 15px;
      }
      .calendar-nav button {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 16px;
        background: transparent;
        color: var(--g2);
        font: 24px/1 inherit;
        cursor: pointer;
      }
      .calendar-week,
      .calendar-days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
      }
      .calendar-week {
        margin: 3px 0 5px;
      }
      .calendar-week span {
        color: var(--g4);
        font-size: 11px;
        line-height: 24px;
        text-align: center;
      }
      .calendar-days button,
      .calendar-days i {
        height: 36px;
        border: 0;
        border-radius: 18px;
        font: 13px inherit;
        line-height: 36px;
        text-align: center;
      }
      .calendar-days i {
        visibility: hidden;
      }
      .calendar-days button {
        background: transparent;
        color: var(--g2);
        cursor: pointer;
      }
      .calendar-days button.in-range {
        background: var(--g6);
      }
      .calendar-days button.selected {
        background: var(--g1);
        color: var(--g7);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="nav">
        <button class="back" onclick="location.href='host-center.html'">
          ‹</button
        >直播记录
      </header>
      <div class="filter-row">
        <button
          class="date-trigger"
          id="dateTrigger"
          type="button"
          aria-haspopup="dialog"
        >
          10/8/2026 ~ 17/8/2026<i>⌄</i>
        </button>
        <div>
          <button
            class="quick-trigger"
            id="quickTrigger"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            本月<i>⌄</i>
          </button>
          <div class="quick-menu state-hide" id="quickMenu" role="menu">
            <button type="button" data-quick-range="month" role="menuitem">
              本月</button
            ><button type="button" data-quick-range="week" role="menuitem">
              本周</button
            ><button
              type="button"
              data-quick-range="previousMonth"
              role="menuitem"
            >
              上月</button
            ><button type="button" data-quick-range="custom" role="menuitem">
              自定义
            </button>
          </div>
        </div>
      </div>
      <section
        class="summary-metrics"
        id="recordSummary"
        aria-label="直播记录汇总"
      ></section>
      <div id="recordList"></div>
      <div class="picker-mask state-hide" id="pickerMask">
        <section
          class="picker-sheet"
          role="dialog"
          aria-modal="true"
          aria-label="选择日期"
        >
          <header class="picker-head">
            <button type="button" id="pickerCancel">取消</button><b>选择日期</b
            ><button type="button" id="pickerConfirm">确定</button>
          </header>
          <section class="calendar" id="pickerCalendar"></section>
        </section>
      </div>
    </main>
    <script>
      const recordList = document.querySelector("#recordList");
      const roomIcons = {
        门票房:
          '<svg viewBox="0 0 24 24"><path d="M4 8h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4zM13 8v12"/></svg>',
        密码房:
          '<svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
      };
      const recordMetaIcons = {
        startedAt:
          '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M15 14v3l2 1"/></svg>',
        duration:
          '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>',
      };
      recordList.innerHTML = LUMA_MOCK.liveRecords
        .map(
          (record) =>
            /* HTML */ `<section
              class="record"
              data-date="${record.date}"
              onclick="Luma.toast('查看本场直播数据')"
            >
              <div class="record-summary">
                <img
                  class="record-cover"
                  src="../../../assets/${record.coverAsset}"
                  alt="${record.title}直播封面"
                />
                <div class="record-content">
                  <div class="record-title-row">
                    <b class="record-title">${record.title}</b>${roomIcons[
                      record.roomType
                    ]
                      ? `<i class="room-icon" title="${record.roomType}">${roomIcons[record.roomType]}</i>`
                      : ""}
                  </div>
                  <span class="record-meta" title="开播时间"
                    >${recordMetaIcons.startedAt}<span
                      >${LUMA_FORMAT.dateTime(record.startedAt)}</span
                    ></span
                  ><span class="record-meta" title="直播时长"
                    >${recordMetaIcons.duration}<span
                      >${record.duration}</span
                    ></span
                  >
                </div>
              </div>
              <div class="data">
                <div>
                  <span>本场收益</span
                  ><b class="income-value">+${record.income}</b>
                </div>
                <div><span>观众人数</span><b>${record.viewers}</b></div>
                <div><span>收礼数量</span><b>${record.gifts}</b></div>
              </div>
            </section>`,
        )
        .join("");
      const dateTrigger = document.querySelector("#dateTrigger"),
        pickerMask = document.querySelector("#pickerMask"),
        pickerCalendar = document.querySelector("#pickerCalendar"),
        recordSummary = document.querySelector("#recordSummary"),
        quickTrigger = document.querySelector("#quickTrigger"),
        quickMenu = document.querySelector("#quickMenu");
      const initialRange = { start: "2026-08-10", end: "2026-08-17" };
      let appliedRange = { ...initialRange },
        draftRange = { ...initialRange },
        calendarMonth = { year: 2026, month: 7 },
        quickRange = "month";
      const pad = (value) => String(value).padStart(2, "0");
      const dateKey = (year, month, day) =>
        `${year}-${pad(month + 1)}-${pad(day)}`;
      const parseDate = (value) => {
        const [year, month, day] = String(value).split("-").map(Number);
        return { year, month: month - 1, day };
      };
      const displayDate = (value) => LUMA_FORMAT.date(value);
      const rangeText = (range) =>
        range.end && range.end !== range.start
          ? `${displayDate(range.start)} ~ ${displayDate(range.end)}`
          : displayDate(range.start);
      const quickRangeNames = {
        month: "本月",
        week: "本周",
        previousMonth: "上月",
        custom: "自定义",
      };
      const referenceDate = [...LUMA_MOCK.liveRecords].sort((left, right) =>
        right.date.localeCompare(left.date),
      )[0].date;
      const utcDateKey = (date) =>
        dateKey(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate());
      function getQuickRange(type) {
        const { year, month, day } = parseDate(referenceDate),
          date = new Date(Date.UTC(year, month, day));
        if (type === "month")
          return {
            start: utcDateKey(new Date(Date.UTC(year, month, 1))),
            end: utcDateKey(new Date(Date.UTC(year, month + 1, 0))),
          };
        if (type === "previousMonth")
          return {
            start: utcDateKey(new Date(Date.UTC(year, month - 1, 1))),
            end: utcDateKey(new Date(Date.UTC(year, month, 0))),
          };
        const weekday = date.getUTCDay() || 7;
        return {
          start: utcDateKey(new Date(Date.UTC(year, month, day - weekday + 1))),
          end: utcDateKey(new Date(Date.UTC(year, month, day - weekday + 7))),
        };
      }
      function updateQuickRange() {
        quickTrigger.innerHTML = `${quickRangeNames[quickRange]}<i>⌄</i>`;
        quickMenu
          .querySelectorAll("[data-quick-range]")
          .forEach((button) =>
            button.classList.toggle(
              "selected",
              button.dataset.quickRange === quickRange,
            ),
          );
      }
      function renderCalendar() {
        const firstDay = new Date(
            Date.UTC(calendarMonth.year, calendarMonth.month, 1),
          ).getUTCDay(),
          daysInMonth = new Date(
            Date.UTC(calendarMonth.year, calendarMonth.month + 1, 0),
          ).getUTCDate();
        const blanks = Array.from({ length: firstDay }, () => "<i></i>").join(
          "",
        );
        const days = Array.from({ length: daysInMonth }, (_, index) => {
          const day = index + 1,
            key = dateKey(calendarMonth.year, calendarMonth.month, day),
            selected = key === draftRange.start || key === draftRange.end,
            inRange =
              draftRange.start &&
              key >= draftRange.start &&
              key <= (draftRange.end || draftRange.start);
          return `<button type="button" class="${selected ? "selected" : inRange ? "in-range" : ""}" data-date="${key}" aria-pressed="${selected}">${day}</button>`;
        }).join("");
        pickerCalendar.innerHTML = `<div class="calendar-nav"><button type="button" id="previousMonth" aria-label="上个月">‹</button><b>${calendarMonth.year}年${calendarMonth.month + 1}月</b><button type="button" id="nextMonth" aria-label="下个月">›</button></div><div class="calendar-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="calendar-days">${blanks}${days}</div>`;
        pickerCalendar.querySelector("#previousMonth").onclick = () =>
          changeMonth(-1);
        pickerCalendar.querySelector("#nextMonth").onclick = () =>
          changeMonth(1);
        pickerCalendar
          .querySelectorAll("[data-date]")
          .forEach(
            (button) =>
              (button.onclick = () => selectDate(button.dataset.date)),
          );
      }
      function changeMonth(offset) {
        calendarMonth.month += offset;
        if (calendarMonth.month < 0) {
          calendarMonth.year--;
          calendarMonth.month = 11;
        }
        if (calendarMonth.month > 11) {
          calendarMonth.year++;
          calendarMonth.month = 0;
        }
        renderCalendar();
      }
      function selectDate(value) {
        if (!draftRange.start || draftRange.end) {
          draftRange = { start: value, end: "" };
        } else if (value === draftRange.start) {
          draftRange = { start: value, end: "" };
        } else {
          draftRange =
            value > draftRange.start
              ? { start: draftRange.start, end: value }
              : { start: value, end: draftRange.start };
        }
        renderCalendar();
      }
      function parseDuration(value) {
        const match = String(value).match(/^(?:(\d+)h)?(?:(\d+)m)?$/);
        return match ? Number(match[1] || 0) * 60 + Number(match[2] || 0) : 0;
      }
      function renderSummary(range) {
        const end = range.end || range.start,
          records = LUMA_MOCK.liveRecords.filter(
            (record) => record.date >= range.start && record.date <= end,
          ),
          income = records.reduce(
            (total, record) => total + LUMA_FORMAT.parseDecimal(record.income),
            0,
          ),
          duration = records.reduce(
            (total, record) => total + parseDuration(record.duration),
            0,
          );
        recordSummary.innerHTML = `<div class="summary-metric"><span>收益</span><b>${LUMA_FORMAT.integer(income)}</b></div><div class="summary-metric"><span>总时长</span><b>${Math.floor(duration / 60)}h${duration % 60}m</b></div><div class="summary-metric"><span>直播场次</span><b>${records.length}</b></div>`;
      }
      function applyDateFilter(range) {
        const end = range.end || range.start;
        document
          .querySelectorAll(".record")
          .forEach((record) =>
            record.classList.toggle(
              "state-hide",
              record.dataset.date < range.start || record.dataset.date > end,
            ),
          );
        renderSummary(range);
        dateTrigger.innerHTML = `${rangeText(range)}<i>⌄</i>`;
      }
      function openCalendar() {
        draftRange = { ...appliedRange };
        const { year, month } = parseDate(appliedRange.start);
        calendarMonth = { year, month };
        renderCalendar();
        pickerMask.classList.remove("state-hide");
      }
      dateTrigger.onclick = openCalendar;
      quickTrigger.onclick = () => {
        const isOpen = quickMenu.classList.toggle("state-hide");
        quickTrigger.setAttribute("aria-expanded", String(!isOpen));
      };
      quickMenu.querySelectorAll("[data-quick-range]").forEach(
        (button) =>
          (button.onclick = () => {
            const type = button.dataset.quickRange;
            quickMenu.classList.add("state-hide");
            quickTrigger.setAttribute("aria-expanded", "false");
            if (type === "custom") {
              openCalendar();
              return;
            }
            quickRange = type;
            appliedRange = getQuickRange(type);
            applyDateFilter(appliedRange);
            updateQuickRange();
          }),
      );
      document.querySelector("#pickerCancel").onclick = () =>
        pickerMask.classList.add("state-hide");
      document.querySelector("#pickerConfirm").onclick = () => {
        quickRange = "custom";
        appliedRange = { ...draftRange };
        applyDateFilter(appliedRange);
        updateQuickRange();
        pickerMask.classList.add("state-hide");
      };
      pickerMask.onclick = (event) => {
        if (event.target === pickerMask) pickerMask.classList.add("state-hide");
      };
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".filter-row > div")) {
          quickMenu.classList.add("state-hide");
          quickTrigger.setAttribute("aria-expanded", "false");
        }
      });
      applyDateFilter(appliedRange);
      updateQuickRange();
    </script>
  </body>
</html>
