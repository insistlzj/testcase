<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>忘记密码 · 账号与安全 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script><script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" /><link rel="stylesheet" href="../../../assets/account-security.css" />
    <script src="../../../assets/common.js?v=20260811-guild-currency-v1"></script><script src="../../../assets/mock.js?v=20260811-guild-currency-v1"></script>
  </head>
  <body>
    <main class="screen account-page">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="nav"><button class="back" type="button" onclick="go('account-password-change.html')">‹</button>忘记密码</header>
      <form class="form-wrap" id="form">
        <p class="form-intro">使用已绑定的手机号或邮箱验证身份并重置密码。</p>
        <div class="contact-tabs"><button class="active" type="button" data-contact="phone">手机号</button><button type="button" data-contact="email">邮箱</button></div>
        <p class="contact-value" id="contactValue">+62 812 **** 8866</p>
        <label class="field"><span>验证码</span><span class="input-row"><input id="code" inputmode="numeric" maxlength="6" placeholder="输入 6 位验证码" autocomplete="one-time-code" /><button id="sendCode" type="button">获取验证码</button></span></label>
        <label class="field"><span>新密码</span><span class="input-row"><input id="password" type="password" minlength="8" placeholder="至少 8 位" autocomplete="new-password" /><button type="button" data-toggle="password">显示</button></span></label>
        <label class="field"><span>确认新密码</span><span class="input-row"><input id="confirmPassword" type="password" minlength="8" placeholder="再次输入新密码" autocomplete="new-password" /><button type="button" data-toggle="confirmPassword">显示</button></span></label>
        <button class="submit" id="submit" type="submit" disabled>重置密码</button><p class="form-error" id="error"></p>
      </form>
    </main>
    <script>
      function go(file){window.parent.postMessage({type:'luma-page',file},'*');location.href=file}
      const contacts={phone:'+62 812 **** 8866',email:'a***@gmail.com'};
      document.querySelectorAll('[data-contact]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-contact]').forEach(item=>item.classList.toggle('active',item===button));contactValue.textContent=contacts[button.dataset.contact]});
      document.querySelectorAll('[data-toggle]').forEach(button=>button.onclick=()=>{const input=document.getElementById(button.dataset.toggle);input.type=input.type==='password'?'text':'password';button.textContent=input.type==='password'?'显示':'隐藏'});
      let timer;sendCode.onclick=()=>{let left=60;sendCode.disabled=true;sendCode.textContent=left+'s';Luma.toast('验证码已发送');timer=setInterval(()=>{left-=1;sendCode.textContent=left+'s';if(!left){clearInterval(timer);sendCode.disabled=false;sendCode.textContent='重新获取'}},1000)};
      function sync(){submit.disabled=code.value.length!==6||password.value.length<8||confirmPassword.value.length<8}form.addEventListener('input',sync);
      form.onsubmit=event=>{event.preventDefault();error.textContent='';if(password.value!==confirmPassword.value){error.textContent='两次输入的新密码不一致';return}Luma.toast('密码重置成功');setTimeout(()=>go('settings.html'),500)};
      window.parent.postMessage({type:'luma-page',file:'account-password-reset.html'},'*');
    </script>
  </body>
</html>
