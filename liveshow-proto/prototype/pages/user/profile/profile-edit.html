<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>资料编辑 · 我的 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <script src="../../../assets/common.js?v=20260811-guild-currency-v1"></script>
    <script src="../../../assets/mock.js?v=20260811-guild-currency-v1"></script>
    <style>
      .screen {
        padding-bottom: 34px;
      }
      .nav .save {
        position: absolute;
        right: 16px;
        height: 30px;
        padding: 0 10px;
        border: 0;
        border-radius: 7px;
        background: var(--g1);
        color: var(--g7);
        font: 13px inherit;
        cursor: pointer;
      }
      .nav .save:disabled {
        background: var(--g5);
      }
      .cover-section {
        position: relative;
        height: 156px;
        background: var(--g5);
        background-position: center;
        background-size: cover;
        cursor: pointer;
      }
      .cover-button {
        position: absolute;
        inset: 0;
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--g3);
        font: 13px inherit;
        cursor: pointer;
      }
      .cover-button span {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 30px;
        margin-top: 14px;
        padding: 0 10px;
        border-radius: 7px;
        background: var(--g7);
        color: var(--g2);
      }
      .avatar-section {
        position: relative;
        margin-top: -41px;
        padding: 0 16px 16px;
        background: var(--g7);
        text-align: center;
      }
      .avatar-button {
        position: relative;
        width: 82px;
        height: 82px;
        margin: auto;
        padding: 0;
        border: 3px solid var(--g7);
        border-radius: 50%;
        background: var(--g5);
        color: var(--g3);
        font: 26px inherit;
        cursor: pointer;
      }
      .avatar-button span {
        position: absolute;
        right: -1px;
        bottom: -1px;
        width: 27px;
        height: 27px;
        border: 2px solid var(--g7);
        border-radius: 50%;
        background: var(--g1);
        color: var(--g7);
        display: grid;
        place-items: center;
        font-size: 13px;
      }
      .avatar-section p {
        margin: 9px 0 0;
        color: var(--g4);
        font-size: 12px;
      }
      .risk-modal {
        position: fixed;
        inset: 0;
        z-index: 8;
        padding: 24px;
        background: var(--overlay);
        display: grid;
        place-items: center;
      }
      .risk-modal-card {
        width: 280px;
        padding: 20px 16px 16px;
        border-radius: 8px;
        background: var(--g7);
        text-align: center;
      }
      .risk-modal-card b {
        display: block;
        font-size: 17px;
      }
      .risk-modal-card p {
        margin: 8px 0 18px;
        color: var(--g3);
        font-size: 13px;
        line-height: 1.45;
      }
      .risk-modal-card button {
        width: 100%;
        height: 40px;
        border: 0;
        border-radius: 8px;
        background: var(--g1);
        color: var(--g7);
        font: 14px inherit;
        cursor: pointer;
      }
      .form-section {
        margin-top: 12px;
        background: var(--g7);
      }
      .row {
        min-height: 58px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--g6);
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .row:last-child {
        border: 0;
      }
      .row > span {
        width: 72px;
        flex: none;
        color: var(--g3);
        font-size: 13px;
      }
      .row input,
      .row select,
      .row textarea {
        min-width: 0;
        flex: 1;
        padding: 8px 0;
        border: 0;
        background: transparent;
        color: var(--g1);
        font: 14px inherit;
        text-align: right;
        outline: 0;
      }
      .row textarea {
        min-height: 66px;
        line-height: 1.45;
        resize: none;
        text-align: right;
      }
      .row input[readonly] {
        color: var(--g4);
      }
      .signature-row {
        align-items: flex-start;
      }
      .signature-row > span {
        padding-top: 8px;
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="nav">
        <button
          class="back"
          type="button"
          onclick="window.parent.postMessage({type:'luma-page',file:'profile.html'},'*');location.href='profile.html'"
        >
          ‹</button
        >编辑资料<button class="save" id="save" type="button">保存</button>
      </header>
      <input id="coverFile" type="file" accept="image/*" hidden />
      <section class="cover-section" id="coverPreview">
        <button
          class="cover-button"
          id="coverButton"
          type="button"
          aria-label="编辑背景图"
        >
          <span>编辑背景图</span>
        </button>
      </section>
      <section class="avatar-section">
        <input id="avatarFile" type="file" accept="image/*" hidden /><button
          class="avatar-button"
          id="avatarButton"
          type="button"
          aria-label="修改头像"
        >
          <b id="avatarText">安</b><span>＋</span>
        </button>
        <p>修改头像</p>
      </section>
      <section class="form-section">
        <label class="row"
          ><span>用户 ID</span><input id="userId" readonly
        /></label>
        <label class="row"
          ><span>昵称</span><input id="nickname" maxlength="20"
        /></label>
        <label class="row signature-row"
          ><span>签名</span><textarea id="signature" maxlength="80"></textarea>
        </label>
        <label class="row"
          ><span>性别</span
          ><select id="gender">
            <option>男</option>
            <option>女</option>
            <option>不公开</option>
          </select></label
        >
        <label class="row"
          ><span>地区</span><input id="region" maxlength="30"
        /></label>
        <label class="row"
          ><span>生日</span><input id="birthday" type="date"
        /></label>
      </section>
    </main>
    <section
      class="risk-modal state-hide"
      id="riskDialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="riskDialogTitle"
    >
      <div class="risk-modal-card">
        <b id="riskDialogTitle">提示</b>
        <p>内容不合规，请重新修改。</p>
        <button type="button" id="closeRiskDialog">知道了</button>
      </div>
    </section>
    <div class="homebar"><i></i></div>
    <script>
      const profileMock = window.LUMA_MOCK.myProfile,
        riskDemo = window.LUMA_MOCK.profileEditRiskDemo,
        initialProfile = { ...profileMock };
      const avatarFile = document.querySelector("#avatarFile"),
        avatarButton = document.querySelector("#avatarButton"),
        coverFile = document.querySelector("#coverFile"),
        coverButton = document.querySelector("#coverButton"),
        coverPreview = document.querySelector("#coverPreview"),
        nickname = document.querySelector("#nickname"),
        gender = document.querySelector("#gender"),
        region = document.querySelector("#region"),
        birthday = document.querySelector("#birthday"),
        signature = document.querySelector("#signature"),
        save = document.querySelector("#save"),
        riskDialog = document.querySelector("#riskDialog"),
        closeRiskDialog = document.querySelector("#closeRiskDialog");
      let avatarChanged = false;
      function fillProfile() {
        nickname.value = profileMock.name;
        gender.value = profileMock.gender;
        region.value = profileMock.region;
        birthday.value = profileMock.birthday;
        signature.value = profileMock.signature;
        document.querySelector("#userId").value = profileMock.id;
        document.querySelector("#avatarText").textContent = profileMock.avatar;
        coverPreview.style.backgroundImage = "";
        avatarChanged = false;
        syncForm();
      }
      function syncForm() {
        save.disabled = !nickname.value.trim();
      }
      avatarButton.onclick = () => avatarFile.click();
      avatarFile.onchange = () => {
        if (!avatarFile.files?.[0]) return;
        avatarChanged = true;
        document.querySelector("#avatarText").textContent = "新";
        Luma.toast("已选择新头像");
      };
      coverButton.onclick = () => coverFile.click();
      coverFile.onchange = () => {
        const file = coverFile.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          coverPreview.style.backgroundImage = `url("${reader.result}")`;
          Luma.toast("已选择新背景图");
        };
        reader.readAsDataURL(file);
      };
      [nickname, gender, region, birthday, signature].forEach((element) =>
        element.addEventListener("input", syncForm),
      );
      function closeRiskDialogHandler() {
        riskDialog.classList.add("state-hide");
      }
      function openRiskDialog() {
        riskDialog.classList.remove("state-hide");
        closeRiskDialog.focus();
      }
      function saveDirectFields() {
        profileMock.gender = gender.value;
        profileMock.region = region.value;
        profileMock.birthday = birthday.value;
        profileMock.signature = signature.value;
      }
      function resetProfile() {
        Object.assign(profileMock, initialProfile);
        fillProfile();
        closeRiskDialogHandler();
      }
      function applyRiskDemo(value) {
        resetProfile();
        nickname.value = value;
        syncForm();
      }
      closeRiskDialog.onclick = closeRiskDialogHandler;
      riskDialog.onclick = (event) => {
        if (event.target === riskDialog) closeRiskDialogHandler();
      };
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeRiskDialogHandler();
      });
      save.onclick = () => {
        if (save.disabled) return;
        saveDirectFields();
        const changesRiskContent =
          avatarChanged || nickname.value.trim() !== profileMock.name;
        if (
          changesRiskContent &&
          nickname.value.trim() === riskDemo.nonCompliantNickname
        ) {
          openRiskDialog();
          return;
        }
        if (changesRiskContent) {
          profileMock.name = nickname.value.trim();
          if (avatarChanged)
            profileMock.avatar =
              document.querySelector("#avatarText").textContent;
          avatarChanged = false;
        }
        closeRiskDialogHandler();
        Luma.toast("资料已保存");
      };
      fillProfile();
      window.parent.postMessage(
        { type: "luma-page", file: "profile-edit.html" },
        "*",
      );
      Luma.registerStates({
        保存演示: {
          默认: resetProfile,
          内容合规: () => applyRiskDemo(riskDemo.compliantNickname),
          内容不合规: () => applyRiskDemo(riskDemo.nonCompliantNickname),
        },
      });
    </script>
  </body>
</html>
