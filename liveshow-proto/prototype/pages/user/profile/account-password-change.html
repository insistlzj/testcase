<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>修改密码 · 账号与安全 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script><script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" /><link rel="stylesheet" href="../../../assets/account-security.css" />
    <script src="../../../assets/common.js?v=20260811-guild-currency-v1"></script><script src="../../../assets/mock.js?v=20260811-guild-currency-v1"></script>
  </head>
  <body>
    <main class="screen account-page">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="nav"><button class="back" type="button" onclick="go('settings.html')">‹</button>修改密码</header>
      <form class="form-wrap" id="form">
        <p class="form-intro">验证当前密码后设置新密码。</p>
        <label class="field"><span>当前密码</span><span class="input-row"><input id="currentPassword" type="password" minlength="8" placeholder="输入当前密码" autocomplete="current-password" /><button type="button" data-toggle="currentPassword">显示</button></span></label>
        <label class="field"><span>新密码</span><span class="input-row"><input id="password" type="password" minlength="8" placeholder="至少 8 位" autocomplete="new-password" /><button type="button" data-toggle="password">显示</button></span></label>
        <label class="field"><span>确认新密码</span><span class="input-row"><input id="confirmPassword" type="password" minlength="8" placeholder="再次输入新密码" autocomplete="new-password" /><button type="button" data-toggle="confirmPassword">显示</button></span></label>
        <a class="form-link" href="account-password-reset.html">忘记当前密码</a>
        <button class="submit" id="submit" type="submit" disabled>保存</button><p class="form-error" id="error"></p>
      </form>
    </main>
    <script>
      function go(file){window.parent.postMessage({type:'luma-page',file},'*');location.href=file}
      document.querySelectorAll('[data-toggle]').forEach(button=>button.onclick=()=>{const input=document.getElementById(button.dataset.toggle);input.type=input.type==='password'?'text':'password';button.textContent=input.type==='password'?'显示':'隐藏'});
      function sync(){submit.disabled=currentPassword.value.length<8||password.value.length<8||confirmPassword.value.length<8}form.addEventListener('input',sync);
      form.onsubmit=event=>{event.preventDefault();error.textContent='';if(password.value===currentPassword.value){error.textContent='新密码不能和当前密码相同';return}if(password.value!==confirmPassword.value){error.textContent='两次输入的新密码不一致';return}Luma.toast('密码修改成功');setTimeout(()=>go('settings.html'),500)};
      window.parent.postMessage({type:'luma-page',file:'account-password-change.html'},'*');
    </script>
  </body>
</html>
