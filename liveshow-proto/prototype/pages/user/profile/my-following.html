<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>我的关注 · 我的 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <script src="../../../assets/common.js"></script>
    <script src="../../../assets/mock.js"></script>
    <style>
      .screen {
        padding-bottom: 34px;
      }
      .nav a {
        position: absolute;
        left: 16px;
        color: var(--g2);
        font-size: 24px;
        line-height: 1;
        text-decoration: none;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 38px;
        margin: 12px 16px;
        padding: 0 12px;
        border-radius: 8px;
        background: var(--g7);
        color: var(--g4);
      }
      .search svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .search input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--g1);
        font: 14px inherit;
      }
      .list {
        background: var(--g7);
      }
      .empty {
        padding: 48px 16px;
        color: var(--g4);
        text-align: center;
      }
      .host {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 13px 16px;
        border: 0;
        border-bottom: 1px solid var(--g6);
        background: var(--g7);
        color: var(--g1);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .host a {
        text-decoration: none;
      }
      .host .copy {
        color: inherit;
      }
      .host:last-child {
        border-bottom: 0;
      }
      .host-avatar {
        position: relative;
        flex: none;
      }
      .host-avatar .avatar {
        width: 50px;
        height: 50px;
        font-size: 18px;
      }
      .live-dot {
        position: absolute;
        right: 0;
        bottom: 1px;
        width: 12px;
        height: 12px;
        border: 2px solid var(--g7);
        border-radius: 50%;
        background: var(--success);
        animation: live-pulse 1.25s ease-in-out infinite;
      }
      .copy {
        min-width: 0;
        flex: 1;
      }
      .copy b,
      .copy span {
        display: block;
      }
      .copy b {
        font-size: 16px;
      }
      .copy span {
        margin-top: 5px;
        overflow: hidden;
        color: var(--g3);
        font-size: 13px;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .state {
        flex: none;
        color: var(--g4);
        font-size: 12px;
      }
      .state.live {
        color: var(--success);
      }
      @keyframes live-pulse {
        50% {
          box-shadow: 0 0 0 4px rgba(46, 139, 87, 0.18);
        }
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="nav">
        <a href="profile.html" aria-label="返回">‹</a>我的关注
      </header>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6"></circle>
          <path d="m16 16 4 4"></path>
        </svg>
        <input id="search" type="search" placeholder="搜索用户名" autocomplete="off" />
      </label>
      <section
        class="list"
        id="followingList"
        aria-label="已关注账号"
      ></section>
    </main>
    <div class="homebar"><i></i></div>
    <script>
      const followingList = document.querySelector("#followingList"),
        search = document.querySelector("#search"),
        followingHosts = [...window.LUMA_MOCK.followingHosts].sort((a, b) =>
          b.followedAt.localeCompare(a.followedAt),
        );
      function renderFollowing(keyword = "") {
        const normalized = keyword.trim().toLowerCase();
        const hosts = followingHosts.filter((host) =>
          host.name.toLowerCase().includes(normalized),
        );
        if (!hosts.length) {
          followingList.innerHTML = '<p class="empty">未找到关注用户</p>';
          return;
        }
        followingList.innerHTML = hosts.map((host) => {
          const profile = `../social/${host.isHost ? "host" : "user"}-home.html?${host.isHost ? "host" : "user"}=${encodeURIComponent(host.name.toLowerCase())}`;
          const target = host.live ? "../live/live-room.html" : profile;
          return `<div class="host"><a class="host-avatar" href="${profile}" aria-label="进入 ${host.name} 的${host.isHost ? "主播" : "用户"}主页"><i class="avatar">${host.avatar}</i>${host.live ? '<i class="live-dot" aria-label="开播中"></i>' : ""}</a><a class="copy" href="${target}"><b>${host.name}</b><span>${host.description}</span></a><a class="state ${host.live ? "live" : ""}" href="${target}">${host.live ? "直播中" : "未开播"}</a></div>`;
        })
        .join("");
      }
      search.addEventListener("input", () => renderFollowing(search.value));
      renderFollowing();
      window.parent.postMessage(
        { type: "luma-page", file: "my-following.html" },
        "*",
      );
    </script>
  </body>
</html>
