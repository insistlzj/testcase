<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>勋章 · 我的装扮 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <script src="../../../assets/common.js"></script>
    <script src="../../../assets/mock.js"></script>
    <style>
      .screen {
        padding-bottom: 34px;
      }
      .subhead {
        margin: 12px 16px;
        color: var(--g3);
        font-size: 13px;
      }
      .subhead b {
        color: var(--g1);
      }
      .items {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        padding: 0 16px;
      }
      .item {
        min-width: 0;
        padding: 11px 5px 9px;
        border: 0;
        border-radius: 10px;
        background: var(--g7);
        color: var(--g1);
        font: inherit;
        text-align: center;
        cursor: pointer;
      }
      .visual {
        width: 62px;
        height: 62px;
        margin: auto;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--g6);
        color: var(--g2);
        font-size: 29px;
      }
      .item b,
      .item small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .item b {
        margin-top: 9px;
        font-size: 12px;
      }
      .item small {
        margin-top: 4px;
        color: var(--g4);
        font-size: 10px;
      }
      .item.equipped .visual {
        background: var(--g1);
        color: var(--g7);
      }
      .item.equipped small {
        color: var(--success);
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="nav">
        <button
          class="back"
          type="button"
          onclick="location.href='my-decoration.html'"
        >
          ‹</button
        >勋章
      </header>
      <p class="subhead">已佩戴 <b id="count">0</b>/5</p>
      <section class="items" id="items" aria-label="勋章列表"></section>
    </main>
    <div class="homebar"><i></i></div>
    <script>
      const props = LUMA_MOCK.myDecorations.medals;
      const equipped = new Set(
        props.filter((item) => item.equipped).map((item) => item.id),
      );
      const items = document.querySelector("#items"),
        count = document.querySelector("#count");
      function render() {
        count.textContent = equipped.size;
        items.innerHTML = props
          .map(
            (item) =>
              `<button class="item ${equipped.has(item.id) ? "equipped" : ""}" type="button" data-id="${item.id}"><i class="visual">${item.mark}</i><b>${item.name}</b><small>${equipped.has(item.id) ? "已佩戴" : "佩戴"}</small></button>`,
          )
          .join("");
        items.querySelectorAll("button").forEach(
          (button) =>
            (button.onclick = () => {
              const id = button.dataset.id;
              if (equipped.has(id)) {
                equipped.delete(id);
                Luma.toast("已卸下勋章");
              } else if (equipped.size >= 5) {
                Luma.toast("最多佩戴 5 个勋章");
                return;
              } else {
                equipped.add(id);
                Luma.toast("已佩戴勋章");
              }
              render();
            }),
        );
      }
      render();
    </script>
  </body>
</html>
