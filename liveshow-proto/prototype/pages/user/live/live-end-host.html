<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>直播结束页（主播） · 用户主播 App · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link
      rel="stylesheet"
      href="../../../assets/common.css?v=p003-end-host-v2"
    />
    <script src="../../../assets/common.js?v=20260811-guild-currency-v1"></script>
    <script src="../../../assets/mock.js?v=20260811-guild-currency-v1"></script>
    <style>
      .ended {
        width: 390px;
        min-height: 844px;
        background: var(--g6);
        padding-bottom: 28px;
      }
      .ended-main {
        padding: 54px 16px 0;
        text-align: center;
      }
      .ended-main .avatar {
        width: 76px;
        height: 76px;
        margin: 0 auto 16px;
        font-size: 26px;
        background: var(--g5);
        color: var(--g2);
      }
      .ended-main h1 {
        margin: 0;
        font-size: 21px;
      }
      .ended-main p {
        margin: 9px 0 28px;
        color: var(--g3);
        font-size: 14px;
      }
      .ended-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        margin: 0 16px;
        padding: 18px 24px;
        background: var(--g7);
        border-radius: 8px;
      }
      .ended-stats > div {
        text-align: center;
        min-width: 0;
      }
      .ended-stats b,
      .ended-stats span {
        display: block;
      }
      .ended-stats b {
        font-size: 18px;
      }
      .ended-stats span {
        margin-top: 6px;
        color: var(--g3);
        font-size: 12px;
      }
      .ended-actions {
        display: grid;
        gap: 10px;
        margin: 24px 16px 0;
      }
      .ended-actions a {
        width: 100%;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ended-actions .sub {
        height: 44px;
        border-radius: 8px;
        color: var(--g2);
        border: 1px solid var(--g5);
        background: var(--g7);
        font: 15px inherit;
      }
    </style>
  </head>
  <body>
    <main class="ended">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <section class="ended-main">
        <i class="avatar">S</i>
        <h1>本场直播已结束</h1>
        <p>Sari，辛苦了</p>
      </section>
      <section class="ended-stats">
        <div><b>01:26:45</b><span>直播时长</span></div>
        <div><b>12.4K</b><span>观看人数</span></div>
        <div><b>3.26K</b><span>本场收益（金币）</span></div>
      </section>
      <section class="ended-actions">
        <a class="btn" href="../host/live-data.html">查看直播数据</a
        ><a class="sub" href="../host/host-center.html">返回主播中心</a>
      </section>
    </main>
  </body>
</html>
