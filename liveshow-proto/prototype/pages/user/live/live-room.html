    <style>
      .room {
        width: 390px;
        min-height: 844px;
        background: var(--g5);
        position: relative;
        overflow: hidden;
        color: var(--g1);
      }
      .room .sb {
        background: var(--g5);
      }
      .stream {
        position: absolute;
        inset: 44px 0 0;
        background: var(--g5);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--g3);
        font-size: 13px;
      }
      .stream-mark {
        width: 116px;
        height: 116px;
        border-radius: 50%;
        background: var(--g6);
        display: grid;
        place-items: center;
      }
      .stream-mark i {
        width: 60px;
        height: 60px;
        border-radius: 12px;
        background: var(--g7);
        display: grid;
        place-items: center;
        font-style: normal;
        font-size: 12px;
        color: var(--g4);
      }
      .room-top {
        position: absolute;
        top: 54px;
        left: 16px;
        right: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 2;
      }
      .host-chip {
        height: 42px;
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }
      .host-chip .avatar {
        width: 40px;
        height: 40px;
        font-size: 14px;
        border: 2px solid var(--g7);
      }
      .host-copy {
        min-width: 0;
      }
      .host-copy b {
        display: block;
        max-width: 68px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--g7);
        font-size: 16px;
      }
      .follow {
        width: 38px;
        height: 38px;
        min-height: 0;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--g1);
        color: var(--g7);
        font-size: 29px;
        line-height: 1;
        cursor: pointer;
      }
      .follow.sub {
        font-size: 18px;
      }
      .watch-chip {
        height: 42px;
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      .watch-chip .people {
        display: flex;
        padding-left: 5px;
      }
      .watch-chip .people i {
        width: 36px;
        height: 36px;
        border: 2px solid var(--g7);
        border-radius: 50%;
        background: var(--g6);
        margin-left: -10px;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-style: normal;
        color: var(--g3);
      }
      .watch-chip .people i:first-child {
        margin-left: 0;
      }
      .watch-chip b {
        height: 38px;
        padding: 0 10px;
        border-radius: 20px;
        background: var(--g1);
        color: var(--g7);
        display: grid;
        place-items: center;
        font-size: 12px;
        white-space: nowrap;
      }
      .exit {
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 50%;
        background: var(--g1);
        color: var(--g7);
        font-size: 27px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .quick {
        position: absolute;
        top: 106px;
        left: 16px;
        display: flex;
        gap: 8px;
        z-index: 2;
      }
      .quick button {
        height: 30px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: var(--g7);
        color: var(--g2);

        right: 16px;
        bottom: 78px;

      }
      .chat-body {

      .chat-meta {

        gap: 4px;

      .room-input {

        left: 0;
        right: 0;
        bottom: 0;
        height: 66px;
        padding: 10px 16px;
        background: var(--g7);

        align-items: center;
        gap: 8px;

      .room-input input {

        border: 0;
        border-radius: 10px;

      .send {

      .gift {
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 12px;
        background: var(--g1);
        color: var(--g7);
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .gift svg {
        width: 23px;
        height: 23px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;

      .gift-drawer {
        position: absolute;

        margin-bottom: 12px;

      .gift-head b {
        font-size: 16px;
      }
      .gift-head span {
        font-size: 13px;
        color: var(--g3);
      }
      .gift-list {
        display: flex;
        gap: 10px;
      }
      .gift-item {
        flex: 1;
        border: 0;
        border-radius: 10px;
        background: var(--g6);
        padding: 10px 4px;
        color: var(--g2);

        cursor: pointer;
      }
      .gift-item i {
        width: 30px;
        height: 30px;
        margin: auto auto 5px;
        border-radius: 50%;
        background: var(--g5);
        display: grid;
        place-items: center;
        font-style: normal;
      }
      .gift-item small {
        display: block;
        color: var(--g3);
        margin-top: 2px;
      }
    </style>

    <script>
      const follow = document.querySelector("#follow"),
        comment = document.querySelector("#comment"),
        send = document.querySelector("#send"),
        form = document.querySelector("#commentForm"),
        chat = document.querySelector("#chat"),
        drawer = document.querySelector("#giftDrawer"),
        gift = document.querySelector("#gift");
      follow.onclick = (e) => {
        e.stopPropagation();
        follow.textContent = "✓";
        follow.classList.add("sub");
        follow.setAttribute("aria-label", "已关注主播");
        Luma.toast("已关注 Sari");
      };
      comment.oninput = () => (send.disabled = !comment.value.trim());
      form.onsubmit = (e) => {
        e.preventDefault();
        const text = comment.value.trim();
        if (!text) return;
        const item = document.createElement("article");
        item.className = "chat-item";
        item.innerHTML =
          '<i class="avatar">安</i><div class="chat-body"><div class="chat-meta"><b>Andi</b><span class="wealth">Lv.12</span><span class="lamp">Sari 灯牌 3</span></div><p></p></div>';
        item.querySelector("p").textContent = text;
        chat.append(item);
        comment.value = "";
        send.disabled = true;
        Luma.toast("评论已发送");
      };
      gift.onclick = () => drawer.classList.toggle("state-hide");
      document.querySelectorAll("[data-gift]").forEach(
        (item) =>
          (item.onclick = () => {
            drawer.classList.add("state-hide");
            Luma.toast("已送出 " + item.dataset.gift);
          }),
      );
      Luma.registerStates({
        粉丝团状态: {
          未加入: () => {
            window.__fanClubJoined = false;
            window.Luma.setFanClubState?.(false);
          },
          已加入: () => {
            window.__fanClubJoined = true;
            window.Luma.setFanClubState?.(true);
          },
        },
        直播间角色: {
          用户: () => {
            window.__roomRole = "用户";
            window.setRoomRole?.("用户");
          },
          房管: () => {
            window.__roomRole = "房管";
            window.setRoomRole?.("房管");
          },
        },
      });
    </script>
    <script>
      var watchChip = document.querySelector(".watch-chip"),
        audienceAvatars = document.querySelectorAll(".watch-chip .people i"),
        giftsTotal = document.querySelector(".quick button"),
        entryNotice = document.querySelector(".system"),
        chatFeed = document.querySelector("#chat"),
        giftButton = document.querySelector("#gift"),
        applyChatTone = (item) => {
          const level = Number(
            (item.querySelector(".wealth")?.textContent || "0").match(
              /\d+/,
            )?.[0] || 0,
          );
          item.classList.add(
            level >= 10
              ? "level-high"
              : level >= 5
                ? "level-mid"
                : "level-base",
          );
        };
      watchChip.removeAttribute("onclick");
      audienceAvatars.forEach((avatar, index) => {
        avatar.setAttribute("role", "button");
        avatar.setAttribute("tabindex", "0");
        avatar.setAttribute("aria-label", "打开在线用户 " + (index + 1));
        const openUser = () => Luma.toast("打开在线用户 " + (index + 1));
        avatar.onclick = (e) => {
          e.stopPropagation();
          openUser();
        };
        avatar.onkeydown = (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openUser();
          }
        };
      });
      giftsTotal.innerHTML =
        '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9.5 9.5h3.8a1.8 1.8 0 0 1 0 3.6H10a2 2 0 0 0 0 4h4.5"/></svg><span>3.26K</span>';
      giftsTotal.onclick = () => Luma.toast("查看本场收到礼物");
      giftsTotal.setAttribute("aria-label", "本场收到礼物 3.26K");
      var luckyNotice = document.createElement("article");
      luckyNotice.className = "lucky-notice";
      luckyNotice.innerHTML =
        '<i class="avatar">L</i><div><div class="chat-meta"><b>Lina</b><span class="wealth">Lv.18</span><span class="lamp">Sari 灯牌 8</span></div><p>获得金币 <strong>x 100</strong></p></div>';
      giftsTotal.after(luckyNotice);
      function cycleLuckyNotice() {
        luckyNotice.classList.remove("show");
        requestAnimationFrame(() => luckyNotice.classList.add("show"));
        setTimeout(() => {
          luckyNotice.classList.remove("show");
          setTimeout(cycleLuckyNotice, 4000);
        }, 5000);
      }
      cycleLuckyNotice();
      entryNotice.innerHTML =
        '<b>Maya</b><span class="wealth">Lv.6</span><span class="lamp">Sari 灯牌 1</span><em>进入直播间</em>';
      var giftFeed = document.createElement("section");
      giftFeed.className = "gift-feed";
      giftFeed.setAttribute("aria-label", "普通礼物消息");
      giftFeed.innerHTML = /* HTML */ `<article class="gift-message">
          <i class="avatar">M</i>
          <div class="gift-copy">
            <div class="chat-meta">
              <b>Maya</b><span class="wealth">Lv.6</span
              ><span class="lamp">Sari 灯牌 1</span>
            </div>
            <small>送出 鲜花</small>
          </div>
          <i class="gift-symbol">✦</i><b class="gift-count">x 1</b>
        </article>
        <article class="gift-message">
          <i class="avatar">R</i>
          <div class="gift-copy">
            <div class="chat-meta">
              <b>Rani</b><span class="wealth">Lv.15</span
              ><span class="lamp">Sari 灯牌 5</span>
            </div>
            <small>送出 星光</small>
          </div>
          <i class="gift-symbol">☆</i><b class="gift-count">x 2</b>
        </article>`;
      entryNotice.after(giftFeed);
      var moreActions = document.createElement("button");
      moreActions.className = "more-actions";
      moreActions.type = "button";
      moreActions.setAttribute("aria-label", "打开全部功能");
      moreActions.innerHTML =
        '<svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="1.5"/><circle cx="17" cy="7" r="1.5"/><circle cx="7" cy="17" r="1.5"/><circle cx="17" cy="17" r="1.5"/></svg>';
      var allActions = document.createElement("section");
      allActions.className = "all-actions state-hide";
      allActions.setAttribute("aria-label", "全部功能");
      allActions.innerHTML = /* HTML */ `<button
          type="button"
          class="all-actions-close"
          data-close-all-actions
          aria-label="关闭全部功能"
        >
          ×</button
        ><button type="button" data-clear-screen>
          <svg viewBox="0 0 24 24" aria-hidden="true">

      .manager-cancel-confirm [data-confirm-manager] {
        background: var(--g1);
        color: var(--g7);
      }
    </style>
    <script>
      window.addEventListener("load", function () {
        if (location.pathname.endsWith("live-room.html")) return;
        var room = document.querySelector(".room"),
          panel = document.querySelector("[data-manager-panel=managers]"),
          confirm = room?.querySelector(".manager-cancel-confirm");
        if (!room || !panel || !confirm) return;
        panel.querySelectorAll(".manager-list article").forEach(function (row) {
          row.querySelector("label")?.remove();
          var label = document.createElement("label"),
            input = document.createElement("input"),
            track = document.createElement("span");
          input.type = "checkbox";
          input.checked = true;
          input.setAttribute("data-manager-toggle", "");
          label.append(input, track);
          row.append(label);
        });
        var pending = null,
          round = 0;
        function openConfirm() {
          confirm.querySelector("b").textContent =
            round === 1 ? "取消房管？" : "再次确认取消房管？";
          confirm.querySelector("p").textContent =
            round === 1
              ? "取消后将失去房管权限。"
              : "确认取消该用户的房管权限？";
          confirm.classList.remove("state-hide");
        }
        panel
          .querySelectorAll("[data-manager-toggle]")
          .forEach(function (toggle) {
            toggle.onchange = function () {
              if (toggle.checked) return;
              toggle.checked = true;
              pending = toggle;
              round = 1;
              openConfirm();
            };
          });
        confirm.querySelector("[data-cancel-manager]").onclick = function () {
          confirm.classList.add("state-hide");
          pending = null;
        };
        confirm.querySelector("[data-confirm-manager]").onclick = function () {
          if (round === 1) {
            round = 2;
            openConfirm();
            return;
          }
          if (pending) pending.checked = false;
          confirm.classList.add("state-hide");
          Luma.toast("已取消房管");
          pending = null;
        };
      });
    </script>
    <style>
      .room-access-mask {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: var(--overlay);
      }
      .room-access-sheet {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        min-height: 286px;
        padding: 20px 16px 14px;
        background: var(--g7);
        border-top: 1px solid var(--g5);
      }
      .room-access-close {
        position: absolute;
        top: 10px;
        right: 14px;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--g2);
        font: 28px/1 inherit;
        cursor: pointer;
      }
      .room-access-sheet h2 {
        margin: 0 0 16px;
        font-size: 17px;
      }
      .room-access-password input {
        width: 100%;
        height: 44px;
        padding: 0 12px;
        border: 1px solid var(--g5);
        border-radius: 8px;
        background: var(--g7);
        color: var(--g1);
        font: 14px inherit;
        outline: 0;
      }
      .room-access-password p {
        margin: 10px 0 0;
        color: var(--g3);
        font-size: 13px;
      }
      .room-access-ticket-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        border-radius: 8px;
        background: var(--g6);
      }
      .room-access-ticket-item > i {
        display: grid;
        width: 38px;
        height: 38px;
        border-radius: 8px;
        background: var(--g5);
        color: var(--g2);
        place-items: center;
        font-style: normal;
      }
      .room-access-ticket-item div {
        flex: 1;
      }
      .room-access-ticket-item b,
      .room-access-ticket-item span {
        display: block;
      }
      .room-access-ticket-item span {
        margin-top: 4px;
        color: var(--g3);
        font-size: 12px;
      }
      .room-access-ticket-item strong {
        font-size: 15px;
      }
      .room-access-ticket-footer {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-top: 1px solid var(--g5);
      }
      .room-access-balance {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .room-access-balance .coin {
        color: var(--g1);
        font-size: 14px;
        font-weight: 700;
      }
      .room-access-balance button,
      .room-access-ticket-footer [data-access-buy-ticket] {
        border: 0;
        cursor: pointer;
      }
      .room-access-balance button {
        width: 34px;
        height: 30px;
        border-radius: 15px;
        background: var(--g6);
        color: var(--g1);
        font: 20px/1 inherit;
      }
      .room-access-ticket-footer [data-access-buy-ticket] {
        height: 34px;
        padding: 0 18px;
        border-radius: 17px;
        background: var(--g1);
        color: var(--g7);
        font: 13px inherit;
      }
    </style>
    <script>
      window.addEventListener("load", function () {
        var room = document.querySelector(".room");
        if (!room) return;

        var accessMask = document.createElement("section");
        accessMask.className = "room-access-mask state-hide";
        accessMask.setAttribute("role", "presentation");
        accessMask.innerHTML =
          '<section class="room-access-sheet room-access-password state-hide" data-access-sheet="password" role="dialog" aria-modal="true" aria-labelledby="passwordAccessTitle">' +
          '<button type="button" class="room-access-close" aria-label="关闭密码输入">×</button>' +
          '<h2 id="passwordAccessTitle">请填写房间密码</h2>' +
          '<input type="password" inputmode="numeric" maxlength="8" placeholder="请输入密码" aria-label="房间密码">' +
          '<p>密码请联系主播</p>' +
          '</section>' +
          '<section class="room-access-sheet room-access-ticket state-hide" data-access-sheet="ticket" role="dialog" aria-modal="true" aria-labelledby="ticketAccessTitle">' +
          '<button type="button" class="room-access-close" aria-label="关闭购买门票">×</button>' +
          '<h2 id="ticketAccessTitle">购买门票</h2>' +
          '<div class="room-access-ticket-item"><i>◆</i><div><b>Maya 的专场</b><span>入场门票 × 1</span></div><strong class="coin">10</strong></div>' +
          '<footer class="room-access-ticket-footer"><div class="room-access-balance"><span class="coin">12.580</span><button type="button" data-access-recharge aria-label="充值">+</button></div><button type="button" data-access-buy-ticket>购买</button></footer>' +
          '</section>';
        room.append(accessMask);

        function closeAccessSheet() {
          accessMask.classList.add("state-hide");
          accessMask.querySelectorAll("[data-access-sheet]").forEach(function (sheet) {
            sheet.classList.add("state-hide");
          });
        }
        function openAccessSheet(type) {
          closeAccessSheet();
          accessMask.classList.remove("state-hide");
          accessMask.querySelector('[data-access-sheet="' + type + '"]').classList.remove("state-hide");
          if (type === "password") accessMask.querySelector("input").focus();
        }

        accessMask.querySelectorAll(".room-access-close").forEach(function (button) {
          button.onclick = closeAccessSheet;
        });
        accessMask.onclick = function (event) {
          if (event.target === accessMask) closeAccessSheet();
        };
        accessMask.querySelector("[data-access-recharge]").onclick = function () {
          Luma.toast("打开充值");
        };
        accessMask.querySelector("[data-access-buy-ticket]").onclick = function () {
          closeAccessSheet();
          Luma.toast("购买门票成功");
        };
        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") closeAccessSheet();
        });

        Luma.registerStates({
          房间访问: {
            "密码房-访问受限": function () {
              openAccessSheet("password");
            },
            "门票房-访问受限": function () {
              openAccessSheet("ticket");
            },
          },
        });
      });
    </script>
  </body>
</html>
