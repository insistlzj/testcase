<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>消息 · 用户主播端 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <script src="../../../assets/common.js?v=20260811-guild-currency-v1"></script>
    <script src="../../../assets/mock.js?v=20260811-guild-currency-v1"></script>
    <style>
      .top {
        display: flex;
        gap: 20px;
        align-items: center;
        padding: 14px 16px 10px;
        background: var(--g6);
      }
      .top button {
        border: 0;
        background: none;
        font: 17px inherit;
        color: var(--g4);
        cursor: pointer;
      }
      .top button.active {
        font-size: 20px;
        font-weight: 600;
        color: var(--g1);
        border-bottom: 3px solid var(--g1);
        padding-bottom: 5px;
      }
      .contact {
        margin-left: auto !important;
        background: var(--g7) !important;
        border-radius: 8px !important;
        width: 34px;
        height: 34px;
      }
      .count {
        background: var(--g1);
        color: var(--g7);
        font-size: 10px;
        border-radius: 8px;
        padding: 1px 5px;
        vertical-align: top;
      }
      .conv {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        background: var(--g7);
        border-bottom: 1px solid var(--g6);
        cursor: pointer;
      }
      .conv .body {
        min-width: 0;
        flex: 1;
      }
      .conv b,
      .conv p {
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conv b {
        font-size: 16px;
      }
      .conv p {
        font-size: 13px;
        color: var(--g4);
        margin-top: 3px;
      }
      .time {
        font-size: 11px;
        color: var(--g4);
        align-self: flex-start;
      }
      .dot {
        display: block;
        float: right;
        background: var(--g1);
        color: var(--g7);
        border-radius: 9px;
        padding: 1px 5px;
        min-width: 18px;
        text-align: center;
        margin-top: 6px;
        font-size: 11px;
      }
      .group {
        border: 1.5px solid var(--g1);
        border-radius: 12px;
      }
      a.conv {
        color: inherit;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <div class="top">
        <button class="active" data-pane="chat">
          消息 <i class="count">5</i></button
        ><button data-pane="fans">粉丝团 <i class="count">11</i></button
        ><button class="contact" onclick="Luma.toast('打开通讯录')">♙</button>
      </div>
      <div id="chat">
        <a class="conv" href="system-notifications.html"
          ><i class="avatar">通</i>
          <div class="body"><b>系统通知</b></div>
          <time class="time">10:24</time></a
        ><a class="conv" href="interaction-notifications.html"
          ><i class="avatar">互</i>
          <div class="body"><b>互动通知</b></div>
          <time class="time">09:50<span class="dot">2</span></time></a
        >
        <div class="conv" onclick="Luma.toast('打开与 Sari 的会话')">
          <i class="avatar">S</i>
          <div class="body">
            <b>Sari <span class="tag line">直播间私信</span></b>
            <p>谢谢你的礼物，回复消息我们就是好友啦</p>
          </div>
          <time class="time">19:41<span class="dot">1</span></time>
        </div>
        <div class="conv" onclick="Luma.toast('打开与 Budi 的会话')">
          <i class="avatar">B</i>
          <div class="body">
            <b>Budi</b>
            <p>明天一起看 Maya 的专场吗？</p>
          </div>
          <time class="time">18:12</time>
        </div>
      </div>
      <div id="fans" class="state-hide">
        <div class="conv" onclick="Luma.toast('打开 Sari 的粉丝团')">
          <i class="avatar group">团</i>
          <div class="body">
            <b>Sari 的粉丝团</b>
            <p>群主：今晚 8 点专场，记得来！</p>
          </div>
          <time class="time">20:03<span class="dot">9</span></time>
        </div>
        <div class="conv" onclick="Luma.toast('打开 Maya 的粉丝团')">
          <i class="avatar group">团</i>
          <div class="body">
            <b>Maya 的粉丝团</b>
            <p>Rina: 上次的歌太好听了</p>
          </div>
          <time class="time">19:52<span class="dot">2</span></time>
        </div>
      </div>
    </main>
    <nav class="tabbar">
      <a class="tab" href="../home/live-plaza.html">⌂<br />首页</a
      ><a class="tab" href="../home/welfare-center.html">♧<br />福利</a
      ><a class="tab active" href="message-center.html">◌<br />消息</a
      ><a class="tab" href="../profile/profile.html">♙<br />我的</a>
    </nav>
    <div class="homebar"><i></i></div>
    <script>
      function pane(n) {
        document
          .querySelectorAll("[data-pane]")
          .forEach((x) => x.classList.toggle("active", x.dataset.pane === n));
        chat.classList.toggle("state-hide", n !== "chat");
        fans.classList.toggle("state-hide", n !== "fans");
      }
      document
        .querySelectorAll("[data-pane]")
        .forEach((x) => (x.onclick = () => pane(x.dataset.pane)));
      Luma.registerStates({
        消息: () => pane("chat"),
        粉丝团: () => pane("fans"),
      });
    </script>
  </body>
</html>
