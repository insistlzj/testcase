<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>主播主页 · 用户端 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <script src="../../../assets/common.js"></script>
    <script src="../../../assets/mock.js"></script>
    <style>
      .screen {
        padding-bottom: 106px;
      }
      .top {
        height: 188px;
        position: relative;
        background: var(--g5);
      }
      .top .back {
        top: 12px;
        color: var(--g2);
      }
      .cover-label {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--g3);
        font-size: 12px;
      }
      .live-entry {
        position: absolute;
        right: 16px;
        bottom: 16px;
        height: 30px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: var(--warning);
        color: var(--g1);
        font: 13px inherit;
        cursor: pointer;
      }
      .live-entry i {
        margin-right: 5px;
        font-style: normal;
        font-size: 11px;
      }
      .profile {
        position: relative;
        margin: -42px 16px 0;
        padding: 0 0 12px;
        text-align: left;
      }
      .profile-header {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .profile .avatar {
        width: 82px;
        height: 82px;
        flex: none;
        margin: -20px 0 0;
        border: 3px solid var(--g6);
        font-size: 28px;
      }
      .profile-info {
        min-width: 0;
        flex: 1;
        padding-top: 3px;
      }
      .name-line {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }
      .profile h1 {
        margin: 0;
        overflow: hidden;
        font-size: 20px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .gender-age {
        height: 21px;
        padding: 0 6px;
        border-radius: 5px;
        background: var(--g6);
        color: var(--g2);
        display: inline-flex;
        align-items: center;
        font-size: 10px;
        white-space: nowrap;
      }
      .profile p {
        margin: 0;
        color: var(--g3);
        font-size: 12px;
      }
      .profile-id {
        margin-top: 5px !important;
      }
      .identity-levels {
        display: flex;
        justify-content: flex-start;
        gap: 6px;
        margin-top: 7px;
      }
      .identity-levels span {
        height: 24px;
        padding: 0 7px;
        border-radius: 6px;
        background: var(--g6);
        color: var(--g2);
        display: inline-flex;
        align-items: center;
        font-size: 10px;
        white-space: nowrap;
      }
      .identity-levels b {
        margin-left: 3px;
        color: var(--g1);
        font-weight: 600;
      }
      .profile-description {
        margin-top: 12px !important;
        line-height: 1.45;
      }
      .stats {
        display: flex;
        margin: 0 16px;
        padding: 12px 4px;
        border-radius: 12px;
        background: var(--g7);
      }
      .stats span {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        color: var(--g3);
        font-size: 11px;
      }
      .stats span + span {
        border-left: 1px solid var(--g6);
      }
      .stats b {
        color: var(--g1);
        font-size: 16px;
      }
      .stats small {
        font-size: 11px;
      }
      .modules {
        margin: 12px 16px 0;
      }
      .module {
        min-height: 68px;
        margin-top: 10px;
        padding: 0 14px;
        background: var(--g7);
        border-radius: 12px;
        color: var(--g1);
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
      }
      .module:first-child {
        margin-top: 0;
      }
      .module-icon {
        width: 34px;
        height: 34px;
        flex: none;
        border-radius: 8px;
        background: var(--g6);
        color: var(--g2);
        display: grid;
        place-items: center;
        font-size: 16px;
        font-style: normal;
      }
      .module-copy {
        min-width: 0;
        flex: 1;
      }
      .module-copy b,
      .module-copy span {
        display: block;
      }
      .module-copy b {
        font-size: 14px;
      }
      .module-copy span {
        margin-top: 4px;
        color: var(--g3);
        font-size: 11px;
      }
      .club-level {
        padding: 3px 6px;
        border-radius: 5px;
        background: var(--g6);
        color: var(--g2);
        font-size: 10px;
        font-style: normal;
        white-space: nowrap;
      }
      .module-value {
        color: var(--g2);
        font-size: 13px;
        white-space: nowrap;
      }
      .leader-avatars {
        display: flex;
        align-items: center;
        padding-left: 5px;
      }
      .leader-avatars .avatar {
        width: 26px;
        height: 26px;
        margin-left: -5px;
        border: 2px solid var(--g7);
        font-size: 9px;
      }
      .module-arrow {
        color: var(--g4);
        font-size: 18px;
      }
      .profile-actions {
        position: fixed;
        left: 0;
        bottom: 34px;
        width: 390px;
        height: 72px;
        padding: 8px 16px;
        background: var(--g7);
        border-top: 1px solid var(--g5);
        display: flex;
        z-index: 4;
      }
      .profile-actions button {
        flex: 1;
        border: 0;
        background: transparent;
        color: var(--g2);
        font: 13px inherit;
        cursor: pointer;
      }
      .profile-actions b,
      .profile-actions span {
        display: block;
      }
      .profile-actions b {
        height: 28px;
        font-size: 21px;
        font-weight: 400;
        line-height: 25px;
      }
      .profile-actions span {
        margin-top: 2px;
      }
      .more-sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 8px 16px 16px;
        border-top: 1px solid var(--g5);
        background: var(--g7);
        z-index: 6;
      }
      .more-sheet button {
        width: 100%;
        height: 42px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--g1);
        font: 14px inherit;
        cursor: pointer;
      }
      .more-sheet button:hover {
        background: var(--g6);
      }
      .more-sheet [data-block] {
        color: var(--danger);
      }
      .more-sheet [data-close-more] {
        margin-top: 8px;
        background: var(--g6);
        color: var(--g2);
      }
      .fan-club-sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        width: 390px;
        min-height: 330px;
        box-sizing: border-box;
        padding: 22px 20px 18px;
        background: var(--g7);
        border-top: 1px solid var(--g5);
        z-index: 7;
      }
      .fan-club-sheet-close {
        position: absolute;
        top: 12px;
        right: 14px;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--g2);
        font: 28px/1 inherit;
        cursor: pointer;
      }
      .fan-club-sheet header {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding-right: 36px;
      }
      .fan-club-sheet header .avatar {
        width: 56px;
        height: 56px;
        font-size: 18px;
      }
      .fan-club-summary {
        min-width: 0;
        flex: 1;
      }
      .fan-club-sheet header b,
      .fan-club-sheet header span {
        display: inline-block;
      }
      .fan-club-sheet header b {
        margin-right: 7px;
        font-size: 17px;
      }
      .fan-club-sheet header span {
        color: var(--g3);
        font-size: 12px;
      }
      .fan-club-level {
        padding: 3px 6px;
        border-radius: 5px;
        background: var(--g6);
        color: var(--g2);
        font-size: 11px;
        font-style: normal;
      }
      .fan-club-rank {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 8px;
      }
      .fan-club-rank em {
        margin-right: 3px;
        color: var(--g3);
        font-size: 12px;
        font-style: normal;
      }
      .fan-club-rank i {
        width: 22px;
        height: 22px;
        border: 1px solid var(--g7);
        border-radius: 50%;
        background: var(--g5);
        color: var(--g2);
        display: grid;
        place-items: center;
        font-size: 9px;
        font-style: normal;
      }
      .fan-club-benefits {
        margin: 20px 0 18px;
      }
      .fan-club-benefits h2 {
        margin: 0 0 10px;
        font-size: 15px;
        text-align: center;
      }
      .fan-club-benefits > div {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .fan-club-benefits article {
        min-height: 82px;
        padding: 12px 8px;
        background: var(--g6);
        border-radius: 8px;
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .fan-club-benefits article > i {
        width: 28px;
        height: 28px;
        flex: none;
        border-radius: 8px;
        background: var(--g5);
        color: var(--g2);
        display: grid;
        place-items: center;
        font-size: 13px;
        font-style: normal;
      }
      .fan-club-benefits article span {
        min-width: 0;
      }
      .fan-club-benefits article b,
      .fan-club-benefits article small {
        display: block;
      }
      .fan-club-benefits article b {
        font-size: 13px;
      }
      .fan-club-benefits article small {
        margin-top: 5px;
        color: var(--g3);
        font-size: 11px;
        line-height: 1.3;
      }
      .fan-club-primary {
        width: 100%;
        height: 42px;
        border: 0;
        border-radius: 8px;
        background: var(--g1);
        color: var(--g7);
        font: 14px inherit;
        cursor: pointer;
      }
    </style>
    <style>
      body:has(.profile) .profile .avatar {
        width: 82px;
        height: 82px;
        flex: none;
        margin: 3px 0 0;
        border: 3px solid var(--g6);
        font-size: 28px;
      }
      .top-more {
        position: absolute;
        top: 12px;
        right: 16px;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--g2);
        font: 700 19px/1 inherit;
        cursor: pointer;
      }
      .profile-actions .blacklist-notice {
        flex: 1;
        margin: auto;
        text-align: center;
        color: var(--g3);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <section class="top">
        <button class="back" type="button" aria-label="返回" id="back">‹</button
        ><span class="cover-label">背景图 · 16:9</span
        ><button class="top-more" type="button" aria-label="更多" data-more>
          ···</button
        ><button class="live-entry state-hide" type="button" id="liveEntry">
          <i>▮▮</i>直播中
        </button>
      </section>
      <section class="profile">
        <div class="profile-header">
          <i class="avatar" id="avatar"></i>
          <div class="profile-info">
            <div class="name-line">
              <h1 id="name"></h1>
              <span class="gender-age" id="genderAge"></span>
            </div>
            <p class="profile-id" id="id"></p>
            <div class="identity-levels">
              <span>主播 <b id="hostLevel"></b></span
              ><span>财富 <b id="wealthLevel"></b></span>
            </div>
          </div>
        </div>
        <p class="profile-description" id="description"></p>
      </section>
      <section class="stats" aria-label="主播数据">
        <span><small>粉丝</small><b id="followers"></b></span
        ><span><small>关注</small><b id="following"></b></span
        ><span><small>观众</small><b id="viewers"></b></span
        ><span><small>送出</small><b id="sent"></b></span>
      </section>
      <section class="modules">
        <a class="module" id="fanClubEntry" href="../fan-club/my-fan-clubs.html"
          ><i class="module-icon">♡</i
          ><span class="module-copy"><b id="fanClubName"></b></span
          ><i class="club-level" id="fanClubLevel"></i
          ><span class="module-arrow">›</span></a
        >
        <a class="module" id="giftGalleryEntry" href="host-gift-gallery.html"
          ><i class="module-icon">◇</i
          ><span class="module-copy"><b>礼物展馆</b></span
          ><span class="module-value" id="giftKinds"></span
          ><span class="module-arrow">›</span></a
        >
        <a
          class="module"
          id="rankingEntry"
          href="../fan-club/fan-contribution-ranking.html"
          ><i class="module-icon">♙</i
          ><span class="module-copy"><b>贡献榜</b></span
          ><span class="leader-avatars" id="contributionLeaders"></span
          ><span class="module-arrow">›</span></a
        >
      </section>
    </main>
    <section
      class="fan-club-sheet state-hide"
      id="fanClubSheet"
      role="dialog"
      aria-modal="true"
    ></section>
    <section class="more-sheet state-hide" id="moreSheet" aria-label="更多操作">
      <button type="button" data-report>举报</button
      ><button type="button" data-block>拉黑</button
      ><button type="button" data-close-more>取消</button>
    </section>
    <footer class="profile-actions">
      <button type="button" data-follow><b>+</b><span>关注</span></button
      ><button type="button" data-add-friend><b>+</b><span>加好友</span></button
      ><button type="button" data-message><b>✉</b><span>私信</span></button>
      <p class="blacklist-notice state-hide" id="blacklistNotice">
        已加入黑名单
      </p>
    </footer>
    <div class="homebar"><i></i></div>
    <script>
      const hostKey =
        new URLSearchParams(location.search).get("host") || "sari";
      const host =
        window.LUMA_MOCK.hostProfiles[hostKey] ||
        window.LUMA_MOCK.hostProfiles.sari;
      document.querySelector("#avatar").textContent = host.avatar;
      document.querySelector("#name").textContent = host.name;
      document.querySelector("#hostLevel").textContent = host.hostLevel;
      document.querySelector("#wealthLevel").textContent = host.wealthLevel;
      document.querySelector("#genderAge").textContent =
        `${host.gender} · ${host.age}`;
      document.querySelector("#id").textContent = `ID：${host.id}`;
      document.querySelector("#description").textContent = host.description;
      document.querySelector("#followers").textContent = host.followers;
      document.querySelector("#following").textContent = host.following;
      document.querySelector("#viewers").textContent = host.viewers;
      document.querySelector("#sent").textContent = host.sent;
      document.querySelector("#fanClubName").textContent = host.fanClubName;
      document.querySelector("#fanClubLevel").textContent =
        `团 ${host.fanClubLevel}`;
      document.querySelector("#giftKinds").textContent =
        `${host.giftKindsReceived}/${host.giftKindsTotal}`;
      document.querySelector("#contributionLeaders").innerHTML =
        host.contributionLeaders
          .map((avatar) => `<i class="avatar">${avatar}</i>`)
          .join("");
      const fanClubEntry = document.querySelector("#fanClubEntry");
      const fanClubSheet = document.querySelector("#fanClubSheet");
      let joinedFanClub = window.LUMA_MOCK.myFanClubs.some(
        (club) => club.id === host.key,
      );
      const setFanClubState = (joined) => {
        joinedFanClub = joined;
        fanClubSheet.classList.add("state-hide");
        fanClubEntry.href = `../fan-club/fan-contribution-ranking.html?host=${encodeURIComponent(host.key)}`;
      };
      const renderFanClubSheet = () => {
        fanClubSheet.innerHTML = /* HTML */ `<button
            type="button"
            class="fan-club-sheet-close"
            aria-label="关闭粉丝团"
          >
            ×
          </button>
          <header>
            <i class="avatar">${host.avatar}</i>
            <div class="fan-club-summary">
              <div>
                <b>${host.fanClubName}</b
                ><i class="fan-club-level">${host.fanClubLevel}</i>
              </div>
              <div>
                <span>${host.fanClubMemberCount} 人</span>
                <div class="fan-club-rank">
                  <em>粉丝榜</em>${host.contributionLeaders
                    .map((avatar) => `<i>${avatar}</i>`)
                    .join("")}
                </div>
              </div>
            </div>
          </header>
          <section class="fan-club-benefits">
            <h2>粉丝团权益</h2>
            <div>
              <article>
                <i>◆</i
                ><span><b>粉丝灯牌</b><small>发言展示主播专属灯牌</small></span>
              </article>
              <article>
                <i>↗</i
                ><span><b>进房提示</b><small>进入直播间时显示提示</small></span>
              </article>
            </div>
          </section>
          <button type="button" class="fan-club-primary" data-join-fan-club>
            加入粉丝团
          </button>`;
        fanClubSheet.querySelector(".fan-club-sheet-close").onclick = () =>
          fanClubSheet.classList.add("state-hide");
        fanClubSheet.querySelector("[data-join-fan-club]").onclick = () => {
          joinedFanClub = true;
          fanClubSheet.classList.add("state-hide");
          Luma.toast(`已加入 ${host.fanClubName}`);
        };
      };
      fanClubEntry.onclick = (event) => {
        if (joinedFanClub) return;
        event.preventDefault();
        renderFanClubSheet();
        fanClubSheet.classList.remove("state-hide");
        moreSheet.classList.add("state-hide");
      };
      setFanClubState(joinedFanClub);
      document.querySelector("#giftGalleryEntry").href =
        `host-gift-gallery.html?host=${encodeURIComponent(host.key)}`;
      document.querySelector("#rankingEntry").href =
        `../fan-club/fan-contribution-ranking.html?host=${encodeURIComponent(host.key)}`;
      const liveEntry = document.querySelector("#liveEntry");
      liveEntry.classList.toggle("state-hide", !host.live);
      liveEntry.onclick = () => {
        location.href = `../live/live-room.html?host=${encodeURIComponent(host.key)}`;
      };
      document.querySelector("#back").onclick = () => {
        const previousPage = document.referrer.includes("/pages/")
          ? document.referrer
          : "";
        if (previousPage) {
          location.href = previousPage;
          return;
        }
        history.back();
      };
      const moreSheet = document.querySelector("#moreSheet");
      const followButton = document.querySelector("[data-follow]");
      const addFriendButton = document.querySelector("[data-add-friend]");
      const blacklistNotice = document.querySelector("#blacklistNotice");
      const profileActionButtons = document.querySelectorAll(
        ".profile-actions button",
      );
      const setRelationshipState = (relationship) => {
        const isBlacklisted = relationship === "blacklist";
        const isFriend = relationship === "friend";
        profileActionButtons.forEach((button) =>
          button.classList.toggle("state-hide", isBlacklisted),
        );
        blacklistNotice.classList.toggle("state-hide", !isBlacklisted);
        addFriendButton.classList.toggle(
          "state-hide",
          isBlacklisted || isFriend,
        );
        if (isBlacklisted) moreSheet.classList.add("state-hide");
      };
      setRelationshipState(
        host.isBlacklisted
          ? "blacklist"
          : host.isFriend
            ? "friend"
            : "nonfriend",
      );
      followButton.onclick = () => {
        const followed = followButton.classList.toggle("is-following");
        followButton.querySelector("b").textContent = followed ? "✓" : "+";
        followButton.querySelector("span").textContent = followed
          ? "已关注"
          : "关注";
      };
      addFriendButton.onclick = () => Luma.toast("已发送好友申请");
      document.querySelector("[data-message]").onclick = () => {
        location.href = "direct-message.html";
      };
      document.querySelector("[data-more]").onclick = () =>
        moreSheet.classList.remove("state-hide");
      document.querySelector("[data-close-more]").onclick = () =>
        moreSheet.classList.add("state-hide");
      document.querySelector("[data-report]").onclick = () => {
        moreSheet.classList.add("state-hide");
        Luma.toast("已提交举报");
      };
      document.querySelector("[data-block]").onclick = () => {
        moreSheet.classList.add("state-hide");
        Luma.toast("已拉黑该用户");
      };
      Luma.registerStates({
        粉丝团状态: {
          已加入: () => setFanClubState(true),
          未加入: () => setFanClubState(false),
        },
        好友关系: {
          非好友: () => setRelationshipState("nonfriend"),
          好友: () => setRelationshipState("friend"),
          黑名单: () => setRelationshipState("blacklist"),
        },
      });
      window.parent.postMessage(
        { type: "luma-page", file: "host-home.html" },
        "*",
      );
    </script>
  </body>
</html>
