<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>单聊设置 · 1 对 1 私信 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <script src="../../../assets/common.js?v=20260811-guild-currency-v1"></script>
    <script src="../../../assets/mock.js?v=20260811-guild-currency-v1"></script>
    <style>
      .screen {
        padding-bottom: 34px;
      }
      .nav a {
        position: absolute;
        left: 16px;
        color: var(--g2);
        font-size: 24px;
        line-height: 1;
        text-decoration: none;
      }
      .user {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 12px 16px 0;
        padding: 16px;
        background: var(--g7);
        border-radius: 12px;
        color: var(--g1);
        text-decoration: none;
      }
      .user .avatar {
        width: 52px;
        height: 52px;
        font-size: 18px;
      }
      .user-copy {
        min-width: 0;
        flex: 1;
      }
      .user-name {
        display: block;
        font-size: 17px;
      }
      .user-tags {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 6px;
      }
      .tag {
        padding: 2px 5px;
        border-radius: 5px;
        background: var(--g6);
        color: var(--g3);
        font-size: 10px;
        font-style: normal;
        white-space: nowrap;
      }
      .section {
        margin-top: 12px;
        background: var(--g7);
      }
      .action {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
        border: 0;
        border-bottom: 1px solid var(--g6);
        background: var(--g7);
        color: var(--g1);
        font: 15px inherit;
        text-align: left;
        cursor: pointer;
      }
      .action:last-child {
        border: 0;
      }
      .action span:last-child {
        color: var(--g4);
      }
      .switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid var(--g6);
        font-size: 15px;
      }
      .switch {
        position: relative;
        width: 46px;
        height: 28px;
      }
      .switch input {
        position: absolute;
        opacity: 0;
      }
      .switch i {
        position: absolute;
        inset: 0;
        border-radius: 14px;
        background: var(--g5);
        cursor: pointer;
        transition: background 0.2s;
      }
      .switch i::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--g7);
        transition: transform 0.2s;
      }
      .switch input:checked + i {
        background: var(--g1);
      }
      .switch input:checked + i::after {
        transform: translateX(18px);
      }
      .confirm {
        position: fixed;
        inset: 0;
        z-index: 8;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.32);
      }
      .confirm-card {
        width: 294px;
        padding: 22px 16px 16px;
        border-radius: 8px;
        background: var(--g7);
        text-align: center;
      }
      .confirm-card b {
        display: block;
        font-size: 17px;
      }
      .confirm-card p {
        margin: 8px 0 18px;
        color: var(--g3);
        font-size: 13px;
        line-height: 1.45;
      }
      .confirm-card div {
        display: flex;
        gap: 10px;
      }
      .confirm-card button {
        flex: 1;
        height: 38px;
        border: 0;
        border-radius: 8px;
        font: 14px inherit;
        cursor: pointer;
      }
      .confirm-card [data-cancel] {
        background: var(--g6);
        color: var(--g2);
      }
      .confirm-card [data-confirm] {
        background: var(--g1);
        color: var(--g7);
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <div class="nav">
        <a href="direct-message.html" aria-label="返回">‹</a>单聊设置
      </div>
      <a class="user" href="user-home.html"
        ><i class="avatar">S</i
        ><span class="user-copy"
          ><b class="user-name">Sari</b
          ><span class="user-tags"
            ><i class="tag">Lv.20</i><i class="tag">勋章1</i
            ><i class="tag">勋章2</i></span
          ></span
        ><span>›</span></a
      >
      <section class="section">
        <div class="switch-row">
          <span>消息免打扰</span
          ><label class="switch"
            ><input
              id="muteMessages"
              type="checkbox"
              aria-label="消息免打扰" /><i></i
          ></label>
        </div>
        <button class="action" id="blacklist">
          <span>拉黑</span><span>›</span></button
        ><button class="action" id="report">
          <span>举报</span><span>›</span>
        </button>
      </section>
    </main>
    <section
      class="confirm state-hide"
      id="confirmOne"
      role="dialog"
      aria-modal="true"
    >
      <div class="confirm-card">
        <b></b>
        <p></p>
        <div>
          <button type="button" data-cancel>取消</button
          ><button type="button" data-confirm>确认</button>
        </div>
      </div>
    </section>
    <section
      class="confirm state-hide"
      id="confirmTwo"
      role="dialog"
      aria-modal="true"
    >
      <div class="confirm-card">
        <b></b>
        <p></p>
        <div>
          <button type="button" data-cancel>取消</button
          ><button type="button" data-confirm>再次确认</button>
        </div>
      </div>
    </section>
    <div class="homebar"><i></i></div>
    <script>
      const action = {
        title: "确认拉黑 Sari？",
        detail: "拉黑后将无法继续私信。",
        secondTitle: "再次确认拉黑？",
        secondDetail: "确认后双方将无法继续私信。",
        done: "已拉黑 Sari",
      };
      const confirmOne = document.querySelector("#confirmOne"),
        confirmTwo = document.querySelector("#confirmTwo");
      function closeConfirm() {
        confirmOne.classList.add("state-hide");
        confirmTwo.classList.add("state-hide");
      }
      function setDialog(dialog, title, detail) {
        dialog.querySelector("b").textContent = title;
        dialog.querySelector("p").textContent = detail;
      }
      blacklist.onclick = () => {
        setDialog(confirmOne, action.title, action.detail);
        confirmOne.classList.remove("state-hide");
      };
      report.onclick = () => {
        location.href = "../live/live-room-user-report.html?name=Sari";
      };
      document
        .querySelectorAll("[data-cancel]")
        .forEach((button) => (button.onclick = closeConfirm));
      confirmOne.querySelector("[data-confirm]").onclick = () => {
        setDialog(confirmTwo, action.secondTitle, action.secondDetail);
        confirmOne.classList.add("state-hide");
        confirmTwo.classList.remove("state-hide");
      };
      confirmTwo.querySelector("[data-confirm]").onclick = () => {
        closeConfirm();
        blacklist.firstElementChild.textContent = "已拉黑";
        Luma.toast(action.done);
      };
    </script>
  </body>
</html>
