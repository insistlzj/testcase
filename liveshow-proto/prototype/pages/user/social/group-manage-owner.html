<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>群管理（群主）· 粉丝团群聊 · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <script src="../../../assets/common.js?v=20260811-guild-currency-v1"></script>
    <script src="../../../assets/mock.js?v=20260811-guild-currency-v1"></script>
    <style>
      .screen {
        padding-bottom: 34px;
      }
      .nav a {
        position: absolute;
        left: 16px;
        color: var(--g2);
        font-size: 24px;
        line-height: 1;
        text-decoration: none;
      }
      .notice,
      .setting,
      .section {
        margin: 12px 16px 0;
        padding: 14px 16px;
        background: var(--g7);
        border-radius: 12px;
      }
      .notice b,
      .setting b,
      .member-entry b {
        font-size: 15px;
      }
      .notice p {
        margin: 7px 0 0;
        color: var(--g3);
        font-size: 13px;
        line-height: 1.45;
      }
      .notice button {
        margin-top: 10px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--g2);
        font: 13px inherit;
        cursor: pointer;
      }
      .setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .switch {
        position: relative;
        width: 42px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 12px;
        background: var(--g5);
        cursor: pointer;
      }
      .switch i {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--g7);
        transition: left 0.15s;
      }
      .switch.on {
        background: var(--g1);
      }
      .switch.on i {
        left: 21px;
      }
      .section {
        padding: 0;
        overflow: hidden;
      }
      .member-entry,
      .action {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 16px;
        border: 0;
        background: var(--g7);
        color: var(--g1);
        font: 15px inherit;
        text-align: left;
        text-decoration: none;
        cursor: pointer;
      }
      .member-entry span:last-child,
      .action span:last-child {
        color: var(--g4);
      }
      .notice p { white-space: pre-wrap; overflow-wrap: anywhere; }
      .notice-editor { width: calc(100% - 48px); max-width: 342px; padding: 20px; border: 0; border-radius: 12px; background: var(--g7); color: var(--g1); }
      .notice-editor::backdrop { background: var(--g1); opacity: .45; }
      .notice-editor h2 { margin: 0 0 16px; font-size: 18px; }
      .notice-editor textarea { box-sizing: border-box; width: 100%; min-height: 140px; padding: 12px; border: 1px solid var(--g5); border-radius: 12px; background: var(--g7); color: var(--g1); font: inherit; resize: vertical; }
      .notice-count { margin: 6px 0 16px; color: var(--g4); font-size: 12px; text-align: right; }
      .notice-actions { display: flex; gap: 12px; }
      .notice-actions button { flex: 1; }
      .notice-actions button:disabled { opacity: .4; cursor: default; }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <div class="nav">
        <a href="fan-group-chat.html" aria-label="返回">‹</a>群管理
      </div>
      <section class="notice">
        <b>群公告</b>
        <p>今晚 8 点专场，记得来！</p>
        <button id="editNotice">编辑公告</button>
      </section>
      <section class="setting">
        <b>群消息免打扰</b
        ><button class="switch" id="dnd" aria-label="群消息免打扰">
          <i></i>
        </button>
      </section>
      <section class="section">
        <a class="member-entry" href="../host/fan-club.html"
          ><span><b>群成员管理</b></span
          ><span>›</span></a
        >
      </section>
      <section class="section">
        <button class="action" id="report">
          <span>举报</span><span>›</span>
        </button>
      </section>
    </main>
    <div class="homebar"><i></i></div>
    <dialog id="noticeEditor" class="notice-editor" aria-labelledby="noticeTitle">
      <form id="noticeForm">
        <h2 id="noticeTitle">编辑公告</h2>
        <textarea id="noticeContent" maxlength="200" aria-label="公告内容" placeholder="请输入公告内容" required></textarea>
        <div class="notice-count"><span id="noticeCount">0</span>/200</div>
        <div class="notice-actions"><button class="btn sub" type="button" id="cancelNotice">取消</button><button class="btn" type="submit" id="saveNotice">保存</button></div>
      </form>
    </dialog>
    <script>
      const dnd = document.querySelector("#dnd");
      dnd.onclick = () => dnd.classList.toggle("on");
      report.onclick = () => Luma.toast("打开举报");
      const editor = document.querySelector("#noticeEditor");
      const content = document.querySelector("#noticeContent");
      const notice = document.querySelector(".notice p");
      const save = document.querySelector("#saveNotice");
      function updateNoticeInput() {
        document.querySelector("#noticeCount").textContent = content.value.length;
        save.disabled = !content.value.trim() || content.value.length > 200;
      }
      function openNoticeEditor() {
        content.value = notice.textContent;
        updateNoticeInput();
        if (!editor.open) editor.showModal();
        content.focus();
      }
      editNotice.onclick = openNoticeEditor;
      content.oninput = updateNoticeInput;
      document.querySelector("#cancelNotice").onclick = () => editor.close();
      document.querySelector("#noticeForm").onsubmit = (event) => {
        event.preventDefault();
        if (!content.value.trim() || content.value.length > 200) return;
        notice.textContent = content.value;
        editor.close();
        Luma.toast("公告已更新");
      };
      Luma.registerStates({ 默认: () => editor.close(), 编辑公告: openNoticeEditor });
    </script>
  </body>
</html>
