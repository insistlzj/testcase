<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>修改密码 · 公会 APP</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <link
      rel="stylesheet"
      href="../../../assets/guild.css?v=20260815-password-page-v1"
    />
    <script src="../../../assets/common.js?v=20260818-id-date-time-v1"></script>
    <script src="../../../assets/mock.js"></script>
  </head>
  <body>
    <main class="guild-sub-screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="guild-page-nav">
        <a
          class="guild-back"
          href="guild-settings.html"
          aria-label="返回账号设置"
          >‹</a
        >修改密码
      </header>
      <div class="guild-page-body guild-password-page">
        <form id="passwordForm">
          <section class="guild-form-card">
            <label class="guild-field"
              ><span>当前密码</span
              ><input
                id="currentPassword"
                type="password"
                autocomplete="current-password"
                placeholder="输入当前密码"
                required /></label
            ><label class="guild-field"
              ><span>新密码</span
              ><input
                id="newPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="至少 8 位"
                required /></label
            ><label class="guild-field"
              ><span>确认新密码</span
              ><input
                id="confirmPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="再次输入新密码"
                required
            /></label>
            <p class="guild-field-hint" id="passwordHint">密码至少 8 位</p>
          </section>
          <button
            class="guild-primary-action"
            id="passwordSubmit"
            type="submit"
            disabled
          >
            确认修改
          </button>
        </form>
      </div>
    </main>
    <div class="guild-homebar"><i></i></div>
    <script>
      function update() {
        const current = currentPassword.value,
          newValue = newPassword.value,
          confirmed = confirmPassword.value;
        passwordSubmit.disabled =
          !current || newValue.length < 8 || confirmed.length < 8;
        passwordHint.textContent =
          confirmed && newValue !== confirmed
            ? "两次输入的新密码不一致"
            : "密码至少 8 位";
        passwordHint.classList.toggle(
          "danger",
          Boolean(confirmed && newValue !== confirmed),
        );
      }
      currentPassword.oninput =
        newPassword.oninput =
        confirmPassword.oninput =
          update;
      passwordForm.onsubmit = (event) => {
        event.preventDefault();
        if (newPassword.value !== confirmPassword.value) {
          Luma.toast("两次输入的新密码不一致");
          return;
        }
        location.href = "guild-settings.html?action=password";
      };
      update();
      window.parent.postMessage(
        { type: "luma-page", file: "guild-password.html" },
        "*",
      );
    </script>
  </body>
</html>
