<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>直播场次详情 · 公会 APP</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <link
      rel="stylesheet"
      href="../../../assets/guild.css?v=20260824-former-host-tag-v1"
    />
    <link
      rel="stylesheet"
      href="../../../assets/guild-core-data.css?v=20260824-gift-name-time-v1"
    />
    <script src="../../../assets/common.js?v=20260818-id-date-time-v1"></script>
    <script src="../../../assets/mock.js?v=20260817-home-two-metrics-v1"></script>
    <script src="../../../assets/guild-data-model.js?v=20260819-former-host-data-v1"></script>
  </head>
  <body>
    <main class="guild-sub-screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="guild-page-nav">
        <a
          class="guild-back"
          id="backLink"
          href="guild-host-data.html"
          aria-label="返回直播记录"
          >‹</a
        >直播场次详情
      </header>
      <div class="guild-page-body guild-gift-detail-page">
        <section class="guild-gift-session-overview" aria-label="直播场次信息">
          <div class="guild-gift-session-grid" id="sessionGrid"></div>
        </section>

        <h2 class="guild-gift-list-title">送礼列表</h2>
        <section class="guild-gift-record-table" aria-label="送礼列表">
          <div class="guild-gift-record-head" role="row">
            <span>礼物名称/赠送时间</span><span>金币</span
            ><i aria-hidden="true"></i>
          </div>
          <div id="giftList"></div>
        </section>
      </div>
    </main>
    <div class="guild-homebar"><i></i></div>

    <div class="guild-mask state-hide" id="giftDetailMask">
      <section
        class="guild-sheet guild-detail-sheet guild-gift-detail-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="giftDetailTitle"
      >
        <header>
          <h2 id="giftDetailTitle">送礼详情</h2>
          <button
            class="guild-sheet-close"
            id="closeGiftDetail"
            type="button"
            aria-label="关闭"
          >
            ×
          </button>
        </header>
        <div class="guild-detail-grid" id="giftDetailGrid"></div>
      </section>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const dataModel = LUMA_GUILD_DATA;
      const hostId = dataModel.hosts.some(
        (host) => host.id === params.get("hostId"),
      )
        ? params.get("hostId")
        : dataModel.hosts[0].id;
      const date = dataModel.dates.includes(params.get("date"))
        ? params.get("date")
        : dataModel.dates[dataModel.dates.length - 1];
      const hostDay = dataModel.getDay(hostId, date);
      const session = dataModel.getSession(
        params.get("sessionId"),
        hostId,
        date,
      );
      const host = hostDay.host;
      const coinIcon =
        '<svg class="guild-coin-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 21 12 12 21 3 12Z"></path></svg>';
      const giftProfiles = [
        {
          name: "金色星星",
          type: "普通礼物",
          userName: "Andi Pratama",
          userId: "U90328411",
          level: "Lv.28",
        },
        {
          name: "音乐皇冠",
          type: "定制礼物",
          userName: "Nadia Putri",
          userId: "U90328176",
          level: "Lv.24",
        },
        {
          name: "幸运礼盒",
          type: "幸运礼物",
          userName: "Rizky Maulana",
          userId: "U90327703",
          level: "Lv.31",
        },
        {
          name: "玫瑰花束",
          type: "普通礼物",
          userName: "Siti Rahma",
          userId: "U90327125",
          level: "Lv.18",
        },
        {
          name: "闪耀舞台",
          type: "定制礼物",
          userName: "Fajar Nugroho",
          userId: "U90326842",
          level: "Lv.22",
        },
        {
          name: "咖啡",
          type: "普通礼物",
          userName: "Bima Saputra",
          userId: "U90326198",
          level: "Lv.16",
        },
      ];
      const giftRatios = [0.28, 0.22, 0.18, 0.14, 0.1];

      function giftTime(offset) {
        const value = new Date(`${session.date}T${session.start}:00`);
        value.setMinutes(value.getMinutes() + offset);
        const stamp = `${value.getFullYear()}-${String(value.getMonth() + 1).padStart(2, "0")}-${String(value.getDate()).padStart(2, "0")} ${String(value.getHours()).padStart(2, "0")}:${String(value.getMinutes()).padStart(2, "0")}`;
        return { raw: stamp, display: LUMA_FORMAT.dateTime(stamp) };
      }

      const giftCoins = giftProfiles.map((profile, index) =>
        index < giftRatios.length
          ? Math.round((session.coins * giftRatios[index]) / 10) * 10
          : 0,
      );
      giftCoins[giftCoins.length - 1] = Math.max(
        0,
        session.coins - giftCoins.reduce((sum, value) => sum + value, 0),
      );
      const giftRecords = giftProfiles.map((profile, index) => ({
        ...profile,
        id: `GF${session.id.slice(2)}${String(index + 1).padStart(2, "0")}`,
        time: giftTime(8 + index * 11),
        coins: giftCoins[index],
      }));

      const sessionFields = [
        ["直播主题", session.theme],
        ["场次ID", session.id],
        ["主播名称", host.name],
        ["主播ID", host.id],
        ["开播时间", LUMA_FORMAT.dateTime(`${session.date} ${session.start}`)],
        ["直播时长", dataModel.formatDuration(session.duration)],
        ["观众数量", LUMA_FORMAT.integer(session.views)],
        ["送礼观众", LUMA_FORMAT.integer(session.gifters)],
        ["礼物数量", LUMA_FORMAT.integer(session.giftQuantity)],
        [
          "礼物收益",
          `${coinIcon}${LUMA_FORMAT.coins(session.coins)}`,
          "guild-gift-coin-value",
        ],
      ];

      sessionGrid.innerHTML = sessionFields
        .map(
          (field) =>
            `<div><span>${field[0]}</span><b class="${field[2] || ""}">${field[1]}</b></div>`,
        )
        .join("");
      giftList.innerHTML = giftRecords
        .map(
          (record) =>
            `<button class="guild-gift-record-row" type="button" data-gift-id="${record.id}" aria-label="查看${record.giftName || record.name}送礼详情"><span class="guild-gift-record-name"><b>${record.name}</b><small>${record.time.display}</small></span><strong>${coinIcon}${LUMA_FORMAT.coins(record.coins)}</strong><i aria-hidden="true">›</i></button>`,
        )
        .join("");

      function openGiftDetail(record) {
        const fields = [
          ["赠送时间", record.time.display],
          ["礼物名称", record.name],
          [
            "金币",
            `${coinIcon}${LUMA_FORMAT.coins(record.coins)}`,
            "guild-gift-sheet-value guild-gift-coin-value",
          ],
          ["类型", record.type],
          ["用户名称", record.userName],
          ["用户ID", record.userId],
          ["用户等级", record.level],
        ];
        giftDetailGrid.innerHTML = fields
          .map(
            (field) =>
              `<div class="guild-detail-item"><span>${field[0]}</span><b class="${field[2] || ""}">${field[1]}</b></div>`,
          )
          .join("");
        giftDetailMask.classList.remove("state-hide");
        document.body.classList.add("guild-sheet-open");
      }

      function closeGiftSheet() {
        giftDetailMask.classList.add("state-hide");
        document.body.classList.remove("guild-sheet-open");
      }

      giftList.onclick = (event) => {
        const row = event.target.closest("[data-gift-id]");
        if (!row) return;
        openGiftDetail(
          giftRecords.find((record) => record.id === row.dataset.giftId),
        );
      };
      closeGiftDetail.onclick = closeGiftSheet;
      giftDetailMask.onclick = (event) => {
        if (event.target === giftDetailMask) closeGiftSheet();
      };
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeGiftSheet();
      });

      const backQuery = params.get("back");
      backLink.href = `guild-host-data.html${backQuery ? `?${backQuery}` : ""}`;
      window.parent.postMessage(
        {
          type: "luma-page",
          file: "guild-live-gift-detail.html",
          query: location.search,
        },
        "*",
      );
    </script>
  </body>
</html>
