<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>选择主播 · 公会 APP</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <link
      rel="stylesheet"
      href="../../../assets/guild.css?v=20260819-violation-host-multi-v2"
    />
    <script src="../../../assets/common.js?v=20260818-id-date-time-v1"></script>
    <script src="../../../assets/mock.js?v=20260819-all-records-v1"></script>
    <script src="../../../assets/guild-data-model.js?v=20260819-all-records-v3"></script>
  </head>
  <body>
    <main class="guild-sub-screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="guild-page-nav">
        <a
          class="guild-back"
          id="backLink"
          href="guild-all-violations.html"
          aria-label="返回违规记录"
          >‹</a
        ><span>选择</span>
      </header>
      <div class="guild-page-body guild-host-select-body">
        <label class="guild-search" for="hostSearch"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m16 16 4 4"></path></svg
          ><input
            id="hostSearch"
            type="search"
            placeholder="搜索主播昵称或 ID"
            autocomplete="off"
        /></label>
        <div class="guild-list-summary">
          <strong id="listSummary"></strong
          ><button
            class="guild-host-select-all"
            id="selectAllButton"
            type="button"
            aria-label="全选主播"
          >
            <span id="selectionSummary"></span
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="4" width="16" height="16" rx="3"></rect>
              <path d="m8 12 3 3 5-6"></path>
            </svg>
          </button>
        </div>
        <section
          class="guild-host-choice-list"
          id="hostList"
          aria-label="主播多选列表"
        ></section>
      </div>
    </main>
    <div class="guild-homebar"><i></i></div>
    <script>
      const hosts = window.LUMA_GUILD_DATA.hosts;
      const params = new URLSearchParams(location.search);
      const pickerTarget = ["violations", "live", "share"].includes(
        params.get("pickerTarget"),
      )
        ? params.get("pickerTarget")
        : "violations";
      const targetConfig = {
        violations: {
          file: "guild-all-violations.html",
          label: "违规记录",
          param: "hostIds",
        },
        live: {
          file: "guild-host-data.html",
          label: "直播记录",
          param: "hostIds",
        },
        share: {
          file: "guild-share-ledger.html",
          label: "主播分成",
          param: "members",
        },
      }[pickerTarget];
      const requestedSelectionValue = params.get("selected") || "";
      const requestedSelection = requestedSelectionValue
        .split(",")
        .filter((id) => hosts.some((host) => host.id === id));
      let selectedHostIds =
        requestedSelectionValue === "none"
          ? new Set()
          : new Set(
              requestedSelection.length
                ? requestedSelection
                : hosts.map((host) => host.id),
            );
      const backLink = document.getElementById("backLink");
      const selectAllButton = document.getElementById("selectAllButton");
      const hostSearch = document.getElementById("hostSearch");
      const listSummary = document.getElementById("listSummary");
      const selectionSummary = document.getElementById("selectionSummary");
      const hostList = document.getElementById("hostList");

      function returnUrl(hostIds) {
        const query = new URLSearchParams(location.search);
        query.delete("pickerTarget");
        query.delete("selected");
        query.delete("hostId");
        query.delete("hostIds");
        query.delete("members");
        const selectedIds = [...hostIds];
        if (!selectedIds.length) query.set(targetConfig.param, "none");
        else if (selectedIds.length < hosts.length)
          query.set(targetConfig.param, selectedIds.join(","));
        else if (pickerTarget === "live") query.set("hostId", "all");
        return `${targetConfig.file}${query.size ? `?${query}` : ""}`;
      }

      function render() {
        const query = hostSearch.value.trim().toLowerCase();
        const visible = hosts.filter((host) =>
          `${host.name} ${host.id}`.toLowerCase().includes(query),
        );
        const allSelected = selectedHostIds.size === hosts.length;
        listSummary.textContent = `主播 ${visible.length} 人`;
        selectionSummary.textContent = `已选${selectedHostIds.size}人`;
        selectAllButton.classList.toggle("active", allSelected);
        selectAllButton.setAttribute("aria-pressed", String(allSelected));
        selectAllButton.setAttribute(
          "aria-label",
          allSelected ? "取消全选主播" : "全选主播",
        );
        const hostChoices = visible
          .map((host) => {
            const selected = selectedHostIds.has(host.id);
            return `<button class="guild-host-choice ${selected ? "selected" : ""}" data-id="${host.id}" type="button" role="checkbox" aria-checked="${selected}"><span class="directory-avatar${host.live ? " is-live" : ""}"${host.live ? ' aria-label="直播中"' : ""}>${host.avatar}</span><span class="guild-host-choice-copy"><b>${host.name}</b><small>${host.id}</small></span><i aria-hidden="true">${selected ? "✓" : ""}</i></button>`;
          })
          .join("");
        hostList.innerHTML =
          hostChoices ||
          '<div class="guild-page-empty"><b>未找到主播</b><span>请调整搜索词</span></div>';
        hostList.querySelectorAll("[data-id]").forEach((button) => {
          button.onclick = () => {
            if (selectedHostIds.has(button.dataset.id)) {
              selectedHostIds.delete(button.dataset.id);
            } else {
              selectedHostIds.add(button.dataset.id);
            }
            render();
          };
        });
        backLink.href = returnUrl(selectedHostIds);
      }

      selectAllButton.onclick = () => {
        selectedHostIds =
          selectedHostIds.size === hosts.length
            ? new Set()
            : new Set(hosts.map((host) => host.id));
        render();
      };
      hostSearch.oninput = render;
      backLink.setAttribute("aria-label", `返回${targetConfig.label}`);
      render();
      window.parent.postMessage(
        {
          type: "luma-page",
          file: "guild-violation-host-select.html",
          query: location.search,
        },
        "*",
      );
    </script>
  </body>
</html>
