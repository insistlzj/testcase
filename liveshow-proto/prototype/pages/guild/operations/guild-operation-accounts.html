<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>运营账号 · 公会 APP</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <link
      rel="stylesheet"
      href="../../../assets/guild.css?v=20260815-operation-account-page-v1"
    />
    <script src="../../../assets/common.js?v=20260818-id-date-time-v1"></script>
    <script src="../../../assets/mock.js"></script>
  </head>
  <body>
    <main class="guild-sub-screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="guild-page-nav">
        <a class="guild-back" href="../home/guild-home.html">‹</a>运营账号<a
          class="guild-nav-action"
          href="guild-operation-account-compose.html"
          >添加</a
        >
      </header>
      <div class="guild-page-body">
        <section class="guild-manage-list" id="list"></section>
      </div>
    </main>
    <div class="guild-homebar"><i></i></div>
    <script>
      const accounts = [
          ["Andi", "Sari 直播间"],
          ["Putri", "Dewi 直播间"],
          ["Raka", "暂未分配"],
        ],
        params = new URLSearchParams(location.search),
        members = {
          "Dimas · U88231506": "Dimas",
          "Wulan · U88232016": "Wulan",
        },
        rooms = ["暂不分配", "Sari · LS260810001", "Dewi · LS260810002"];
      if (
        params.get("action") === "create" &&
        members[params.get("member")] &&
        rooms.includes(params.get("room"))
      ) {
        const room =
          params.get("room") === "暂不分配"
            ? "暂未分配"
            : `${params.get("room").split(" · ")[0]} 直播间`;
        accounts.push([members[params.get("member")], room]);
      }
      function render() {
        list.innerHTML = accounts
          .map(
            (item, index) =>
              `<div class="guild-manage-row"><span><b>${item[0]}</b><small>${item[1]} · 账号正常</small></span><button class="guild-list-action danger" data-remove="${index}">移除</button></div>`,
          )
          .join("");
        list.querySelectorAll("[data-remove]").forEach(
          (button) =>
            (button.onclick = () => {
              accounts.splice(Number(button.dataset.remove), 1);
              render();
              Luma.toast("运营账号已移除");
            }),
        );
      }
      render();
      if (params.get("action") === "create") Luma.toast("运营账号已添加");
      window.parent.postMessage(
        {
          type: "luma-page",
          file: "guild-operation-accounts.html",
          query: location.search,
        },
        "*",
      );
    </script>
  </body>
</html>
