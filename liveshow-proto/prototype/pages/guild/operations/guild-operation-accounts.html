<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运营账号 · 公会 APP</title><script src="../../../assets/tailwind.js"></script><script src="../../../assets/tokens.js"></script><link rel="stylesheet" href="../../../assets/common.css"><link rel="stylesheet" href="../../../assets/guild.css?v=20260829-operation-accounts-v9"><script src="../../../assets/common.js?v=20260829-operation-accounts-v3"></script><script src="../../../assets/operation-accounts.js?v=20260829-v4"></script></head>
<body><main class="guild-sub-screen"><div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div><header class="guild-page-nav"><a class="guild-back" href="../home/guild-home.html">‹</a>运营账号<a class="guild-nav-action" id="createLink" href="guild-operation-account-compose.html">创建</a></header><div class="guild-page-body">
  <section class="guild-operation-overview"><div><span>本月已发放</span><b id="guildIssued"></b></div><div><span>本月剩余可发</span><b id="guildRemaining"></b></div><div><span>账户余额累计</span><b id="balanceTotal"></b></div><div><span>本月累计消费</span><b id="spentTotal"></b></div></section>
  <section class="guild-operation-account-table"><div class="guild-operation-table-head"><span>运营账号</span><span>余额</span><span>本月消费</span></div><div id="list"></div></section>
</div></main><div class="guild-homebar"><i></i></div>
<script>const store=LUMA_OPERATION_ACCOUNTS,fmt=store.formatCoins,guild=store.guilds[0],base=store.accounts.filter(a=>a.guildId===guild.id);const params=new URLSearchParams(location.search);if(params.get('created')==='1'){const coins=Number(params.get('coins')||0),name=params.get('name')||'Nadia Official',loginAccount=params.get('account')||'nadia_ops';base.push({id:'OP260011',account:loginAccount,name,avatar:name.slice(0,1).toUpperCase(),guildId:guild.id,guildName:guild.name,level:1,balance:coins,issued:coins,spentMonth:0,spentTotal:0,status:params.get('status')||'enabled',managementLocked:false});guild.issued+=coins}function render(items=base){guildIssued.textContent=fmt(guild.issued);guildRemaining.textContent=fmt(guild.monthlyQuota-guild.issued);balanceTotal.textContent=fmt(base.reduce((sum,item)=>sum+item.balance,0));spentTotal.textContent=fmt(base.reduce((sum,item)=>sum+item.spentMonth,0));list.innerHTML=items.length?items.map(a=>`<a class="guild-operation-account guild-operation-table-row" href="guild-operation-account-detail.html?id=${a.id}"><span class="guild-operation-account-copy"><b>${a.name}</b><small>${a.id}</small></span><span class="guild-operation-table-coin"><i>◆</i><b>${fmt(a.balance)}</b></span><span class="guild-operation-table-coin" aria-label="本月消费 ${fmt(a.spentMonth)} 金币"><i>◆</i><b>${fmt(a.spentMonth)}</b><em>›</em></span></a>`).join(''):'<div class="guild-page-empty"><b>暂无运营账号</b></div>'}render();if(params.get('created')==='1')Luma.toast('运营账号已创建');window.parent.postMessage({type:'luma-page',file:'guild-operation-accounts.html',query:location.search},'*');Luma.registerStates({'列表状态':{'有账号':()=>render(base),'空状态':()=>render([])}});</script></body></html>
