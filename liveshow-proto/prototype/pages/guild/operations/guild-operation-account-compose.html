<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>添加运营账号 · 公会 APP</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <link
      rel="stylesheet"
      href="../../../assets/guild.css?v=20260815-operation-account-page-v1"
    />
    <script src="../../../assets/common.js?v=20260818-id-date-time-v1"></script>
    <script src="../../../assets/mock.js"></script>
  </head>
  <body>
    <main class="guild-sub-screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="guild-page-nav">
        <a
          class="guild-back"
          href="guild-operation-accounts.html"
          aria-label="返回运营账号"
          >‹</a
        >添加运营账号
      </header>
      <div class="guild-page-body">
        <form id="accountForm">
          <section class="guild-form-card">
            <label class="guild-field"
              ><span>选择成员</span
              ><select id="member" required>
                <option>Dimas · U88231506</option>
                <option>Wulan · U88232016</option>
              </select></label
            ><label class="guild-field"
              ><span>分配直播间</span
              ><select id="room" required>
                <option>暂不分配</option>
                <option>Sari · LS260810001</option>
                <option>Dewi · LS260810002</option>
              </select></label
            >
          </section>
          <button class="guild-primary-action" type="submit">确认添加</button>
        </form>
      </div>
    </main>
    <div class="guild-homebar"><i></i></div>
    <script>
      accountForm.onsubmit = (event) => {
        event.preventDefault();
        const result = new URLSearchParams({
          action: "create",
          member: member.value,
          room: room.value,
        });
        location.href = `guild-operation-accounts.html?${result}`;
      };
      window.parent.postMessage(
        { type: "luma-page", file: "guild-operation-account-compose.html" },
        "*",
      );
    </script>
  </body>
</html>
