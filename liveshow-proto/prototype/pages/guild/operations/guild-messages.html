<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>运营消息 · 公会 APP</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <link
      rel="stylesheet"
      href="../../../assets/guild.css?v=20260829-filter-zone-v1"
    />
    <link
      rel="stylesheet"
      href="../../../assets/guild-core-data.css?v=20260824-message-range-v1"
    />
    <script src="../../../assets/common.js?v=20260818-id-date-time-v1"></script>
    <script src="../../../assets/guild-date-range.js?v=20260829-v1"></script>
    <script src="../../../assets/mock.js?v=20260818-person-id-v1"></script>
  </head>
  <body>
    <main class="guild-sub-screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="guild-page-nav">
        <a class="guild-back" href="../home/guild-home.html">‹</a>运营消息<a
          class="guild-nav-action"
          href="guild-message-compose.html"
          >新建</a
        >
      </header>
      <div class="guild-page-body">
        <div class="guild-host-summary-filterbar guild-message-range-filter guild-filter-zone">
          <button
            class="guild-host-summary-range"
            id="messageRangeButton"
            type="button"
            aria-haspopup="dialog"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="5" width="16" height="15" rx="2"></rect>
              <path d="M8 3v4M16 3v4M4 10h16"></path></svg
            ><span id="messageRangeValue"></span
            ><i aria-hidden="true">⌄</i></button
          ><button
            class="guild-host-performance-quick"
            id="messageShortcutButton"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <span id="messageShortcutValue">本月</span><i aria-hidden="true">⌄</i>
          </button>
          <div
            class="guild-host-performance-shortcut-menu"
            id="messageShortcutMenu"
            role="menu"
            aria-label="快捷日期筛选"
            hidden
          >
            <button type="button" role="menuitemradio" data-shortcut="thisWeek">本周</button>
            <button class="active" type="button" role="menuitemradio" data-shortcut="thisMonth">本月</button>
            <button type="button" role="menuitemradio" data-shortcut="custom">自定义</button>
          </div>
        </div>
        <div class="guild-list-summary">
          <strong id="summary">发送记录</strong>
        </div>
        <section class="guild-message-records" id="list"></section>
      </div>
    </main>
    <div class="guild-homebar"><i></i></div>
    <div id="rangeSheet"></div>
    <script>
      const allHostCount = LUMA_MOCK.guildPortal.guildHosts.length,
        seed = [
        {
          id: "M26081001",
          audience: "全体主播",
          recipientCount: allHostCount,
          content: "请各位主播关注本周公会活动安排，主播报名请于周五前完成。",
          hasImage: true,
          sentAt: "2026-08-10 10:20",
          sender: "Rizky",
        },
        {
          id: "M26080902",
          audience: "指定主播",
          recipientCount: 1,
          recipientId: "H102938",
          recipients: ["Sari"],
          content: "明晚 20:00 进行新人培训，请提前十分钟进入培训直播间。",
          hasImage: false,
          sentAt: "2026-08-09 18:35",
          sender: "Rizky",
        },
      ];
      function records() {
        const saved = JSON.parse(
          localStorage.getItem("luma-guild-message-records") || "[]",
        );
        return [...saved, ...seed];
      }
      function audienceLabel(item) {
        if (item.audience !== "指定主播") return "全体主播";
        const recipientName = item.recipients?.[0] || "";
        const host = LUMA_MOCK.guildPortal.guildHosts.find(
          (candidate) =>
            candidate.id === item.recipientId ||
            candidate.name === recipientName,
        );
        return host
          ? `${host.name} · ${host.id}`
          : recipientName || item.audience;
      }
      let rangeStart = "2026-08-01",
        rangeEnd = "2026-08-24";
      let selectedShortcut = "thisMonth";
      const shortcutLabels = {
        thisWeek: "本周",
        thisMonth: "本月",
        custom: "自定义",
      };
      const shortcutRanges = {
        thisWeek: ["2026-08-24", "2026-08-24"],
        thisMonth: ["2026-08-01", "2026-08-24"],
      };
      const rangePicker = LumaGuildDateRange.create({
        mask: rangeSheet,
        start: rangeStart,
        end: rangeEnd,
        minDate: "2026-01-01",
        maxDate: "2026-08-29",
        onConfirm: (start, end) => {
          rangeStart = start;
          rangeEnd = end;
          selectedShortcut = "custom";
          render();
        },
      });
      function render() {
        messageRangeValue.textContent = `${LUMA_FORMAT.date(rangeStart)}～${LUMA_FORMAT.date(rangeEnd)}`;
        messageRangeButton.setAttribute(
          "aria-label",
          `选择日期范围，当前${messageRangeValue.textContent}`,
        );
        messageShortcutValue.textContent = shortcutLabels[selectedShortcut];
        messageShortcutMenu
          .querySelectorAll("[data-shortcut]")
          .forEach((button) => {
            const active = button.dataset.shortcut === selectedShortcut;
            button.classList.toggle("active", active);
            button.setAttribute("aria-checked", String(active));
          });
        const items = records().filter(
          (item) =>
            item.sentAt.slice(0, 10) >= rangeStart &&
            item.sentAt.slice(0, 10) <= rangeEnd,
        );
        summary.textContent = `发送记录 ${items.length} 条`;
        list.innerHTML = items.length
          ? items
              .map(
                (item) =>
                  `<a class="guild-message-record" href="guild-message-detail.html?id=${item.id}"><div class="guild-message-record-head"><b>${audienceLabel(item)}</b><span>${LUMA_FORMAT.dateTime(item.sentAt)}</span></div><p>${item.content}</p></a>`,
              )
              .join("")
          : '<div class="guild-page-empty"><b>暂无消息</b><span>当前日期范围内没有发送记录</span></div>';
      }
      function closeShortcutMenu() {
        messageShortcutMenu.hidden = true;
        messageShortcutButton.setAttribute("aria-expanded", "false");
      }
      messageRangeButton.onclick = rangePicker.open;
      messageShortcutButton.onclick = () => {
        messageShortcutMenu.hidden = !messageShortcutMenu.hidden;
        messageShortcutButton.setAttribute(
          "aria-expanded",
          String(!messageShortcutMenu.hidden),
        );
      };
      messageShortcutMenu.onclick = (event) => {
        const button = event.target.closest("[data-shortcut]");
        if (!button) return;
        const shortcut = button.dataset.shortcut;
        closeShortcutMenu();
        if (shortcut === "custom") return rangePicker.open();
        selectedShortcut = shortcut;
        [rangeStart, rangeEnd] = shortcutRanges[shortcut];
        rangePicker.setRange(rangeStart, rangeEnd);
        render();
      };
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".guild-message-range-filter")) {
          closeShortcutMenu();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeShortcutMenu();
      });
      render();
      window.parent.postMessage(
        { type: "luma-page", file: "guild-messages.html" },
        "*",
      );
    </script>
  </body>
</html>
