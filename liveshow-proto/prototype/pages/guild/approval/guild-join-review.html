<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>入会申请 · 待办审批 · 公会 APP</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <link
      rel="stylesheet"
      href="../../../assets/guild.css?v=20260820-join-review-status-v1"
    />
    <script src="../../../assets/common.js?v=20260818-id-date-time-v1"></script>
    <script src="../../../assets/mock.js?v=20260818-person-id-v1"></script>
  </head>
  <body>
    <main class="guild-sub-screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="guild-page-nav">
        <a class="guild-back" href="../home/guild-home.html" aria-label="返回"
          >‹</a
        >入会申请
      </header>
      <div class="guild-page-body">
        <nav
          class="guild-segments guild-review-status-segments"
          aria-label="审核状态"
        >
          <button class="active" type="button" data-tab="reviewing">审核中</button
          ><button type="button" data-tab="approved">已通过</button
          ><button type="button" data-tab="rejected">已驳回</button>
        </nav>
        <section
          class="review-list"
          id="reviewList"
          aria-label="入会申请列表"
        ></section>
      </div>
    </main>
    <div class="guild-homebar"><i></i></div>
    <script>
      const records = LUMA_MOCK.guildPortal.joinApplications;
      const labels = {
        pending: "待审核",
        platformPending: "平台审核中",
        approved: "已通过",
        rejected: "已拒绝",
      };
      function statusLabel(item) {
        if (item.status !== "rejected") return labels[item.status];
        return item.reviewStage === "platform" ? "平台驳回" : "公会驳回";
      }
      try {
        const savedResults = JSON.parse(
          sessionStorage.getItem("luma-guild-join-review-results-v2") || "{}",
        );
        records.forEach((item) =>
          Object.assign(item, savedResults[item.id] || {}),
        );
      } catch (error) {}
      const requestedTab = new URLSearchParams(location.search).get("tab");
      const validTabs = ["reviewing", "rejected", "approved"];
      let currentTab = validTabs.includes(requestedTab)
        ? requestedTab
        : "reviewing";
      function visibleRecords() {
        return records.filter((item) =>
          currentTab === "reviewing"
            ? ["pending", "platformPending"].includes(item.status)
            : item.status === currentTab,
        );
      }
      function renderList() {
        const items = visibleRecords();
        document.querySelector('[data-tab="reviewing"]').textContent =
          `审核中 ${records.filter((item) => ["pending", "platformPending"].includes(item.status)).length}`;
        document.querySelector('[data-tab="rejected"]').textContent =
          `已驳回 ${records.filter((item) => item.status === "rejected").length}`;
        document.querySelector('[data-tab="approved"]').textContent =
          `已通过 ${records.filter((item) => item.status === "approved").length}`;
        reviewList.innerHTML = items.length
          ? items
              .map(
                (item) =>
                  /* HTML */ `<a
                    class="review-card review-card-no-divider"
                    href="guild-join-review-detail.html?id=${encodeURIComponent(
                      item.id,
                    )}&tab=${currentTab}"
                    ><span class="review-card-head"
                      ><span class="review-user"
                        ><span class="review-avatar">${item.avatar}</span
                        ><span class="review-user-copy"
                          ><b>${item.name}</b><span>${item.id}</span></span
                        ></span
                      ><span class="review-status ${item.status}"
                        >${statusLabel(item)}</span
                      ></span
                    ><span class="review-card-foot"
                      ><strong>${LUMA_FORMAT.dateTime(item.appliedAt)}</strong
                      ><i class="review-arrow" aria-hidden="true">›</i></span
                    ></a
                  >`,
              )
              .join("")
          : '<div class="guild-page-empty"><b>暂无申请</b><span>当前状态下没有入会申请</span></div>';
      }
      function setTab(tab) {
        currentTab = tab;
        document
          .querySelectorAll("[data-tab]")
          .forEach((item) =>
            item.classList.toggle("active", item.dataset.tab === tab),
          );
        const query = tab === "reviewing" ? "" : `?tab=${tab}`;
        history.replaceState(null, "", `guild-join-review.html${query}`);
        renderList();
        window.parent.postMessage(
          { type: "luma-page", file: "guild-join-review.html", query },
          "*",
        );
      }
      document
        .querySelectorAll("[data-tab]")
        .forEach(
          (button) => (button.onclick = () => setTab(button.dataset.tab)),
        );
      document
        .querySelectorAll("[data-tab]")
        .forEach((button) =>
          button.classList.toggle("active", button.dataset.tab === currentTab),
        );
      renderList();
      window.parent.postMessage(
        {
          type: "luma-page",
          file: "guild-join-review.html",
          query: currentTab === "reviewing" ? "" : `?tab=${currentTab}`,
        },
        "*",
      );
    </script>
  </body>
</html>
