<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>首页 · 公会 APP · Luma Live</title>
    <script src="../../../assets/tailwind.js"></script>
    <script src="../../../assets/tokens.js"></script>
    <link rel="stylesheet" href="../../../assets/common.css" />
    <link
      rel="stylesheet"
      href="../../../assets/guild.css?v=20260820-fiat-values-v1"
    />
    <script src="../../../assets/common.js?v=20260818-id-date-time-v1"></script>
    <script src="../../../assets/mock.js?v=20260820-withdrawal-review-v1"></script>
  </head>
  <body>
    <main class="guild-screen">
      <div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <header class="guild-header">
        <a
          class="guild-identity"
          id="guildIdentity"
          href="../auth/guild-switch.html?from=home"
          aria-label="切换公会"
          ><span class="guild-mark" id="guildMark">JS</span
          ><span class="guild-identity-copy"
            ><b id="guildName">Jakarta Star Guild</b
            ><span id="guildId">G10021</span></span
          ><i class="guild-identity-switch">›</i></a
        >
        <div class="guild-header-actions">
          <a
            class="guild-icon-btn"
            href="guild-notifications.html"
            aria-label="通知"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"
              ></path></svg
            ><i class="guild-icon-dot"></i></a
          ><button
            class="guild-icon-btn"
            type="button"
            data-placeholder="账号设置"
            data-route="../management/guild-settings.html"
            aria-label="账号设置"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21a8 8 0 0 1 16 0"></path>
            </svg>
          </button>
        </div>
      </header>
      <a
        class="guild-hero guild-today-overview"
        href="../data/guild-income-day-detail.html?date=2026-08-15&amp;from=home"
        aria-label="查看今日概况"
      >
        <div class="guild-hero-head">
          <span>今日概况</span
          ><span class="guild-overview-detail" aria-hidden="true">›</span>
        </div>
        <div class="guild-income-grid">
          <div class="guild-income-item">
            <b
              ><svg
                class="guild-coin-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M12 3 21 12 12 21 3 12Z"></path></svg
              >428.620</b
            >
          </div>
        </div>
        <div class="guild-today-overview-stats" id="overviewGrid"></div>
      </a>
      <section class="guild-section">
        <div id="functionGroups"></div>
      </section>
    </main>
    <div class="guild-homebar"><i></i></div>
    <script>
      const D = LUMA_MOCK.guildPortal;
      const currentGuild = LUMA_GUILD_CONTEXT.getCurrent();
      function renderOverview(items) {
        overviewGrid.innerHTML = items
          .map(
            (item) =>
              `<div class="overview-item"><span>${item.label}</span><b>${item.value}</b></div>`,
          )
          .join("");
      }
      const functionIcons = {
        入会申请:
          '<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M8.5 11a4 4 0 1 0 0-8M19 8v6M22 11h-6"></path>',
        退会申请:
          '<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M8.5 11a4 4 0 1 0 0-8M16 11h6"></path>',
        主播列表:
          '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>',
        主播业绩:
          '<rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path>',
        直播记录:
          '<rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m10 9 5 3-5 3z"></path>',
        违规记录: '<path d="M12 3 3 20h18zM12 9v5M12 17h.01"></path>',
        公会业绩: '<path d="M4 19V9M10 19V5M16 19v-7M22 19V3"></path>',
        运营指标: '<path d="M3 3v18h18M7 16l4-5 3 3 5-7"></path>',
        公会收益:
          '<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>',
        主播分成: '<path d="M6 2h12v20H6zM9 6h6M9 10h6M9 14h3"></path>',
        公会分成: '<path d="M4 6h16v14H4zM7 3h10v3M8 11h8M8 15h5"></path>',
        运营消息:
          '<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>',
        运营账号:
          '<circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path>',
        公会资料:
          '<path d="M4 21V5a2 2 0 0 1 2-2h9l5 5v13zM14 3v6h6M8 13h8M8 17h6"></path>',
        账号设置:
          '<circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0M19 3v4M17 5h4"></path>',
      };
      function renderFunctions() {
        const routes = {
          入会申请: "../approval/guild-join-review.html",
          退会申请: "../approval/guild-leave-review.html",
          主播列表: "../people/guild-member-list.html",
          主播业绩: "../people/guild-host-list.html",
          直播记录:
            "../data/guild-host-data.html?hostId=all&from=home&hostPeriod=2026-08&rangeStart=2026-08-15&rangeEnd=2026-08-15&shortcut=today",
          违规记录: "../data/guild-all-violations.html",
          公会业绩: "../data/guild-income.html",
          运营指标:
            "../data/guild-income-day-detail.html?date=2026-08-15&from=home",
          主播分成: "../data/guild-share-ledger.html",
          公会分成: "../data/guild-share-income.html",
          运营消息: "../operations/guild-messages.html",
          运营账号: "../operations/guild-operation-accounts.html",
          公会资料: "../management/guild-profile.html",
          账号设置: "../management/guild-settings.html",
        };
        functionGroups.innerHTML = D.functionGroups
          .map((group) => {
            const items = group.items.filter(
              (item) =>
                ![
                  "主播收益",
                  "运营指标",
                  "公会收益",
                  "虚拟金币",
                  "提现审核",
                ].includes(item),
            );
            return `<section class="function-group"><h3>${group.title}</h3><div class="function-grid">${items.map((item) => `<button class="function-action" type="button" data-placeholder="${item}" data-route="${routes[item] || ""}"><span class="function-icon"><svg viewBox="0 0 24 24" aria-hidden="true">${functionIcons[item] || '<circle cx="12" cy="12" r="7"></circle>'}</svg></span>${item}</button>`).join("")}</div></section>`;
          })
          .join("");
      }
      function bindPlaceholderActions(scope = document) {
        scope
          .querySelectorAll("[data-placeholder]")
          .forEach(
            (button) =>
              (button.onclick = () =>
                button.dataset.route
                  ? (location.href = button.dataset.route)
                  : Luma.toast(
                      `${button.dataset.placeholder}页面将在后续补充`,
                    )),
          );
      }
      guildMark.textContent = currentGuild.mark;
      guildName.textContent = currentGuild.name;
      guildId.textContent = currentGuild.id;
      renderOverview(currentGuild.overview);
      renderFunctions();
      bindPlaceholderActions();
      window.parent.postMessage(
        { type: "luma-page", file: "guild-home.html" },
        "*",
      );
    </script>
  </body>
</html>
