<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>UG 代理 App · 二期原型 · 14版规范拆分</title>
<script src="assets/page-data.js"></script>
<script src="assets/annotations.js"></script>
<style>
:root{--primary:#C4A676;--primary-deep:#B08D55;--text-1:#4F4D4D;--text-2:#7C7C7C;--text-3:#999;--border:#E6E2DB;--line:#F0EEEA;--bg:#F7F5F2;--white:#fff;--shadow:0 9px 16px rgba(0,0,0,.10);--font:-apple-system,BlinkMacSystemFont,"PingFang SC","SF Pro Display",sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:var(--font);background:#ebe8e2;color:var(--text-1);font-size:14px}.shell{height:100%;display:grid;grid-template-rows:52px 1fr}.top{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--white);border-bottom:1px solid var(--border)}.top b{font-size:15px;white-space:nowrap}.meta{color:var(--text-3);font-size:12px;white-space:nowrap}.spacer{flex:1}.iconbtn{width:34px;height:34px;border:1px solid var(--border);background:var(--white);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-1);cursor:pointer}.statebar{display:flex;align-items:center;gap:8px;min-width:0}.statebar label{font-size:12px;color:var(--text-2);white-space:nowrap}select{height:34px;border:1px solid var(--border);border-radius:8px;background:var(--white);padding:0 10px;color:var(--text-1);outline:none;max-width:180px}.main{min-height:0;display:grid;grid-template-columns:290px minmax(420px,1fr) 330px}.main.hide-tree{grid-template-columns:0 minmax(420px,1fr) 330px}.main.hide-notes{grid-template-columns:290px minmax(420px,1fr) 0}.main.hide-tree.hide-notes{grid-template-columns:0 1fr 0}.tree,.notes{background:var(--white);overflow:auto}.tree{border-right:1px solid var(--border);padding:12px}.notes{border-left:1px solid var(--border)}.hide-tree .tree,.hide-notes .notes{padding:0;border:0;overflow:hidden}.search{width:100%;height:38px;border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:0 11px;outline:none;margin-bottom:12px}.grp{margin-bottom:8px}.grp-h{font-size:12px;font-weight:700;color:var(--text-2);padding:8px 7px}.node{display:flex;gap:8px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;color:var(--text-1);cursor:pointer}.node:hover{background:var(--bg)}.node.active{background:var(--primary);color:#fff}.node code{font-size:11px;color:inherit;opacity:.75;min-width:40px}.stage{min-width:0;overflow:auto;padding:26px 24px 60px;display:flex;justify-content:center;align-items:flex-start}.phone{width:400px;height:854px;background:#1C1C1E;border-radius:44px;padding:5px;box-shadow:0 24px 48px rgba(0,0,0,.18);flex:none;transform-origin:top center}.phone iframe{width:390px;height:844px;border:0;border-radius:40px;background:#F7F5F2;display:block}.notes-h{position:sticky;top:0;background:var(--white);border-bottom:1px solid var(--border);padding:14px 16px;font-weight:700}.notes-b{padding:14px 16px}.note-block{margin-bottom:16px}.note-k{font-size:11px;font-weight:700;color:var(--text-2);letter-spacing:.4px;margin-bottom:7px}.note-v{font-size:12.5px;line-height:1.75;color:var(--text-1)}.note-v b{color:var(--primary-deep)}.empty-note{color:var(--text-3);font-size:13px;line-height:1.6}@media(max-width:900px){.main,.main.hide-tree,.main.hide-notes{grid-template-columns:1fr}.tree,.notes{display:none}.stage{padding:18px 10px}.phone{transform:scale(.86)}.meta{display:none}.statebar{display:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><button class="iconbtn" id="treeBtn" title="页面树">☰</button><b id="currentTitle">UG 代理 App · 二期原型</b><span class="meta">14版高保真 · 规范拆分 · 离线可打开</span><span class="spacer"></span><div class="statebar" id="statebar"></div><label class="meta" for="zoom">缩放</label><select id="zoom"><option value="1">100%</option><option value="0.9" selected>90%</option><option value="0.8">80%</option></select><button class="iconbtn" id="noteBtn" title="批注面板">◫</button></header>
  <main class="main" id="main"><aside class="tree"><input class="search" id="search" placeholder="搜索页面"/><div id="tree"></div></aside><section class="stage"><div class="phone" id="phone"><iframe id="frame" title="原型预览"></iframe></div></section><aside class="notes"><div class="notes-h" id="noteTitle">页面批注</div><div class="notes-b" id="notes"></div></aside></main>
</div>
<script>
const pages=window.PROTOTYPE_PAGES; const byKey=Object.fromEntries(pages.map(p=>[p.key,p])); let currentKey='home'; let currentState=byKey[currentKey].defaultState; const historyStack=[];
const tree=document.getElementById('tree'), frame=document.getElementById('frame'), search=document.getElementById('search'), main=document.getElementById('main'), phone=document.getElementById('phone');
function firstState(p){return p.defaultState||Object.keys(Object.values(p.states||{})[0]||{})[0]||'default'}
function renderTree(){const q=search.value.trim().toLowerCase(); const groups={}; pages.forEach(p=>{if(q&&!p.title.toLowerCase().includes(q)&&!p.key.includes(q))return;(groups[p.group]||=[]).push(p)}); tree.innerHTML=Object.entries(groups).map(([g,list])=>'<div class="grp"><div class="grp-h">'+g+'</div>'+list.map(p=>'<button class="node '+(p.key===currentKey?'active':'')+'" data-key="'+p.key+'"><code>'+p.title.split(' ')[0]+'</code><span>'+p.title.replace(/^\S+\s*/, '')+'</span></button>').join('')+'</div>').join(''); tree.querySelectorAll('.node').forEach(btn=>btn.onclick=()=>openPage(btn.dataset.key));}
function renderStates(){const page=byKey[currentKey]; const groups=page.states||{}; document.getElementById('statebar').innerHTML=Object.entries(groups).map(([label,opts])=>'<label>'+label+'</label><select>'+Object.entries(opts).map(([value,text])=>'<option value="'+value+'" '+(value===currentState?'selected':'')+'>'+text+'</option>').join('')+'</select>').join(''); document.querySelectorAll('#statebar select').forEach(sel=>sel.onchange=()=>setState(sel.value));}
function renderNotes(){const page=byKey[currentKey]; document.getElementById('currentTitle').textContent=page.title; document.getElementById('noteTitle').textContent=page.title+' · 批注'; const notes=(window.getPrototypeAnnotations&&window.getPrototypeAnnotations(currentKey))||[]; document.getElementById('notes').innerHTML=notes.length?notes.map(([k,v])=>'<div class="note-block"><div class="note-k">'+k+'</div><div class="note-v">'+v+'</div></div>').join(''):'<div class="empty-note">该页暂无额外批注，按页面可见内容开发。</div>';}
function loadFrame(){const p=byKey[currentKey]; frame.src='pages/'+p.file+'?state='+encodeURIComponent(currentState);}
function openPage(key,state){if(!byKey[key])return; if(key!==currentKey||state!==currentState){historyStack.push([currentKey,currentState]);} currentKey=key; currentState=state||firstState(byKey[key]); renderTree(); renderStates(); renderNotes(); loadFrame();}
function setState(state){currentState=state; renderStates(); renderNotes(); loadFrame();}
function routeToPage(routeId){const r=(window.PROTOTYPE_ROUTES||{})[routeId]; return r&&{pageKey:r[0],state:r[1]};}
window.addEventListener('message',e=>{const d=e.data||{}; if(d.type==='proto:navigate') openPage(d.pageKey,d.state); if(d.type==='proto:back'){const last=historyStack.pop(); if(last){currentKey=last[0];currentState=last[1];renderTree();renderStates();renderNotes();loadFrame();return;} const routeId=Object.entries(window.PROTOTYPE_ROUTES||{}).find(([id,r])=>r[0]===currentKey&&r[1]===currentState)?.[0]; const parent=routeId&&routeToPage((window.PROTOTYPE_ROUTE_PARENTS||{})[routeId]); if(parent) openPage(parent.pageKey,parent.state);}});
search.oninput=renderTree; document.getElementById('treeBtn').onclick=()=>main.classList.toggle('hide-tree'); document.getElementById('noteBtn').onclick=()=>main.classList.toggle('hide-notes'); document.getElementById('zoom').onchange=e=>phone.style.transform='scale('+e.target.value+')'; phone.style.transform='scale(.9)'; renderTree(); renderStates(); renderNotes(); loadFrame();
</script>
</body>
</html>
